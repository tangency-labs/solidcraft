# cargo-nextest settings for CI. `cargo xtask test` runs libtest, but asks `cargo nextest list` for
# the ci profile's default filter below, to leave out the same heavy tests (xtask/src/heavy.rs).
# CI builds the tests once and runs them in one job on a 32 vCPU runner (.github/workflows/ci.yml),
# except the GPU path tests (gpu-path below), which run in four shards of their own.
# Those shards also cover the progressive UI render when they run; otherwise it stays in the native job.

[profile.ci]
# Heavy tests (up to four minutes each on a CI runner) that pull requests and local runs
# (`cargo xtask test`, `cargo xtask ci`) skip. They run in the merge queue, on every push to main
# and nightly (`--ignore-default-filter`), and locally with SOLIDCRAFT_TEST_HEAVY=1. Most are slow
# because the kernel is slow on what they guard, not because they are large. The boolean_props
# property tests run only nightly (ci.yml excludes them from pushes to main).
# Keep this list in sync with docs/book/src/dev/testing.md and CONTRIBUTING.md.
default-filter = """
not (
    (package(solidcraft-engine) & (
        test(=tests::hostile_params_never_panic)
        | test(/^tests::robustness::/)
        | test(=tests::a_round_whose_contact_line_misses_the_seam_it_joins_across_names_the_radius_that_fits)
        | test(=cmd::sheet::tests::perforated_sheet_takes_a_thousand_round_holes)
        | test(=pattern_suppress_tests::enclosure_arc_extinction_keeps_a_real_sharp_inner_lip_after_resize_and_reopen)
        | test(=pattern_suppress_tests::enclosure_datums_follow_wall_height_and_board_depth_with_material_proofs)
        | test(=cmd::plastic::tests::enclosure_snap_fit_follows_resized_front_wall)
    ))
    | (package(solidcraft-kernel) & test(=tests::loft_through_sections_whose_match_is_past_the_skins_bound_builds))
    | (package(solidcraft-kernel) & binary(boolean_props))
    | (package(solidcraft-engine) & binary(atomic_commands))
    | (package(solidcraft-ui-egui) & binary(scenarios) & test(=acceptance_sensor_enclosure))
)
"""
fail-fast = false
# Every test's time in the log, so the slow ones are easy to find.
status-level = "pass"
final-status-level = "slow"
failure-output = "immediate-final"
slow-timeout = { period = "60s" }

[profile.ci.junit]
path = "junit.xml"

# Bound the whole test process, including Vulkan host initialization and teardown.
# Cold runs can warm multiple pipelines before the first image starts rendering.
[[profile.ci.overrides]]
filter = "package(=solidcraft-ui-egui) & test(=render_workspace::tests::progressive_image_controls_route_to_the_registered_host)"
slow-timeout = { period = "60s", terminate-after = 20 }

# The action matrix sample runs its designs in parallel workers (ACTION_MATRIX_JOBS, set to match in
# ci.yml). Its workers reserve that many of nextest's threads, so the cores are not oversubscribed
# (a pi-case hole that takes 8 s alone went past the matrix's 90 s action limit when they were),
# and it starts first, beside the other slow tests.
[[profile.ci.overrides]]
filter = "binary(action_matrix) & test(=action_matrix_sample)"
threads-required = 12
priority = 100

# The slowest tests start first, so a shard does not end with one of them running alone on a
# core while the others sit idle. Medians from the CI test timings (the junit artifacts), slowest
# first; a test over ~100 s belongs here (the medians of 24 full runs added the last ones, #14362,
# and a full local run the smlib and fit-search ones).
[[profile.ci.overrides]]
filter = """
(package(solidcraft-engine) & (
    test(/^tests::robustness::/)
    | test(=tests::hostile_params_never_panic)
    | test(=tests::pleat_join::the_pleats_join_at_every_wall_from_2_4_to_2_6_mm)
    | test(=cmd::sheet::tests::perforated_sheet_takes_a_thousand_round_holes)
    | test(=tests::join_onto_a_finely_faceted_import)
    | test(=tests::chord_and_variable_fillets)
    | test(=cmd::joints::tests::motion_sweep::find_limits_sees_arms_meet_behind_pins_already_in_each_other)
    | test(=thread_tests::a_multi_start_thread_takes_the_volume_of_one_start)
    | test(=thread_tests::a_thread_reaches_a_flat_shoulder_at_every_angle_and_leaves_it_whole)
    | test(=tests::curved_seam_round::a_round_and_a_chamfer_on_the_end_circle_of_a_bent_lofted_tube_build)
    | test(=cmd::sheet::convert_tests::cuts::cuts_take_what_each_takes_alone_in_any_order_folded_or_flat)
))
| (package(solidcraft-engine) & (binary(atomic_commands) | binary(step_export_regressions)))
| (package(solidcraft-kernel) & (
    test(/^issue_788_tests::equal_bores_crossing_/)
    | test(=corner_g2::tests::a_long_setback_keeps_the_g2_patch_inside_the_box)
    | test(=blend_corner::tests::issue1557_connected_rounds_keep_their_radii)
    | test(=blend::tests::a_fit_search_finds_a_round_on_the_revolved_shelled_ring)
))
| (package(solidcraft-smlib) & (
    (binary(ssi_corpus) & test(=solidcore_global_intersect_at_1e_6))
    | test(=ops::tests::offset_face_beside_a_round_all_round_a_spline_outline_moves_the_round)
))
| (package(solidcraft-cli) & binary(naming_corpus) & test(=corpus_designs_name_alike_every_build_and_fail_where_a_reference_is_gone))
| (package(solidcraft-ui-egui) & (
    test(=dialogs::dense::tests::a_saved_smooth_patch_reopens_with_its_setback)
    | test(=dialogs::dense::tests::no_reachable_fillet_option_state_is_refused_for_its_options)
    | binary(icon_audit)
))
"""
priority = 99

# Each nextest test has its own process/device. Concurrent cold lavapipe path
# compiles contend for CPU and can exhaust the 600 s pipeline setup budget.
# Serialize these tests per CI shard; other tests retain their normal parallelism.
# CI runs these in their own job (GPU path tests in ci.yml), split into count partitions.
[test-groups.gpu-path]
max-threads = 1

[[profile.ci.overrides]]
filter = """
(package(=solidcraft-gpu) & test(/^path::/))
| (package(=solidcraft-ui-egui) & test(=render_workspace::tests::progressive_image_controls_route_to_the_registered_host))
"""
test-group = "gpu-path"

# Full local validation opts into its own scheduling policy. Keep GitHub CI's
# worker reservation and slow-test priorities above independent of this runner.
[profile.local-ci]
inherits = "ci"

[[profile.local-ci.overrides]]
filter = "binary(action_matrix) & test(=action_matrix_sample)"
threads-required = "num-cpus"
priority = 100

[[profile.local-ci.overrides]]
filter = """
(package(solidcraft-engine) & (
    test(/^tests::robustness::/)
    | test(=tests::hostile_params_never_panic)
    | test(=tests::pleat_join::the_pleats_join_at_every_wall_from_2_4_to_2_6_mm)
    | test(=cmd::sheet::tests::perforated_sheet_takes_a_thousand_round_holes)
    | test(=tests::curved_seam_round::a_round_and_a_chamfer_on_the_end_circle_of_a_bent_lofted_tube_build)
))
| (package(solidcraft-engine) & (binary(atomic_commands) | binary(step_export_regressions)))
| (package(solidcraft-kernel) & test(/^issue_788_tests::equal_bores_crossing_/))
| (package(solidcraft-smlib) & (
    (binary(ssi_corpus) & test(=solidcore_global_intersect_at_1e_6))
    | test(=ops::tests::offset_face_beside_a_round_all_round_a_spline_outline_moves_the_round)
))
"""
priority = 98

# Native Windows shader/device creation must not overlap within the local run.
[test-groups.windows-gpu]
max-threads = 1

[[profile.local-ci.overrides]]
platform = "cfg(windows)"
# Viewport tests also open real devices when their names do not contain "gpu".
filter = """
package(solidcraft-gpu) | package(solidcraft) | (package(solidcraft-ui-egui) & (
    test(/(offscreen|gpu)/)
    | test(/^viewport::tests::/)
    | test(=render_workspace::tests::progressive_image_controls_route_to_the_registered_host)
))
"""
test-group = "windows-gpu"
