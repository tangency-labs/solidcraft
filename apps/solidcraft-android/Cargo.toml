[package]
name = "solidcraft-android"
description = "SolidCraft Android launcher (NativeActivity + eframe/wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
solidcraft-engine = { workspace = true }
solidcraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
jni = "0.22"
getrandom = "0.3"
eframe = { workspace = true, features = [
    "default_fonts",
    "wgpu",
    "persistence",
    "android-native-activity",
] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
android_logger = "0.14"

[package.metadata.android]
package = "ai.storyteller.solidcraft"
apk_name = "solidcraft"
build_targets = ["aarch64-linux-android"]
resources = "res"
java_sources = "java"
# Drop debug symbols when copying the .so into the APK (the release profile keeps line tables
# for crash reports, which makes the unstripped library ~500 MB).
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[package.metadata.android.application]
label = "SolidCraft"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
icon = "@mipmap/ic_launcher"

# cargo-apk2 adds no activity on its own: without this table the APK has no entry point at all
# (no launcher icon, nothing to start).
[[package.metadata.android.application.activity]]
name = ".SolidCraftActivity"
label = "SolidCraft"
launch_mode = "singleTask"
orientation = "sensor"
exported = true
config_changes = "orientation|keyboard|keyboardHidden|navigation|screenSize|screenLayout|smallestScreenSize|density|layoutDirection|uiMode|fontScale|locale"
# Declared inline: cargo-apk2's serde flatten rejects a separate [[...activity.intent_filter]] table.
intent_filter = [{ actions = ["android.intent.action.MAIN"], categories = ["android.intent.category.LAUNCHER"] }]

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "solidcraft_android"

[package.metadata.android.signing.release]
path = "../../keys/solidcraft.jks"
keystore_password = "8bfd4d32a8759a955cea85c67522f791"
