[package]
name = "solidcraft-android"
description = "SolidCraft for Android (eframe shell over the shared UI, NativeActivity)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace forbids unsafe; this crate denies it instead so the NativeActivity entry in
# src/lib.rs can allow it (the Activity glue looks up that exported symbol: no safe API, like
# the desktop app's platform shims). Keep the rest in sync with [workspace.lints].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"

# The Activity loads this cdylib (`android.app.lib_name`); the package's only Java is the
# Activity shim in java/ (compiled by cargo-apk2, see java_sources below): NativeActivity
# enters the cdylib at `android_main` in src/lib.rs.
[lib]
name = "solidcraft_android"
crate-type = ["cdylib"]

[dependencies]
solidcraft-engine = { workspace = true }
solidcraft-ui-egui = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
# No `accesskit`: eframe only offers it with android-game-activity, which would put a Kotlin
# build in the package (this shell is NativeActivity, Rust only).
eframe = { workspace = true, features = ["default_fonts", "wgpu", "android-native-activity"] }
egui = { workspace = true }
log = { workspace = true }
# The Storage Access Framework pickers (src/saf.rs): JNI calls to the system's document
# screens, and the native method SolidcraftActivity's onActivityResult answers through.
jni = "0.22"
# The `AndroidApp` handle for `eframe::NativeOptions::android_app`: winit's re-export of
# android-activity, so the glue version is the one winit itself uses.
winit = { version = "0.30", default-features = false }

# cargo-apk2 reads this into the AndroidManifest and packages the cdylib into the APK.
[package.metadata.android]
package = "io.solidcraft"
build_targets = ["aarch64-linux-android"]
apk_name = "solidcraft"
strip = "default"
# The Activity shim (java/), compiled with the JDK's javac and dexed into the package — the
# build must run from this directory so the relative path resolves (it does: cargo apk2
# build lives here; JAVA_HOME must point at a JDK).
java_sources = "java"
# Launcher icons: `cargo xtask app-icons` draws the canonical mipmaps this path holds,
# and cargo-apk2 compiles them with the SDK's aapt2 (`aapt2 link`).
resources = "../../assets/icons/app/android/exports/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "SolidCraft"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
# The package carries code: the Activity shim's dex (java/, see java_sources) is what
# catches the file pickers' answers. cargo-apk2's default activity name is empty.
has_code = true

# cargo-apk2 takes activities as a list (an array of tables). Our own NativeActivity
# subclass: it overrides onActivityResult for the Storage Access Framework pickers, and the
# NativeActivity glue still enters the cdylib at android_main.
[[package.metadata.android.application.activity]]
name = "io.solidcraft.SolidcraftActivity"
orientation = "landscape"
launch_mode = "singleTop"
exported = true

# The Activity finds this cdylib at start-up; cargo-apk2 fills the value from [lib] when the
# value is left out (it does not add the entry itself).
[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"

# Home-screen launcher entry: cargo-apk2 writes only what is here, and it adds no intent filter
# of its own (cargo-apk used to).
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

# "Open with": the file browsers offer SolidCraft for the documents it reads. Android's chooser
# matches a MIME type, never a file name, so this filter names the types the CAD formats travel
# as — and the generic binary type the system falls back to for a format it cannot place (a
# `.solidcraft` design, a `.3mf` mesh). The types must stay in step with `MIME_EXTS` in
# src/saf.rs, which the manifest test checks.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]
data = [
  { scheme = "content" },
  { scheme = "file" },
  { mime_type = "application/octet-stream" },
  { mime_type = "application/x-solidcraft" },
  { mime_type = "model/step" },
  { mime_type = "application/step" },
  { mime_type = "application/x-step" },
  { mime_type = "model/stl" },
  { mime_type = "application/x-stl" },
  { mime_type = "model/iges" },
  { mime_type = "application/x-iges" },
  { mime_type = "model/obj" },
  { mime_type = "application/x-obj" },
  { mime_type = "model/3mf" },
  { mime_type = "model/gltf+json" },
  { mime_type = "model/gltf-binary" },
]

# The same documents by their extension, for a browser that sends a type of its own (or one we
# do not know): the path of a `content://` uri carries the document's name, and the host may be
# any provider, hence the "*". A path is only looked at when the filter names a host, so this
# filter names one.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]
data = [
  { scheme = "content" },
  { host = "*" },
  { mime_type = "*/*" },
  { path_pattern = ".*\\.solidcraft" },
  { path_pattern = ".*\\.step" },
  { path_pattern = ".*\\.stp" },
  { path_pattern = ".*\\.igs" },
  { path_pattern = ".*\\.iges" },
  { path_pattern = ".*\\.fcstd" },
  { path_pattern = ".*\\.3dm" },
  { path_pattern = ".*\\.3mf" },
  { path_pattern = ".*\\.stl" },
  { path_pattern = ".*\\.obj" },
  { path_pattern = ".*\\.gltf" },
  { path_pattern = ".*\\.glb" },
]

# A browser that sends the document without a type at all: only a filter without a type
# matches such an intent.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]
data = [{ scheme = "content" }, { scheme = "file" }]

[dev-dependencies]
# The manifest test reads this package's own metadata (the "Open with" intent filter).
toml = { workspace = true }
