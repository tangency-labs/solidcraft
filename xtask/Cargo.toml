[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
flate2 = "1.1"
proc-macro2 = { workspace = true, features = ["span-locations"] }
quick-xml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true, features = ["visit"] }
toml = { workspace = true }
# `plugin-examples --run`: wraps a module as a component, as `wasm-tools component new` does.
wit-component = { version = "0.254", default-features = false }
zip = { workspace = true }
