# The web app as a container image on GitHub's container registry, for self-hosting
# (packaging/docker; the book's "Self-hosting with Docker"):
#
#   ghcr.io/<owner>/solidcraft-web:latest   the latest published release
#   ghcr.io/<owner>/solidcraft-web:0.14.0   a release (also 0.14); pre-releases get only their version
#   ghcr.io/<owner>/solidcraft-web:edge     main
#
# For linux/amd64 and linux/arm64. The site is built here, as Pages and Release build it, and
# passed to the Dockerfile as its `site` stage. Pull requests that touch the image build and
# smoke-test it without publishing. Releases published by an agent or maintainer trigger this;
# the nightly pre-releases (made with GITHUB_TOKEN) do not.
# A release whose image is missing can be published again from Actions › Docker › Run workflow, with
# `tag` set to its tag (and `latest` ticked for the newest release only); the run builds that tag with this
# workflow and checks that its version reached the registry.
name: Docker

on:
  push:
    branches: [main]
    # The image holds the web app only: documentation, test data and the GitHub bots' scripts can't
    # change it, so a push touching only those builds nothing (edge stays at the last code change).
    # ATTRIBUTION.md is the exception among the Markdown files: the app embeds it (Help, About).
    # The last matching pattern wins.
    paths: ["**", "!docs/**", "!**/*.md", "ATTRIBUTION.md", "!tests/**", "!scripts/claim/**", "!scripts/triage/**"]
  release:
    types: [published]
  pull_request:
    paths: ["packaging/docker/**", ".github/workflows/docker.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "A release tag to build and publish with this workflow (for example v0.45.0); empty builds the chosen branch"
        required: false
        default: ""
      latest:
        description: "Also move :latest to this tag (only for the newest release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A re-run (attempt 2 or later, often of an older commit) gets a group of its own, so it never cancels the live run for the PR's current head.
  # A release, or a tag published by hand, is never cancelled: a newer push to main must not stop it.
  group: docker-${{ inputs.tag || github.ref }}${{ github.run_attempt > 1 && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: v0.21.14

jobs:
  image:
    if: ${{ !github.event.repository.private }}
    # The web app's release build takes about 55 minutes from cold on 2 vCPUs, past a 60-minute limit:
    # build it on the runner and with the time the Pages build has.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Refuse latest without a release tag
        if: github.event_name == 'workflow_dispatch' && inputs.latest && inputs.tag == ''
        run: |
          echo "::error::latest moves only to a release: set tag (for example v0.45.0), or untick latest"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: docker-web
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install trunk
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build the web app
        working-directory: apps/solidcraft-web
        run: trunk build --release
      - name: Image name
        id: image
        # Registry names are lower case; a fork's owner may not be.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/solidcraft-web" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: |
            latest=${{ github.event_name == 'workflow_dispatch' && (inputs.latest && inputs.tag != '' && 'true' || 'false') || 'auto' }}
          # With a hand-given tag, that tag is the only version source, whichever ref the run started from.
          tags: |
            type=semver,pattern={{version}},enable=${{ inputs.tag == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.tag == '' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=edge,branch=main,enable=${{ inputs.tag == '' }}
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=SolidCraft (web)
            org.opencontainers.image.description=SolidCraft, open-source parametric CAD, in the browser: the web app served by nginx on port 8080
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build for the smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          build-contexts: site=dist/web
          platforms: linux/amd64
          load: true
          tags: solidcraft-web:test
      - name: Smoke test
        run: bash packaging/docker/smoke-test.sh solidcraft-web:test
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          build-contexts: site=dist/web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
      - name: Check the release's version is in the registry
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ -z "$VERSION" ]; then echo "::error::no version tag was computed for this release"; exit 1; fi
          docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null || { echo "::error::$IMAGE:$VERSION is not in the registry after publishing"; exit 1; }
          echo "$IMAGE:$VERSION is published"
