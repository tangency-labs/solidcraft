name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job runs on Blacksmith's hosted runners (blacksmith.sh; ephemeral VMs, sponsored
# minutes, outside the org's 20-runner cap): pushes to main, every pull request (fork or not)
# and Run workflow. Builds are cached with actions/cache (Swatinem/rust-cache and the C++
# reference build cache below). To fall back when the sponsorship ends, change the
# `blacksmith-*` labels back to `ubuntu-latest`. A new push to a PR supersedes the run on its
# previous head, so cancel it. Runs on main are keyed by commit, so they never queue behind or
# cancel each other: every merge is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Must match ATTRIBUTION.md / AGENTS.md (full SHA so a shallow fetch works).
  UPSTREAM_REPO: https://github.com/NVIDIA-Omniverse/usd-brep
  UPSTREAM_COMMIT: c9c5979f04cea8c38213004d4f04df0dcfb40d05  # c9c5979

jobs:
  fmt:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: cargo test --workspace

  wasm:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p solidcore --target wasm32-unknown-unknown

  # Same packaging check the release workflow runs before publishing (no secrets).
  publish-dry-run:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: cargo publish -p solidcore --locked --dry-run

  deny:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  difftest:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    needs: [test]
    env:
      SOLIDCORE_CPP_DIR: ${{ github.workspace }}/.cpp
    steps:
      - uses: actions/checkout@v4

      - name: Skip when no unit is green
        id: green
        run: |
          if [ -f plan/modules.toml ] && grep -Eq '^\s*status\s*=\s*"green"' plan/modules.toml; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No green units in plan/modules.toml; nothing to difftest."
          fi

      - name: Clone upstream at pinned commit
        if: steps.green.outputs.any == 'true'
        run: |
          git init upstream
          git -C upstream remote add origin "$UPSTREAM_REPO"
          git -C upstream fetch --depth 1 origin "$UPSTREAM_COMMIT" \
            || git -C upstream fetch origin
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"

      # sccache caches the ~200 shim objects solidcore-ffi compiles (the cc crate wraps the
      # C++ compiler in RUSTC_WRAPPER when it is sccache) and the workspace crates, which
      # rust-cache does not keep; both survive across runs in the GitHub Actions cache.
      - name: Set up sccache
        if: steps.green.outputs.any == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Enable sccache
        if: steps.green.outputs.any == 'true'
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          # The difftest run is idle for sccache for ~20 min; without this the server
          # exits after 10 idle minutes and the stats printed at the end read zero.
          echo "SCCACHE_IDLE_TIMEOUT=0" >> "$GITHUB_ENV"

      # The C++ reference (bin/cpp/lib) comes prebuilt from the GitHub Release that
      # .github/workflows/cpp-reference.yml publishes for scripts/cpp-ref-key.sh's key.
      # When none matches (a PR that changes harness/cpp before it is published), build it
      # from source and keep that build in actions/cache under the same key. It lives
      # outside cargo's target dir (bin/): rust-cache's post-step cleans bin/.
      - name: C++ reference key
        if: steps.green.outputs.any == 'true'
        id: cppkey
        run: echo "key=$(scripts/cpp-ref-key.sh)" >> "$GITHUB_OUTPUT"

      - name: Restore C++ reference built from source
        if: steps.green.outputs.any == 'true'
        id: cppcache
        uses: actions/cache/restore@v4
        with:
          path: .cpp
          key: cpp-v3-${{ runner.os }}-${{ steps.cppkey.outputs.key }}

      - name: Fetch C++ reference (build it when no prebuilt matches)
        if: steps.green.outputs.any == 'true'
        id: cpp
        run: |
          cpp=$SOLIDCORE_CPP_DIR
          if [ -f "$cpp/lib/libSMLib.a" ] && [ -f "$cpp/lib/libSM_API.a" ] && [ -f "$cpp/ffi.env" ]; then
            echo "C++ reference restored from cache"
            exit 0
          fi
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          rc=0
          scripts/fetch-cpp.sh --no-build || rc=$?
          if [ "$rc" = 3 ]; then
            sudo apt-get update && sudo apt-get install -y ninja-build cmake g++
            harness/cpp/build.sh --no-tests --jobs "$(nproc)"
            echo "built=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" != 0 ]; then
            exit "$rc"
          fi

      - name: Save C++ reference built from source
        if: steps.green.outputs.any == 'true' && steps.cpp.outputs.built == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cpp
          key: cpp-v3-${{ runner.os }}-${{ steps.cppkey.outputs.key }}

      - uses: Swatinem/rust-cache@v2
        if: steps.green.outputs.any == 'true'
        with:
          workspaces: ". -> bin"
          key: difftest

      # The clippy job above cannot see code behind the cpp feature (ffi bindings and
      # the difftest unit runners); lint it here, where the C++ headers exist.
      # difftest/cpp enables solidcore-ffi/cpp and registers the runners.
      - name: Clippy with the C++ feature
        if: steps.green.outputs.any == 'true'
        run: cargo clippy --workspace --all-targets --features difftest/cpp -- -D warnings

      - name: Difftest green units
        if: steps.green.outputs.any == 'true'
        # Optimised profile (Cargo.toml [profile.difftest]): identical results, about 20x
        # faster than the debug build that used to take ~35 min here. --jobs 0: one child
        # process per unit, one per vCPU (same output and reports as a serial run).
        run: cargo run --profile difftest -p difftest --features cpp -- --green --jobs 0

      # The runners' own unit tests (guards, decoders, probes) need the C++ reference, so
      # the test job cannot run them. Same profile as above: only the test harness of the
      # difftest crate is compiled on top of that build.
      - name: Difftest runner tests
        if: steps.green.outputs.any == 'true'
        run: cargo test --profile difftest -p difftest --features cpp

      - name: sccache stats
        if: always() && steps.green.outputs.any == 'true'
        run: sccache --show-stats || true
