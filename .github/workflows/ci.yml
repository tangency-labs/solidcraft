name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each PR merged with the latest main (and the PRs ahead of it).
  merge_group:
  workflow_dispatch:

# Every job runs on Blacksmith's hosted runners (blacksmith.sh; ephemeral VMs, sponsored
# minutes, outside the org's 20-runner cap): pushes to main, every pull request (fork or not)
# and Run workflow. Builds are cached with actions/cache (Swatinem/rust-cache and the C++
# reference build cache below). To fall back when the sponsorship ends, change the
# `blacksmith-*` labels back to `ubuntu-latest`. A new push to a PR supersedes the run on its
# previous head, so cancel it. Runs on main are keyed by commit, so they never queue behind or
# cancel each other: every merge is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Must match ATTRIBUTION.md / AGENTS.md (full SHA so a shallow fetch works).
  UPSTREAM_REPO: https://github.com/NVIDIA-Omniverse/usd-brep
  UPSTREAM_COMMIT: c9c5979f04cea8c38213004d4f04df0dcfb40d05  # c9c5979

jobs:
  fmt:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  # Shell tests for the CI scripts (no Rust build; a few seconds).
  ci-scripts:
    runs-on: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'self-hosted-fast' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/ci/test-difftest-baseline.sh

  clippy:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    env:
      SOLIDCORE_CPP_DIR: ${{ github.workspace }}/.cpp
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The plain run above cannot see code behind the cpp feature (ffi bindings and the
      # difftest unit runners); lint it too, with the C++ headers in place.
      # difftest/cpp enables solidcore-ffi/cpp and registers the runners.
      - uses: ./.github/actions/cpp-reference
      - name: Clippy with the C++ feature
        run: cargo clippy --workspace --all-targets --features difftest/cpp -- -D warnings

  test:
    runs-on: blacksmith-8vcpu-ubuntu-2404
    env:
      SOLIDCORE_CPP_DIR: ${{ github.workspace }}/.cpp
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      # tests/primitives_solid.rs takes minutes unoptimised, so its four tests are
      # skipped here and run once, optimised, in the next step (the difftest-profile
      # solidcore it builds is the one the runner tests below reuse).
      - run: >-
          cargo test --workspace -- --exact
          --skip complete_spheres_and_tori_have_analytic_properties
          --skip primitives_are_closed_solids_with_analytic_properties
          --skip precise_sphere_properties_scale_and_translate
          --skip pole_free_sphere_tolerance_is_explicit_and_validated
      - name: Primitives solid tests (difftest profile)
        run: cargo test --profile difftest -p solidcore --test primitives_solid
      # Solids: the primitives example's per-shape results (built, blocker, checks) for
      # the site's Solids page. It reuses the difftest-profile build above and exits 1
      # while any primitive fails, so only a crash (or a missing JSON) fails the job.
      - name: Solids report (primitives example)
        run: |
          set +e
          cargo run --profile difftest -p solidcore --example primitives -- --json reports/solids/solids.json
          rc=$?
          set -e
          [ "$rc" -le 1 ] && test -s reports/solids/solids.json
      # main's solids report is published from here (site), never committed.
      - name: Upload solids report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: solids-report
          path: reports/solids/solids.json
          if-no-files-found: error
          retention-days: 90
      # The difftest runners' own unit tests (guards, decoders, probes) need the C++
      # reference. Same profile as the difftest job's binary (Cargo.toml
      # [profile.difftest]); here rather than after the difftest run, so they no longer
      # add to its wall time.
      - uses: ./.github/actions/cpp-reference
      - name: Difftest runner tests
        run: cargo test --profile difftest -p difftest --features cpp

  wasm:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p solidcore --target wasm32-unknown-unknown

  # Same packaging check the release workflow runs before publishing (no secrets).
  publish-dry-run:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: cargo publish -p solidcore --locked --dry-run

  deny:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  difftest:
    # Starts with the other jobs (no `needs`): it is the critical path, and the merge queue
    # requires every job anyway. Clippy with the cpp feature and the runner tests run in
    # the clippy and test jobs, in parallel with this one.
    runs-on: blacksmith-16vcpu-ubuntu-2404
    permissions:
      contents: read
      actions: read  # scripts/fetch-reports.sh reads main's report artifact
    env:
      SOLIDCORE_CPP_DIR: ${{ github.workspace }}/.cpp
    steps:
      - uses: actions/checkout@v4

      - name: Skip when no unit is green
        id: green
        run: |
          if grep -Eqs '^\s*status\s*=\s*"(green|partial)"' plan/units/*.toml; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No green units in plan/units/; nothing to difftest."
          fi

      - name: Upstream sources, sccache and the C++ reference
        if: steps.green.outputs.any == 'true'
        uses: ./.github/actions/cpp-reference

      - uses: Swatinem/rust-cache@v2
        if: steps.green.outputs.any == 'true'
        with:
          workspaces: ". -> bin"
          key: difftest

      # Reports are not committed. main's latest set (uploaded below) only orders the
      # --jobs queue, slowest unit first (times.tsv: each unit's wall time in main's last
      # run; else its case count; without either, an estimate from its fixtures).
      - name: Fetch main's difftest reports (queue order)
        if: steps.green.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-reports.sh || echo "no previous reports; queue ordered by fixture size"

      # The committed reports of the base commit (main for a PR, the previous main for a
      # push) are the ratchet's baseline: no case that passed there may disappear, stop
      # passing or stop comparing values (crates/difftest/README.md, "Regression gate").
      # A failed fetch or extraction fails the job (it must never fall back to running
      # --green without a baseline); only a push without a base commit or a manual run
      # skips the ratchet. See scripts/ci/difftest-baseline.sh.
      - name: Baseline reports from the base commit
        if: steps.green.outputs.any == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          arg=$(scripts/ci/difftest-baseline.sh "$EVENT" "$BASE" "$RUNNER_TEMP/difftest-baseline")
          if [ -z "$arg" ]; then
            echo "::notice::no base commit for this $EVENT run; the difftest ratchet is skipped"
          fi
          echo "DIFFTEST_BASELINE=$arg" >> "$GITHUB_ENV"

      - name: Difftest green units
        if: steps.green.outputs.any == 'true'
        # Optimised profile (Cargo.toml [profile.difftest]): identical results, about 20x
        # faster than the debug build that used to take ~35 min here.
        run: cargo run --profile difftest -p difftest --features cpp -- --green $DIFFTEST_BASELINE

      # Sensitivity: a runner whose comparison would not notice a changed output fails.
      - name: Difftest perturbation check
        if: steps.green.outputs.any == 'true'
        run: cargo run --profile difftest -p difftest --features cpp -- --green --perturb
