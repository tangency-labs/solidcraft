name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pushes to main run on the org's self-hosted runners (`self-hosted-fast`): everything but
# cargo-deny, which is a container action. Every pull request (fork or not) and Run workflow
# use Blacksmith's hosted runners (blacksmith.sh; ephemeral VMs like GitHub's, outside the
# org's 20-runner cap), so PRs never queue behind main. To fall back when Blacksmith minutes
# run out, change the `blacksmith-*` labels below back to `ubuntu-latest`. The
# self-hosted runners keep their Cargo build directory and the C++ reference build between jobs
# (scripts/ci/warm-target.sh) instead of using actions/cache, and refuse any other job.
# The org shares 20 concurrent runners across all its repositories. A new push to a
# PR supersedes the run on its previous head, so cancel it. Runs on main are keyed
# by commit, so they never queue behind or cancel each other: every merge is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Must match ATTRIBUTION.md / AGENTS.md (full SHA so a shallow fetch works).
  UPSTREAM_REPO: https://github.com/NVIDIA-Omniverse/usd-brep
  UPSTREAM_COMMIT: c9c5979f04cea8c38213004d4f04df0dcfb40d05  # c9c5979
  # True when the job runs on the org's self-hosted-fast runners (same test as runs-on).
  # Blacksmith runners also report runner.environment == 'self-hosted', so steps branch
  # on this instead.
  ON_ORG_RUNNERS: ${{ github.event_name == 'push' }}

jobs:
  fmt:
    runs-on: ${{ github.event_name == 'push' && 'self-hosted-fast' || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ${{ github.event_name == 'push' && 'self-hosted-fast' || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v4
      - name: Warm build directory (self-hosted runner)
        if: env.ON_ORG_RUNNERS == 'true'
        run: scripts/ci/warm-target.sh
      - if: env.ON_ORG_RUNNERS != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ${{ github.event_name == 'push' && 'self-hosted-fast' || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v4
      - name: Warm build directory (self-hosted runner)
        if: env.ON_ORG_RUNNERS == 'true'
        run: scripts/ci/warm-target.sh
      - if: env.ON_ORG_RUNNERS != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: cargo test --workspace

  wasm:
    runs-on: ${{ github.event_name == 'push' && 'self-hosted-fast' || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v4
      - name: Warm build directory (self-hosted runner)
        if: env.ON_ORG_RUNNERS == 'true'
        run: scripts/ci/warm-target.sh
      - if: env.ON_ORG_RUNNERS != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p solidcore --target wasm32-unknown-unknown

  # Same packaging check the release workflow runs before publishing (no secrets).
  publish-dry-run:
    runs-on: ${{ github.event_name == 'push' && 'self-hosted-fast' || 'blacksmith-4vcpu-ubuntu-2404' }}
    steps:
      - uses: actions/checkout@v4
      - name: Warm build directory (self-hosted runner)
        if: env.ON_ORG_RUNNERS == 'true'
        run: scripts/ci/warm-target.sh
      - if: env.ON_ORG_RUNNERS != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
      - run: cargo publish -p solidcore --locked --dry-run

  deny:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  difftest:
    runs-on: ${{ github.event_name == 'push' && 'self-hosted-fast' || 'blacksmith-8vcpu-ubuntu-2404' }}
    needs: [test]
    env:
      SOLIDCORE_CPP_DIR: ${{ github.workspace }}/.cpp
    steps:
      - uses: actions/checkout@v4

      - name: Skip when no unit is green
        id: green
        run: |
          if [ -f plan/modules.toml ] && grep -Eq '^\s*status\s*=\s*"green"' plan/modules.toml; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "No green units in plan/modules.toml; nothing to difftest."
          fi

      - name: Clone upstream at pinned commit
        if: steps.green.outputs.any == 'true'
        run: |
          git init upstream
          git -C upstream remote add origin "$UPSTREAM_REPO"
          git -C upstream fetch --depth 1 origin "$UPSTREAM_COMMIT" \
            || git -C upstream fetch origin
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"

      # Preinstalled on the self-hosted runners, which have no sudo.
      - name: Install C++ build tools
        if: steps.green.outputs.any == 'true' && env.ON_ORG_RUNNERS != 'true'
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake g++

      # The C++ build lives outside cargo's target dir (bin/): rust-cache's post-step
      # cleans bin/ before this cache saves, which once cached an empty bin/cpp.
      # The self-hosted runners keep their C++ build in their home instead: their newer
      # compiler and glibc must never reach GitHub's runners through this cache.
      - name: Keep the C++ reference build (self-hosted runner)
        if: steps.green.outputs.any == 'true' && env.ON_ORG_RUNNERS == 'true'
        env:
          KEY: ${{ env.UPSTREAM_COMMIT }}-${{ hashFiles('harness/cpp/CMakeLists.txt', 'harness/cpp/build.sh', 'harness/cpp/stubs/**', 'harness/cpp/patches/**') }}
        run: |
          dir="$HOME/cpp/$KEY"
          # Only the current build is kept.
          find "$HOME/cpp" -mindepth 1 -maxdepth 1 ! -name "$KEY" -exec rm -rf {} + 2>/dev/null || true
          mkdir -p "$dir"
          echo "SOLIDCORE_CPP_DIR=$dir" >> "$GITHUB_ENV"
      - name: Cache C++ reference build
        if: steps.green.outputs.any == 'true' && env.ON_ORG_RUNNERS != 'true'
        uses: actions/cache@v4
        with:
          path: .cpp
          # Shims are compiled by solidcore-ffi, not by build.sh, so they stay out of the key.
          key: cpp-v2-${{ runner.os }}-${{ env.UPSTREAM_COMMIT }}-${{ hashFiles('harness/cpp/CMakeLists.txt', 'harness/cpp/build.sh', 'harness/cpp/stubs/**', 'harness/cpp/patches/**') }}

      - name: Build C++ reference (when the cache did not provide the libs)
        if: steps.green.outputs.any == 'true'
        run: |
          cpp=$SOLIDCORE_CPP_DIR
          if [ -f "$cpp/lib/libSMLib.a" ] && [ -f "$cpp/lib/libSM_API.a" ] && [ -f "$cpp/ffi.env" ]; then
            echo "C++ reference restored from cache"
          else
            harness/cpp/build.sh --jobs "$(nproc)"
          fi

      - name: Warm build directory (self-hosted runner)
        if: steps.green.outputs.any == 'true' && env.ON_ORG_RUNNERS == 'true'
        run: scripts/ci/warm-target.sh
      - uses: Swatinem/rust-cache@v2
        if: steps.green.outputs.any == 'true' && env.ON_ORG_RUNNERS != 'true'
        with:
          workspaces: ". -> bin"
          key: difftest

      # The clippy job above cannot see code behind the cpp feature (ffi bindings and
      # the difftest unit runners); lint it here, where the C++ headers exist.
      # difftest/cpp enables solidcore-ffi/cpp and registers the runners.
      - name: Clippy with the C++ feature
        if: steps.green.outputs.any == 'true'
        run: cargo clippy --workspace --all-targets --features difftest/cpp -- -D warnings

      - name: Difftest green units
        if: steps.green.outputs.any == 'true'
        # Optimised profile (Cargo.toml [profile.difftest]): identical results, about 20x
        # faster than the debug build that used to take ~35 min here.
        run: cargo run --profile difftest -p difftest --features cpp -- --green
