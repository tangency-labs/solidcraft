# SolidCore's slow checks, too expensive for every pull request: SolidCore's own nightly
# (solidcore/.github/workflows/nightly.yml), run from solidcore/, since GitHub does not run a
# subfolder's workflows.
name: SolidCore nightly

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solidcore-nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  slow:
    name: SolidCore slow checks
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 240
    defaults:
      run:
        working-directory: solidcore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain (solidcore/rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      # solidcore/.github/actions/upstream, run from solidcore/ (a composite action's steps would
      # run from the repository root): usd-brep at the pin in scripts/upstream-pin.env.
      - name: Upstream sources (TestFiles)
        run: |
          while IFS='=' read -r k v; do
            case "$k" in
              UPSTREAM_REPO|UPSTREAM_VERSION|UPSTREAM_COMMIT) export "$k=$v" ;;
            esac
          done < scripts/upstream-pin.env
          git init upstream
          git -C upstream remote add origin "$UPSTREAM_REPO"
          git -C upstream fetch --depth 1 origin "$UPSTREAM_COMMIT" \
            || git -C upstream fetch origin
          git -C upstream checkout --detach "$UPSTREAM_COMMIT"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "solidcore -> bin"
          key: solidcore-nightly

      # Owner-approved (2026-10-26): a regression too slow for every PR (~3 min): the
      # tiny-scale torus booleans finish under MAX_SOLVE_BRANCHES (geom::global_solver).
      - name: Slow regressions
        if: ${{ !cancelled() }}
        run: cargo test -p solidcore --release --test max_solve_branches_tiny_torus -- --ignored

      # Owner-approved (2026-10-27): the SolidCraft whole-corpus harness checks (every
      # case reaches a verdict; every deferral names a plan unit) take minutes even
      # optimised, so they run here instead of on every pull request.
      - name: SolidCraft corpus harness checks
        if: ${{ !cancelled() }}
        run: >-
          cargo test --profile goldens -p goldens --lib -- --ignored --exact
          solidcraft::tests::every_case_reaches_a_verdict_without_a_harness_error
          solidcraft::tests::deferrals_name_a_plan_unit
