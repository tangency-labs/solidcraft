name: Bug report
description: Something in SolidCraft does the wrong thing
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Inside the app, **Report an Issue** fills most of this in for you, with the command, its settings and your environment.
        Before reporting a boolean or modelling failure, please try to reproduce it on the latest nightly or a build from current `main`, and say which build you used.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        What you clicked or typed, in order. For a problem on a particular design, `solidcraft-cli script design.sc --out repro.json` turns its history into a script that `solidcraft-cli eval repro.json` replays; attach it, trimmed to the failing step if you can.
        Using an AI agent with SolidCraft's MCP server? The `solidcraft-reporting` skill in [`skills/`](https://github.com/tangency-labs/solidcraft/tree/main/skills) has it reproduce the problem in a fresh design and write these steps for you.

        GitHub does not accept `.solidcraft` attachments. To attach the design itself, attach it as a `.zip`: use **Save design to attach (.zip)…** in the app's report draft, or rename `name.solidcraft` to `name.solidcraft.zip`. Only attach a design that can be shared publicly.
      placeholder: |
        1. Sketch a circle on the XY plane
        2. Extrude it 10 mm
        3. Fillet the top edge with 6 mm
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SolidCraft version and OS
      description: Help → About shows the version.
      placeholder: 0.15.0, Windows 11
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or recording
      description: |
        For anything you can see in the app, a screenshot or short recording of a small example helps the most. Please leave out private designs and personal details.
