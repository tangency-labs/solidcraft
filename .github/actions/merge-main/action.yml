# Put a pull request on today's tip of its base branch (main), right after actions/checkout.
# GitHub's refs/pull/N/merge is computed when the PR is pushed and can be hours old by the time a
# job (or a re-run) checks it out, so a run could test against a main from before a CI fix. This
# merges the PR's head onto the base branch as it is now, with --no-ff so HEAD~1 stays the code
# the PR lands on (`cargo xtask app-geometry` judges HEAD against HEAD~1) and HEAD^2 the PR's head.
# Pull requests only: merge groups and pushes already test what lands. Use it after the checkout:
#   - uses: ./.github/actions/merge-main
name: Merge today's main
description: On a pull request, test the PR merged onto the current tip of its base branch.
runs:
  using: composite
  steps:
    - name: Merge today's main
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash "$GITHUB_ACTION_PATH/merge-main.sh"
