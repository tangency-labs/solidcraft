[package]
name = "solidcraft-kernel"
description = "SolidCraft B-rep kernel boundary: solids, extrude/revolve/booleans/fillets, meshes, measures and STEP, behind our own API (implemented with SMLib)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Link NVIDIA's SMLib (tangency-labs/smlib) into the kernel; needs a C++ toolchain and
# scripts/fetch-smlib.sh (ADR 0002). Without it every geometric operation answers that SMLib
# was not built.
smlib = ["solidcraft-smlib/native"]
# Run on the pure-Rust solidcore kernel instead (exclusive with `smlib`).
solidcore = ["solidcraft-smlib/solidcore"]

[dependencies]
solidcraft-geom = { workspace = true }
solidcraft-smlib = { workspace = true }
solidcraft-profile = { workspace = true }
solidcraft-step = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
spade = { workspace = true }
web-time = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
solidcraft-profile = { workspace = true, features = ["enabled"] }
proptest = { version = "1", default-features = false, features = ["std"] }
