[package]
name = "solidcraft-3dx-client"
description = "SolidCraft: a client of the 3Dconnexion driver on macOS (3DxWare), loaded at run time"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The workspace lints, except unsafe_code: denied, not forbidden, so that src/macos.rs can allow
# it: loading a framework and calling through its function pointers has no safe API. Keep the rest
# in sync with [workspace.lints].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"
# `eprintln!` and `eprint!` panic when stderr is a pipe whose reader has closed, which an agent
# running `solidcraft mcp` (and the app that one starts) can leave behind (#10111). Write through
# `solidcraft_geom::note!` (`solidcraft_engine::note!`), which ignores a failed write. Tests are
# exempt (clippy.toml `allow-print-in-tests`); examples and build scripts allow it at the top.
print_stderr = "deny"
