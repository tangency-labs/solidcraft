[package]
name = "solidcraft-ui-egui"
description = "SolidCraft user interface (egui + wgpu): the swappable front end"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
solidcraft-engine = { workspace = true }
# The shared cloud Open/Save pages, account badge and Share split button
# (craft_ui::cloud, behind the `cloud` feature). The interface half opens no
# socket, so this builds for the web. The host application supplies the
# backend that reaches the service, as it already supplies the file pickers.
craft-ui = { git = "https://github.com/wdunn001/craft-libs", rev = "1a3cbfd724bf28ccbe51a1f45f19022f131f15bb", features = ["cloud"] }
# The cloud contracts the pages speak (entries, destinations, faults). No
# vendor, no IO.
craft-cloud = { git = "https://github.com/wdunn001/craft-libs", rev = "1a3cbfd724bf28ccbe51a1f45f19022f131f15bb" }
egui = { workspace = true }
egui-wgpu = { workspace = true }
solidcraft-gpu = { workspace = true }
solidcraft-space-mouse = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
# gif, webp, bmp, tiff: pictures attached to an agent chat message (GIF and WebP go as they are,
# BMP and TIFF as PNG).
image = { workspace = true, features = ["jpeg", "ico", "gif", "webp", "bmp", "tiff"] }
ttf-parser = { workspace = true }
# Right-to-left interface text (Hebrew): the Unicode Bidirectional Algorithm puts translated
# strings in display order, which egui does not do itself (MIT OR Apache-2.0).
unicode-bidi = "0.3"
semver = { workspace = true }
# Updates: the downloaded package's SHA-256 (against the release's SHA256SUMS.txt), its optional
# minisign signature (MIT), and the portable .zip's executables.
sha2 = { workspace = true }
minisign-verify = "0.3"
zip = { workspace = true }
# Rasterises the icon SVGs (assets/icons/ui/design/svg) at the size they are drawn.
tiny-skia = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Ends an agent's process group with the system call (MIT; already in the tree through zip).
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Updates: the folder the Windows installer recorded, so an install outside Program Files is still
# updated by its installer (MIT; already in the tree as a build dependency).
winreg = "0.56"

[dev-dependencies]
solidcraft-engine = { workspace = true, features = ["bundled-render-library"] }
# Parse the source guard structurally, including code after inline test modules.
syn = { workspace = true, features = ["visit"] }
# The catalog guard reads every UI source file as Rust tokens; already in the tree through
# crates/derive and the workspace lockfile.
proc-macro2 = { workspace = true }

# Pictures pasted into the agent chat; already in the tree, with the same features, through
# egui-winit's clipboard.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The page's host, so the cloud account menu's "Account settings" link reaches
# the CloudCraft deployment that served this build. Already in the dependency
# graph through eframe's web backend.
web-sys = { version = "0.3", features = ["Window", "Location"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The offscreen viewport render test opens a device without a window.
pollster = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
# Reads assets/icons/ui/design/palette.toml and aliases.toml into compiled tables.
toml = { workspace = true }
