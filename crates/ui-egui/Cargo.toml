[package]
name = "solidcraft-ui-egui"
description = "SolidCraft user interface (egui + wgpu): the swappable front end"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
solidcraft-viewport-egui = { workspace = true }
solidcraft-viewport-gpu = { workspace = true }
solidcraft-viewport = { workspace = true }
solidcore-record = { workspace = true }
solidcore-ops = { workspace = true }
solidcore-tess = { workspace = true }
solidcraft-engine = { workspace = true }
solidcraft-control = { workspace = true }
solidcraft-control-egui = { workspace = true }
# The UI kit and its components (ribbon, app bar, history bar, navigation bar, view compass,
# preferences window, start page, window chrome, theme files), drawn from SolidCraft's data.
solidcraft-ui-kit = { workspace = true }
# SolidCraft's look, installed into the kit: its icon set, glyphs, interface faces and built-in themes.
solidcraft-look = { workspace = true }
# The widget registry (handles, rects, counts) the UI kit publishes into.
solidcraft-ui-registry = { workspace = true }
solidcraft-color = { workspace = true }
solidcraft-ui-text = { workspace = true }
# The token contract every component draws with; the theme system here resolves and sets it.
solidcraft-theme = { workspace = true }
egui = { workspace = true }
egui-wgpu = { workspace = true }
solidcraft-gpu = { workspace = true }
solidcraft-space-mouse = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
# gif, webp, bmp, tiff: pictures attached to an agent chat message (GIF and WebP go as they are,
# BMP and TIFF as PNG).
image = { workspace = true, features = ["jpeg", "ico", "gif", "webp", "bmp", "tiff"] }
ttf-parser = { workspace = true }
# Right-to-left interface text (Hebrew): the Unicode Bidirectional Algorithm puts translated
# strings in display order, which egui does not do itself (MIT OR Apache-2.0).
# The system's preferred languages on a first start (MIT OR Apache-2.0, maintained by
# 1Password): the OS locale on desktop and, with `js`, `navigator.languages` in the browser (#10138).
semver = { workspace = true }
# Updates: the downloaded package's SHA-256 (against the release's SHA256SUMS.txt), its optional
# minisign signature (MIT), and the portable .zip's executables.
sha2 = { workspace = true }
minisign-verify = "0.3"
zip = { workspace = true }
# Rasterises the icon SVGs (crates/look/icons/design/svg) at the size they are drawn.
tiny-skia = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Ends an agent's process group with the system call (MIT; already in the tree through zip).
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Updates: the folder the Windows installer recorded, so an install outside Program Files is still
# updated by its installer (MIT; already in the tree as a build dependency).
winreg = "0.56"

[dev-dependencies]
# The kit's test fixtures for SolidCraft's tests of the kit with its data.
solidcraft-ui-kit = { workspace = true, features = ["test-support"] }
solidcraft-engine = { workspace = true, features = ["bundled-render-library", "profile"] }
# Parse the source guard structurally, including code after inline test modules.
syn = { workspace = true, features = ["visit"] }
# The catalog guard reads every UI source file as Rust tokens; already in the tree through
# crates/derive and the workspace lockfile.
proc-macro2 = { workspace = true }

# Pictures pasted into the agent chat; already in the tree, with the same features, through
# egui-winit's clipboard.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
lopdf = { version = "0.45", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wat = "1"
# The offscreen viewport render test opens a device without a window.
pollster = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
