# Known Rust-vs-C++ mismatches (see crates/difftest/src/known.rs).
#
# A case listed here still fails its comparison; difftest reports it as
# `known-mismatch` (summary line `known_mismatch=N`, report `"known_mismatch"`) and
# the unit is at best `partial`, never green. A listed case that passes, defers or no
# longer exists fails the unit: remove its entry when the port is fixed. Every entry
# needs a plan/findings.md entry. Never list a case just to get CI green.
#
# [[mismatch]]
# unit = "curve.curve_p1"
# case = "gen0042"
# why = "C++ succeeds with 0 points, Rust returns status_3 (plan/findings.md: ...)"

[[mismatch]]
unit = "blend.fillet_intersector"
case = "rv_next_clipped_step"
why = "StepSolve clipped branch differs by a few ULP from C++; suspected p3 evaluating offset-surface copies vs the solver's own objects; pre-existing, newly reachable via #212 (plan/findings.md: blend.fillet_intersector rv_next_clipped_step)"

[[mismatch]]
unit = "topology.edgeuse_p3"
case = "adversarial_b33_eu33_binormal_out"
why = "EvaluateBinormal (use_3d) on Endcap.smb, whose file has no UV trim curves: state len C++ 33 vs Rust 44 (Rust attaches a UV trim curve, C++ none). Root cause (C++ probe, PR km-binormal): SmBrep::ReadFromFile healing (SmVertexuse::ComputeUVPoint -> smsurf_GetSurfaceCache) leaves an SmTrimSrfCache without tree on each face surface; EvaluateBinormal reuses it, and its tree is built later with the surface owner cleared (GlobalPointSolve), so no CreateUVTrimCurves. The Rust B-rep keeps no per-surface cache and builds the face trimmed cache, which attaches the curves. Deleting that cache before the call makes the C++ attach the same curve. Fix needs the cache-exists state exported and kept on the Rust face (topology.rs, edgeuse_p1 import/shim)"

