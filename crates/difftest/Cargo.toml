[package]
name = "difftest"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false
description = "Side-by-side comparison runner: solidcore (Rust) vs upstream SMLib (C++ via solidcore-ffi)."
build = "build.rs"

[features]
default = []
# Link the C++ kernel and register the unit runners in src/units/. Required to run.
cpp = ["solidcore-ffi/cpp"]

[dependencies]
solidcore = { path = "../solidcore" }
solidcore-ffi = { path = "../solidcore-ffi" }
# The `ssi` engine of --ssi-corpus (a surface/surface intersection of its own, not a port).
ssi = { path = "../ssi" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse decimals exactly (correctly rounded, as C strtod), not to within 1 ULP
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"

[lints]
workspace = true
