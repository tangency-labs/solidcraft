# The #1528 box-and-cylinder shells (SmApiShellBrepFull, extended offset): in the 14th
# ManifoldBoolean of SmOffsetExecutive::PiecewiseMerge an edge definition's second
# MakeEdgeInFace (a closed edge whose FindVertexSector finds no sector) fails with
# SM_ERR_NULL_POINTER after the first one edited the B-rep, on both sides (gdb). Upstream
# then goes on with the half-imprinted B-reps (UB-242) and fails later in
# SmMerge::MakeFaceuse (SM_ERR); the port stops there (tangency-labs/smlib af8db37) with
# the imprint's 1006. The C++ answer comes from that undefined continuation
# (plan/upstream-issues/UB-242--addendum-2026-10-30-offset-box-cylinder.md).
[[mismatch]]
unit = "offset.offset_executive_p2"
case = "issue1528_box_cylinder_api_shell_2_volume"
cpp_defect = "UB-242"
why = "C++ goes on after a failed imprint that edited the B-reps (UB-242) and fails later with SM_ERR; the port stops with the imprint's SM_ERR_NULL_POINTER"

[[mismatch]]
unit = "offset.offset_executive_p2"
case = "issue1528_box_cylinder_api_shell_2_volume_first"
cpp_defect = "UB-242"
why = "C++ goes on after a failed imprint that edited the B-reps (UB-242) and fails later with SM_ERR; the port stops with the imprint's SM_ERR_NULL_POINTER"
