# sweep.api_brep -- volumes moved by #2890 (precise properties: the trims' base, the split at
# the surface's knots, span ends from their own knot span, the fifth-order step estimate),
# each measured against an independent reference; solidcore is within the requested
# accuracy and closer than the pinned C++ (difftest at f826c1613).

[[mismatch]]
unit = "sweep.api_brep"
case = "box_face1_curve_path_cap"
why = "#2890's precise properties (the trims' base, the knot splits, the fifth-order step estimate; plan/findings/sweep.api_brep--precise-properties-2890-moves-cases-2026-11-05.md): the same volume integral by other steps, so the value moves within the requested accuracy (1e-6); error against the divergence theorem on the swept body's own faces, 10-point Gauss-Legendre per knot span, origin independent and stable to 1e-13 over 1, 2 and 4 panels per span (reference 3.022826007100955e1) (values.volume[0]: cpp=3.022825961551991e1 (error -1.51e-8) rust=3.02282600710325e1 (error 7.6e-13))"

[[mismatch]]
unit = "sweep.api_brep"
case = "wr471_rot_half_circle_whole_sphere_off_3e-7"
why = "#2890's precise properties (the trims' base, the knot splits, the fifth-order step estimate; plan/findings/sweep.api_brep--precise-properties-2890-moves-cases-2026-11-05.md): the revolved face is the sphere r 5 (WR-471), closed form 4/3 pi 125 = 5.235987755982989e2. At accuracy 1e-6 the value moves within it (values.linear_volume[0]: cpp=5.23598956772222e2 (error 3.46e-7) rust=5.235987784379857e2 (error 5.42e-9)); at 1e-8 solidcore now converges within it where the C++ returns SM_ERR (values.rotational_volume_1e8[0]: cpp=0 (status 1001) rust=5.23598775627212e2 (error 5.52e-11); ints.rotational_volume_1e8_status[0]: cpp=1001 rust=0), so the 1e-8 limitation once shared is the C++'s alone"

