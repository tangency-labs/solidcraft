[[mismatch]]
unit = "topology.brep_p10"
case = "read_Solids_fillet_ts"
libc = "glibc"
cpp_defect = "UB-255"
why = "SmHealData::Fix_CoinVertices dangling-pointer heap reuse (UB-255): UpdateTargetLists frees both pSurvivorProps and pDeletedProps on SM_NO_MERGE_IN_BREP, Fix_CoinVertices rewrites sProbArray to the freed pSurvivorProps, and once glibc's 7-slot tcache bin fills on the 6th merge, new SmVertexProps reuses pSurvivorProps's address so C++ merges 3 extra 3-way vertex clusters (22 vertices, 1 shell vs Rust's fresh-id 25 vertices, 2 shells; plan/findings.md: 'topology.brep_p10, topology.brep_p1, sweep.api_brep: heal/notify/ProjectAndTrim fixes and `read_Solids_fillet_ts` UAF root cause'); only glibc reuses the address: with macOS libmalloc the C++ agrees with Rust, plan/findings/topology.brep_p10--read-solids-fillet-ts-mismatch-is-glibc-only.md)"

[[mismatch]]
unit = "topology.brep_p10"
case = "subdivide_u1v2_cinf"
cpp_defect = "WR-589"
why = "SmBrep::SubdivideFaceAtDiscontinuities's V pass counts the U knots (SmBrep.cpp:18483, WR-589): on a sheet with one U knot and two V knots the C++ cuts at the first V knot only (4 faces); solidcore counts the V knots, fixed on the default path (6 faces, crates/solidcore/tests/subdivide_face_v_knots.rs)"

[[mismatch]]
unit = "topology.brep_p10"
