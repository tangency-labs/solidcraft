cpp_defect = "WR-589"
why = "SmBrep::SubdivideFaceAtDiscontinuities's V pass counts the U knots (SmBrep.cpp:18483, WR-589): on a sheet with no U knot and one V knot the C++ makes no cut (1 face); solidcore cuts at the V knot, fixed on the default path (2 faces, crates/solidcore/tests/subdivide_face_v_knots.rs)"
