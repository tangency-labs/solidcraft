# Known mismatches of topology.brep_local_operation (format: crates/difftest/src/known.rs).
# The final merge copy of the offset result into the B-rep gives some vertices, edges and
# faces of Solids/nurb_fillet.smb a larger tolerance than the native one
# (plan/findings/topology.brep_local_operation--nurb-fillet-vertex-tolerances.md).

[[mismatch]]
unit = "topology.brep_local_operation"
case = "nurb_fillet_face0_same"
why = "only tolerances differ (vertex, edge, face): Rust's merge copy of the offset result grows them, the native copy keeps the offset result's (plan/findings/topology.brep_local_operation--nurb-fillet-vertex-tolerances.md)"

