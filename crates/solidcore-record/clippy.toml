# solidcore-record computes no geometric quantity (docs/layers.md §1, §4). Clippy reads the
# nearest clippy.toml, so this repeats the workspace's settings and adds the record's ban.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
doc-valid-idents = ["SMLib", "NLib", "NVIDIA", "SolidCraft", "OpenUSD", ".."]
