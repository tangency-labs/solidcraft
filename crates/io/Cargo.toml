[package]
name = "solidcraft-io"
description = "SolidCraft file formats: designs (JSON), STL, OBJ, STEP, IGES, 3MF and glTF, and FreeCAD/Rhino import"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Tests only: trust a model cache even when the build has no git commit.
trust-unknown-source = []

[dependencies]
solidcraft-cloud = { workspace = true }
solidcraft-geom = { workspace = true }
solidcraft-kernel = { workspace = true }
solidcraft-doc = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
gltf = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }
# FreeCAD and Rhino import (pure Rust, so the browser build has it too).
cadmpeg-core = { workspace = true }
cadmpeg-ir = { workspace = true }
cadmpeg-registry = { workspace = true }

# The model cache's key (build.rs).
[build-dependencies]
sha2 = { workspace = true }

# A plain fsync where a network share refuses Apple's full flush (src/safe_write.rs); already in
# the tree through tempfile.
[target.'cfg(target_vendor = "apple")'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

# Native design-lock host names, Git subprocesses and connection-specific SSH command quoting.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-lite = "2"
gethostname = { workspace = true }
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "process-group", "job-object"] }
shlex = "2.0.1"
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519", "encryption", "getrandom"] }
rand_chacha = "0.3"
zeroize = { version = "1", features = ["alloc"] }
tempfile = "3"
url = "2"
percent-encoding = "2"
