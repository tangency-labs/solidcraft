[package]
name = "solidcraft-cloud"
description = "Portable versioned repository snapshots and content-addressed assets"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
github = ["dep:base64", "dep:octocrab", "dep:sha1"]

[dependencies]
base64 = { version = "0.23", optional = true }
octocrab = { version = "0.54.5", default-features = false, optional = true }
sha1 = { version = "0.10.6", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
zstd = { version = "0.13.3", default-features = false }

[dev-dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
tokio = { version = "1", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
