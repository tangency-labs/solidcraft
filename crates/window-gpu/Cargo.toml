[package]
name = "solidcraft-window-gpu"
description = "SolidCraft: its own window painter and runner on a stock egui-wgpu and egui-winit (no eframe)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
egui = { workspace = true }
egui-wgpu = { workspace = true, features = ["winit", "capture"] }
log = { workspace = true }
pollster = { workspace = true }
thiserror = { workspace = true }
web-time = { workspace = true }
wgpu = { workspace = true }
# A window system to build against on Linux (the host picks the one it runs on).
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "x11"] }

# The runner (native only: in a browser the page runs the loop). Its input; winit's own platform
# features come from it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-winit = { version = "0.37", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }

[dev-dependencies]
# Native backends, so the example opens a window (the app picks its own).
wgpu = { workspace = true, features = ["metal", "vulkan", "dx12"] }
