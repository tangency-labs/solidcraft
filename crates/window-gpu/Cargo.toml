[package]
name = "solidcraft-window-gpu"
description = "SolidCraft: its own window painter and runner on a stock egui-wgpu and egui-winit (no eframe)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
egui = { workspace = true }
egui-wgpu = { workspace = true, features = ["winit", "capture"] }
log = { workspace = true }
thiserror = { workspace = true }
web-time = { workspace = true }
wgpu = { workspace = true }
winit = { version = "0.30", default-features = false }
