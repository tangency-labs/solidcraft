[package]
name = "solidcraft-vcs"
description = "Git-based version control for SolidCraft design histories"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }

# gix is a pure-Rust git implementation (MIT OR Apache-2.0); no GPL dependency.
# Not compiled for wasm32: designs on the web have no filesystem to track.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gix = { workspace = true }
