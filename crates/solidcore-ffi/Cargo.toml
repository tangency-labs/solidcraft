[package]
name = "solidcore-ffi"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false
description = "Safe Rust wrappers over extern \"C\" shims into the upstream SMLib C++ kernel (difftest oracle)."
# Lets dependents' build scripts read DEP_SOLIDCORE_CPP_* (e.g. LIB_DIR for rpath).
links = "solidcore_cpp"
build = "build.rs"

[features]
default = []
# Compile harness/cpp/shim/*.cpp and link bin/cpp/lib. Without it the crate is empty.
cpp = []

[dependencies]
# Validates the flat body the `step_import` shim reads (`step_import::flat::decode`).
step-import = { path = "../step-import" }

[build-dependencies]
cc = { version = "1.2", features = ["parallel"] }
serde_json = "1"

[lints]
workspace = true
