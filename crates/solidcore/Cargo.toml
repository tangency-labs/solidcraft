[package]
name = "solidcore"
description = "B-rep solid modeling kernel: a Rust port of NVIDIA's SMLib (early work in progress)"
edition.workspace = true
license.workspace = true
# 0.0.x until it is usable end to end (primitives, booleans, fillets).
version = "0.0.1"
rust-version.workspace = true
repository = "https://github.com/tangency-labs/solidcore"
readme = "README.md"
keywords = ["cad", "brep", "nurbs", "geometry", "solid-modeling"]
categories = ["graphics", "mathematics", "science"]

[features]
# Kernels start with the curve cache memo off (`Kernel::memoize_curve_caches`), to
# run difftest and the tests in both positions. Results never depend on it.
curve-memo-off = []

[dependencies]
thiserror.workspace = true

[lints]
workspace = true
