[package]
name = "solidcraft-render"
description = "SolidCraft view math (orbit camera, projection, picking rays), the description of headless pictures, and product render jobs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
raytrace-cpu = ["dep:rayon"]
denoise-oidn = ["dep:oidn"]

[dependencies]
solidcore-record = { workspace = true }
solidcore-tess = { workspace = true }
solidcraft-color = { workspace = true }
solidcraft-viewport = { workspace = true }
solidcraft-geom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, features = ["jpeg"] }
moxcms = { workspace = true }
png = { workspace = true }
robust = { workspace = true }
sha2 = { workspace = true }
web-time = { workspace = true }
weezl = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true, optional = true }
sysinfo = { workspace = true }
# System Open Image Denoise through pkg-config (its own default); `bundled` only ships
# linux-x64/macos-x64+arm64/windows-x64 and downloads at build time (#16902).
oidn = { version = "=2.5.1", optional = true }

[dev-dependencies]
flate2 = "1"

[[example]]
name = "cpu_resource_smoke"
required-features = ["raytrace-cpu"]
