[package]
name = "solidcraft-render"
description = "SolidCraft view math (orbit camera, projection, picking rays), the description of headless pictures, and product render jobs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
default = []
raytrace-cpu = ["dep:rayon"]
# `CpuHost::for_platform_with_own_memory_ledger`, for other crates' tests that check exact
# native RAM-ledger totals while other tests in the same process render.
test-support = []

[dependencies]
solidcore-record = { workspace = true }
solidcraft-color = { workspace = true }
solidcraft-viewport = { workspace = true }
solidcraft-geom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true, features = ["jpeg"] }
moxcms = { workspace = true }
png = { workspace = true }
robust = { workspace = true }
sha2 = { workspace = true }
web-time = { workspace = true }
weezl = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true, optional = true }
sysinfo = { workspace = true }

[dev-dependencies]
flate2 = "1"

[[example]]
name = "cpu_resource_smoke"
required-features = ["raytrace-cpu"]
