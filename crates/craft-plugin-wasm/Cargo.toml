[package]
name = "craft-plugin-wasm"
description = "App-independent WebAssembly component runtime for Craft plugins"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
craft-plugin = { path = "../craft-plugin" }
serde_json = { workspace = true }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
cap-std = "4"
log = { workspace = true }
sha2 = { workspace = true }
# `cache` keeps compiled components on disk through Wasmtime's own (safe) cache, so loading one
# never needs unsafe deserialization.
wasmtime = { version = "48.0.8", default-features = false, features = ["cache", "component-model", "cranelift", "parallel-compilation", "reexport-wasmparser", "runtime", "std"] }

[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dev-dependencies]
wat = "1"
