[package]
name = "solidcraft-viewport"
description = "The viewport renderer the Craft apps share: orbit camera, projection and picking rays, the description of a headless picture and its CPU rasterizer, the surface shading models and section hatches"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
image = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
solidcore = { workspace = true }
solidcore-convert = { workspace = true }
solidcore-record = { workspace = true }
solidcore-tess = { workspace = true }
solidcraft-color = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }
# Native backends, so tests and command-line hosts can open a device without a window.
wgpu = { workspace = true, features = ["metal", "vulkan", "dx12", "gles"] }

[dev-dependencies]
serde_json = { workspace = true }
# The HLSL the D3D12 backend compiles (tests check it suits FXC).
naga = { workspace = true, features = ["wgsl-in", "hlsl-out"] }
