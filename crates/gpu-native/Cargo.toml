[package]
name = "solidcraft-gpu-native"
description = "SolidCraft's native-only wgpu calls that wgpu marks unsafe (the persistent pipeline cache), kept out of solidcraft-gpu, which forbids unsafe code"
version.workspace = true
edition.workspace = true
license.workspace = true

# The workspace lints, except unsafe_code: denied, not forbidden, so that src/pipeline_cache.rs can
# allow it (#3236). Keep the rest in sync with [workspace.lints].
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"

[dependencies]
wgpu = { workspace = true }
