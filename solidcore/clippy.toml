# Tests may use unwrap/expect/panic/indexing; library code may not (see [workspace.lints]).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
# Proper nouns that appear in docs without backticks.
doc-valid-idents = ["SMLib", "NLib", "NVIDIA", "SolidCraft", "OpenUSD", "..", ]

# Transcendental functions call the platform's C libm, whose last bits differ between Apple's
# libm, glibc, the MSVC CRT and wasm32: every crate calls solidcore::math::det instead, one
# pure-Rust libm, so results are the same bits on every platform.
disallowed-methods = [
    { path = "f64::sin", reason = "the platform's libm: call solidcore::math::det::sin (crates/solidcore/src/math/det.rs), the same bits on every platform" },
    { path = "f64::cos", reason = "the platform's libm: call solidcore::math::det::cos (crates/solidcore/src/math/det.rs), the same bits on every platform" },
