# solidcore-ops chooses, sequences, converts and compares; it computes no geometric quantity
# (docs/layers.md §4), as the record and the conversion. Clippy reads the nearest clippy.toml, so
# this repeats the workspace's settings and adds the ban. The ban (float maths; the kernel's
# vector, transform, matrix, placement and extent methods, each type's field reads kept; its
# geometric free functions) is generated by ban_list.py (in this crate), for this crate,
# solidcore-convert and solidcore-record alike: `python3 ban_list.py ../solidcore/src
# "ops computes no geometry (docs/layers.md §4)"` (`--floats-only` for the record).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
doc-valid-idents = ["SMLib", "NLib", "NVIDIA", "SolidCraft", "OpenUSD", ".."]
