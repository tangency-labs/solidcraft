  <title>regularity-bound</title>
  <g id="Layer_1" data-name="Layer 1">
    <rect id="background" x="0" y="0" width="900" height="450" fill="#ffffff"/>
    <rect id="overlap" x="60" y="210.9" width="320" height="50.5" fill="#dce9f5"/>
