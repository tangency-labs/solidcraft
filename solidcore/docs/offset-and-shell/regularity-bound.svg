    <line id="Xq1" x1="60" y1="321.4" x2="380" y2="210.9" fill="none" stroke="#555555" stroke-width="2" stroke-miterlimit="10"/>
    <text transform="matrix(1 0 0 1 386 137.9)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">q0</tspan></text>
    <text transform="matrix(1 0 0 1 386 215.9)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">X q1</tspan></text>
    <text transform="matrix(1 0 0 1 70 203.9)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">max X q1</tspan></text>
    <text transform="matrix(1 0 0 1 70 276.4)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">min q0</tspan></text>
    <text transform="matrix(1 0 0 1 300 408)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">s across a patch</tspan></text>
    <text transform="matrix(1 0 0 1 60 36)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000"><tspan x="0" y="0">Ranges: two bounds apart</tspan></text>
    <text transform="matrix(1 0 0 1 60 425)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">min q0 lies below max X q1: not certified,</tspan></text>
    <text transform="matrix(1 0 0 1 60 441)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">though Q = q0 - X q1 &gt; 0 at every point</tspan></text>
