    <circle id="c" cx="654.5" cy="202.5" r="4" fill="#555555"/>
    <text transform="matrix(1 0 0 1 648.5 408)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">c²</tspan></text>
    <text transform="matrix(1 0 0 1 664 214.5)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">c</tspan></text>
    <text transform="matrix(1 0 0 1 760 175)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">X = √x2</tspan></text>
    <text transform="matrix(1 0 0 1 520 110)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">(x2 + c²) / (2c)</tspan></text>
    <line x1="560" y1="116" x2="600" y2="235.6" fill="none" stroke="#555555" stroke-miterlimit="10"/>
    <text transform="matrix(1 0 0 1 855 408)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">x2</tspan></text>
    <text transform="matrix(1 0 0 1 500 36)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000"><tspan x="0" y="0">Tangent: one bound</tspan></text>
    <text transform="matrix(1 0 0 1 500 425)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">X ≤ (x2 + c²) / (2c) for every c &gt; 0, off X by (X - c)² / (2c),</tspan></text>
    <text transform="matrix(1 0 0 1 500 441)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">so Q ≥ q0 - q1 (x2 + c²) / (2c) where q1 ≥ 0: one polynomial</tspan></text>
  </g>
</svg>
