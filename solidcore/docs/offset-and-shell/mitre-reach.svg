    <text transform="matrix(1 0 0 1 40 45)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="20" font-weight="bold" fill="#000000"><tspan x="0" y="0">The mitre: the neighbours&apos; offsets meet on the extended surface</tspan></text>
    <text transform="matrix(1 0 0 1 492 202)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="14" fill="#000000"><tspan x="0" y="0">r</tspan></text>
    <text transform="matrix(1 0 0 1 580 202)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="14" fill="#000000"><tspan x="0" y="0">d</tspan></text>
    <text transform="matrix(1 0 0 1 200 325)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="14" fill="#000000"><tspan x="0" y="0">F</tspan></text>
    <text transform="matrix(1 0 0 1 385 455)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="14" fill="#000000"><tspan x="0" y="0">G</tspan></text>
    <text transform="matrix(1 0 0 1 395 330)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="14" fill="#000000"><tspan x="0" y="0">α</tspan></text>
    <text transform="matrix(1 0 0 1 456 278)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">d</tspan></text>
    <text transform="matrix(1 0 0 1 480 348)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">d</tspan></text>
    <text transform="matrix(1 0 0 1 140 230)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">offset of F by d</tspan></text>
    <text transform="matrix(1 0 0 1 395 535)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">offset of G by d</tspan></text>
    <text transform="matrix(1 0 0 1 562 265)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">M: the offsets meet</tspan></text>
    <text transform="matrix(1 0 0 1 625 244)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">F&apos;s offset, extended</tspan></text>
    <text transform="matrix(1 0 0 1 625 305)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">F&apos;s tangent plane</tspan></text>
    <text transform="matrix(1 0 0 1 560 420)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">r = β (n_G · m), β = (d_G − c d_F) / (1 − c²), c = n_F · n_G</tspan></text>
    <text transform="matrix(1 0 0 1 560 440)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">equal offsets: r = d cot(α/2), α the solid&apos;s sector angle</tspan></text>
    <text transform="matrix(1 0 0 1 560 470)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">F&apos;s surface is extended by the largest r along its edges</tspan></text>
    <text transform="matrix(1 0 0 1 560 490)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">and corners, plus one offset d, so M lies inside the extension</tspan></text>
