    <text transform="matrix(1 0 0 1 40 40)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000"><tspan x="0" y="0">main: two traces stop at the knot line</tspan></text>
    <text transform="matrix(1 0 0 1 520 40)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000"><tspan x="0" y="0">this change: one curve turns the corner</tspan></text>
    <text transform="matrix(1 0 0 1 258 92)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#555555"><tspan x="0" y="0">C0 knot line</tspan></text>
    <text transform="matrix(1 0 0 1 652 92)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#555555"><tspan x="0" y="0">C0 knot line</tspan></text>
    <text transform="matrix(1 0 0 1 118 352)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">trace 1</tspan></text>
    <text transform="matrix(1 0 0 1 338 352)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">trace 2</tspan></text>
    <text transform="matrix(1 0 0 1 702 152)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">K</tspan></text>
    <text transform="matrix(1 0 0 1 768 114)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#555555"><tspan x="0" y="0">tangent before K</tspan></text>
    <text transform="matrix(1 0 0 1 802 198)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#555555"><tspan x="0" y="0">tangent after K</tspan></text>
    <text transform="matrix(1 0 0 1 40 428)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">Past the line the marching direction turns: each step across it fails the span test,</tspan></text>
    <text transform="matrix(1 0 0 1 40 446)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">the step shrinks to about 1e-10 and the trace ends. Two curves.</tspan></text>
    <text transform="matrix(1 0 0 1 520 428)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">The step is clipped to the line and solved on it (K); the trace goes on</tspan></text>
    <text transform="matrix(1 0 0 1 520 446)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">from K evaluated on the line&apos;s other side. One curve with a corner.</tspan></text>
