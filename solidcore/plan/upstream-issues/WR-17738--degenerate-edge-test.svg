    <text transform="matrix(1 0 0 1 15 32)" x="0" y="0" xml:space="preserve" font-family="Helvetica-Bold, sans-serif" font-size="20" fill="#000000"><tspan x="0" y="0">The healer&apos;s degenerate-edge test</tspan></text>
    <text transform="matrix(1 0 0 1 25 63)" x="0" y="14" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="14">(a) sampled: a ridge shorter than the</tspan><tspan x="0" y="30.8">context&apos;s 5e-6 is degenerate</tspan></text>
    <text transform="matrix(1 0 0 1 135 135)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000" text-anchor="middle"><tspan x="0" y="0">context approximation tolerance 5e-6</tspan></text>
    <text transform="matrix(1 0 0 1 25 185)" x="0" y="12" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="12">ridge 4.5e-6, τ_e 5e-7: squeezed into one</tspan><tspan x="0" y="26.4">end; the four edges at the other end now</tspan><tspan x="0" y="40.8">end 4.5e-6 off their vertex</tspan></text>
    <text transform="matrix(1 0 0 1 280 63)" x="0" y="14" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="14">(b) certified: vertices farther apart</tspan><tspan x="0" y="30.8">than τ_e</tspan></text>
    <text transform="matrix(1 0 0 1 390 138)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000" text-anchor="middle"><tspan x="0" y="0">vertex balls of radius τ_e</tspan></text>
    <text transform="matrix(1 0 0 1 280 200)" x="0" y="12" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="12">the same ridge is a real edge (SmBrep Edge</tspan><tspan x="0" y="26.4">test 7): kept, the healed body is the record&apos;s</tspan></text>
    <text transform="matrix(1 0 0 1 535 63)" x="0" y="14" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="14">(c) certified: the whole curve within</tspan><tspan x="0" y="30.8">τ_e of M</tspan></text>
    <text transform="matrix(1 0 0 1 690 125)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">τ_e</tspan></text>
