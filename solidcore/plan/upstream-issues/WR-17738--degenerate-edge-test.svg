    <text transform="matrix(1 0 0 1 535 275)" x="0" y="12" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="12">squeezed into M; the neighbours (solid) are</tspan><tspan x="0" y="26.4">re-ended at M (dashed)</tspan></text>
    <text transform="matrix(1 0 0 1 15 285)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#555555"><tspan x="0" y="0">Not to scale.</tspan></text>
