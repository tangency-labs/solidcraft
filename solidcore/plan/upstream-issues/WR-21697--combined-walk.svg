    <text transform="matrix(1 0 0 1 1045 176)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">middle 10, snapped to knot 9</tspan></text>
    <text transform="matrix(1 0 0 1 60 462)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">Square torus, U period 1, V period 12; a sample on the face&apos;s V edges steps 1 in V (dots). Before, each V span was also measured against the U period,</tspan></text>
    <text transform="matrix(1 0 0 1 60 478)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">so a step of 1 (over half of 1) was taken the long way round, and the spans that did not touch the point at V = 0 were refused.</tspan></text>
