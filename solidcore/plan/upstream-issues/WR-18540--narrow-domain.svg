    <line id="v_axis" data-name="v axis" x1="30" y1="140" x2="70" y2="140" fill="none" stroke="#999999" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="5 4"/>
    <polygon points="66,135 76,140 66,145" fill="#999999"/>
    <line id="u_axis" data-name="u axis" x1="30" y1="140" x2="30" y2="180" fill="none" stroke="#999999" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="5 4"/>
    <polygon points="25,176 30,186 35,176" fill="#999999"/>
