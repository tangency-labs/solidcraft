    <polygon id="head_a" data-name="head a" points="258,229 240,241 261,245" fill="#1f6fb2"/>
    <line id="arrow_b" data-name="arrow b" x1="680" y1="251" x2="640" y2="236" fill="none" stroke="#1f6fb2" stroke-width="3" stroke-miterlimit="10"/>
