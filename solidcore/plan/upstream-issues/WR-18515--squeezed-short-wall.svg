    <text transform="matrix(1 0 0 1 682 225)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">S</tspan></text>
    <text transform="matrix(1 0 0 1 490 385)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">The walls meet exactly at the profile&apos;s shared ends, so</tspan></text>
    <text transform="matrix(1 0 0 1 490 402)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">the first pass (2e-5) joins every side edge. The profile&apos;s</tspan></text>
    <text transform="matrix(1 0 0 1 490 419)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">copies stay open, as meant: every wall keeps four edges.</tspan></text>
    <text transform="matrix(1 0 0 1 490 436)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">15 edges, 10 vertices; the check accepts the sheet.</tspan></text>
    <text transform="matrix(1 0 0 1 30 70)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#555555"><tspan x="0" y="0">Walls of an uncapped extrude, unrolled; the short wall S drawn wide.</tspan></text>
