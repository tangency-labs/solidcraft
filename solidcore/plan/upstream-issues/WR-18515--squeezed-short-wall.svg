    <text transform="matrix(1 0 0 1 50 385)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">second pass at 4e-4: the short wall&apos;s bottom and top edges</tspan></text>
    <text transform="matrix(1 0 0 1 50 402)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">(0.00017 long, lamina) are squeezed out. Its loop keeps two</tspan></text>
