    <text transform="matrix(1 0 0 1 70 302)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">outside: void</tspan></text>
    <text transform="matrix(1 0 0 1 430 302)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">outside: void</tspan></text>
    <text transform="matrix(1 0 0 1 70 318)" x="0" y="12" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#555555"><tspan x="0" y="12">The inner shell&apos;s faces lie between two material</tspan><tspan x="0" y="26.4">regions: the export refuses the stitched part.</tspan></text>
    <text transform="matrix(1 0 0 1 430 318)" x="0" y="12" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#555555"><tspan x="0" y="12">Every face lies between material and a void: one</tspan><tspan x="0" y="26.4">solid with a cavity. Regions alternate from the</tspan><tspan x="0" y="40.8">outside in.</tspan></text>
