    <text transform="matrix(1 0 0 1 270 100)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">dome&apos;s seam (r = 10 + 1.01e-8)</tspan></text>
