    <text transform="matrix(1 0 0 1 20 458)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">Seen in the seams&apos; plane z = 0. Gaps drawn at 60 pt per 1e-8, the tolerance not to scale. Face test 36 counted the whole gap</tspan></text>
    <text transform="matrix(1 0 0 1 20 474)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">against 1e-9; the fix counts only the part across the seam, out of the page, which is 0 in both.</tspan></text>
