    <text transform="matrix(1 0 0 1 40 40)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000"><tspan x="0" y="0">One fillet, two chains: the boss&apos;s continued walls meet the other chain&apos;s round</tspan></text>
    <text transform="matrix(1 0 0 1 412 160)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">boss on the top face</tspan></text>
