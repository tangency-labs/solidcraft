    <text transform="matrix(1 0 0 1 40 720)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">Section at x = 20. Before, keep features cut the sheet at the creases as if the boss stood</tspan></text>
    <text transform="matrix(1 0 0 1 40 738)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">in chain 2&apos;s band, and the trimmed sheet did not sew in (status 1001). Now a feature is cut</tspan></text>
    <text transform="matrix(1 0 0 1 40 756)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">only against the rounds that roll on its face: chain 2 rolls on no face the boss stands on.</tspan></text>
