   </g>
   <g id="text_12">
    <text style="font: 12px 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(547.992249 558.450611)">Every bound uses outward-rounded intervals. A kept</text>
    <text style="font: 12px 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(547.992249 571.283486)">pair is also culled when all its values are worse than</text>
    <text style="font: 12px 'Helvetica', 'Arial', 'DejaVu Sans', sans-serif" transform="translate(547.992249 583.975736)">the best answer by more than the query tolerance.</text>
   </g>
