<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="760" height="540" viewBox="0 0 760 540">
  <title>mitre-reach</title>
  <g id="Layer_1" data-name="Layer 1">
    <rect id="background" x="0" y="0" width="760" height="540" fill="#ffffff"/>
    <rect id="leg_1_tube" data-name="leg 1 tube" x="100" y="250" width="573.1" height="80" fill="#f0f0f0" stroke="#555555" stroke-miterlimit="10" opacity="0.75"/>
    <polygon id="leg_2_tube" data-name="leg 2 tube" points="268.2,75.4 678,311.9 638,381.3 228.2,144.6" fill="#f0f0f0" stroke="#555555" stroke-miterlimit="10" opacity="0.75"/>
    <line id="leg_1" data-name="leg 1" x1="100" y1="290" x2="560" y2="290" fill="none" stroke="#1f6fb2" stroke-width="3" stroke-miterlimit="10"/>
    <line id="leg_2" data-name="leg 2" x1="560" y1="290" x2="248.2" y2="110" fill="none" stroke="#1f6fb2" stroke-width="3" stroke-miterlimit="10"/>
    <line id="leg_1_extension" data-name="leg 1 extension" x1="560" y1="290" x2="673.1" y2="290" fill="none" stroke="#999999" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="6 4"/>
    <line id="leg_2_extension" data-name="leg 2 extension" x1="560" y1="290" x2="658" y2="346.6" fill="none" stroke="#999999" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="6 4"/>
    <line id="cutting_line" data-name="cutting line" x1="450.7" y1="260.7" x2="669.3" y2="319.3" fill="none" stroke="#555555" stroke-width="2.5" stroke-miterlimit="10"/>
    <line id="mitre_beyond_reach" data-name="mitre beyond reach" x1="669.3" y1="319.3" x2="709.3" y2="330" fill="none" stroke="#000000" stroke-miterlimit="10" stroke-dasharray="2 3"/>
    <circle id="mitre_tip" data-name="mitre tip" cx="709.3" cy="330" r="4" fill="#000000"/>
    <circle id="end_of_reach" data-name="end of reach" cx="669.3" cy="319.3" r="3" fill="#555555"/>
    <line id="w" x1="115" y1="290" x2="115" y2="250" fill="none" stroke="#999999" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="3 3"/>
    <text transform="matrix(1 0 0 1 24 40)" x="0" y="0" xml:space="preserve" font-family="Helvetica-Bold, sans-serif" font-size="20" fill="#000000"><tspan x="0" y="0">A corner too sharp for its mitre</tspan></text>
    <text transform="matrix(1 0 0 1 140 318)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">leg 1</tspan></text>
    <text transform="matrix(1 0 0 1 318 128)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">leg 2</tspan></text>
    <text transform="matrix(1 0 0 1 121 275)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">w</tspan></text>
    <text transform="matrix(1 0 0 1 425 281)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">β</tspan></text>
    <text transform="matrix(1 0 0 1 572 243)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">extension 2√2 M</tspan></text>
    <text transform="matrix(1 0 0 1 380 425)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">cutting line: reaches 2√2 M each way</tspan></text>
    <text transform="matrix(1 0 0 1 600 460)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">mitre tip, w / sin(β/2)</tspan><tspan x="0" y="16.8">from the corner</tspan></text>
    <text transform="matrix(1 0 0 1 24 500)" x="0" y="12" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="12">Seen along the path&apos;s normal. Each piece runs 2√2 M past the corner (M: the largest coordinate of the profile&apos;s box). When the mitre tip lies past</tspan><tspan x="0" y="26.4">that reach, the open ends of the pieces are not cut off and the sweep does not close.</tspan></text>
    <line id="leader_cutting_line" data-name="leader cutting line" x1="560" y1="410" x2="597" y2="304" fill="none" stroke="#555555" stroke-width="0.75" stroke-miterlimit="10"/>
    <line id="leader_mitre_tip" data-name="leader mitre tip" x1="690" y1="444" x2="708" y2="336" fill="none" stroke="#555555" stroke-width="0.75" stroke-miterlimit="10"/>
  </g>
