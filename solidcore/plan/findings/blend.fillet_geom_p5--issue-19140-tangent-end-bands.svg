    <text transform="matrix(1 0 0 1 332 540)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">t*</tspan></text>
    <text transform="matrix(1 0 0 1 56 540)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">0</tspan></text>
    <text transform="matrix(1 0 0 1 456 540)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">0</tspan></text>
    <text transform="matrix(1 0 0 1 518 540)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">t*/4</tspan></text>
    <text transform="matrix(1 0 0 1 588 540)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">t*/2</tspan></text>
    <text transform="matrix(1 0 0 1 734 540)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">t*</tspan></text>
    <text transform="matrix(1 0 0 1 610 190)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">bands h ≤ |α − αc(t)| ≤ 2h</tspan></text>
    <text transform="matrix(1 0 0 1 610 206)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">h = 2/3 |αc − α0|</tspan></text>
    <line id="leader_band" data-name="leader band" x1="660" y1="210" x2="670" y2="228" fill="none" stroke="#555555" stroke-miterlimit="10"/>
    <text transform="matrix(1 0 0 1 440 380)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">ring about α0 below the bands,</tspan></text>
    <text transform="matrix(1 0 0 1 440 396)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">A = |αc − α0| + h there</tspan></text>
    <line id="leader_ring" data-name="leader ring" x1="495" y1="368" x2="495" y2="344" fill="none" stroke="#555555" stroke-miterlimit="10"/>
