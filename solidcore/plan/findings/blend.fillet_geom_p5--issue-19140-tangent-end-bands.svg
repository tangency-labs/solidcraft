    <text transform="matrix(1 0 0 1 40 40)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000"><tspan x="0" y="0">main: one ring about α0</tspan></text>
    <text transform="matrix(1 0 0 1 440 40)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#000000"><tspan x="0" y="0">this change: bands, then a ring</tspan></text>
    <text transform="matrix(1 0 0 1 60 90)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="14" fill="#000000"><tspan x="0" y="0">ring A ≤ |α − α0| ≤ 2A, A = 2 a(t*)</tspan></text>
    <text transform="matrix(1 0 0 1 60 520)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">bound ≥ |S_α| (a + A) ≈ 3 |S_α| a(t*)</tspan></text>
