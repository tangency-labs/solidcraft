    <text transform="matrix(1 0 0 1 20 318)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">E: top of the tube&apos;s start circle</tspan><tspan x="0" y="14.4">P: the ball&apos;s pole, where its seam ends</tspan><tspan x="0" y="28.8">M: the vertex the imprint put halfway</tspan><tspan x="0" y="43.2">The edge from the right runs over P and</tspan><tspan x="0" y="57.6">ends past it, at M: face test 36</tspan></text>
    <text transform="matrix(1 0 0 1 430 370)" x="0" y="0" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="12" fill="#000000"><tspan x="0" y="0">The vertex moves to P; its tolerance</tspan><tspan x="0" y="14.4">grows by the move and still holds E.</tspan><tspan x="0" y="28.8">Both edges end where the seam ends.</tspan></text>
    <text transform="matrix(1 0 0 1 20 418)" x="0" y="9.5" xml:space="preserve" font-family="Helvetica, sans-serif" font-size="9.5" fill="#555555"><tspan x="0" y="9.5">Seen from above the ball&apos;s pole (+z), +y to the right; gaps of 5e-8 mm drawn enlarged. Line: the copied face&apos;s boundary; half disc: the kept half of the ball; round patch: the vertex&apos;s tolerance.</tspan></text>
