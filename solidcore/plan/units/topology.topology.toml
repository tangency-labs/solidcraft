notes = "GREEN: difftest 657 cases (57 upstream-derived/edge-case fixtures + 600 generated scripts: marks under SmNewMarkAndLock, flags/user values, Notify propagation for every operation incl. the callback pass-through, tolerance, IsConnectedTo, destruction, SmTrackTopologyChanges start/stop/nesting/foreign callback), 0 deferred, bit-identical; wired SmSAGObject::Notify (geom.a_object 169 -> 168 deferred) and retargeted the SmTol::GetZoneTol3d(SmObject*) markers to the derived-kind units; CO-PORTED in topology.brep_p5 (PR #194): SmTopologyChangeCallback::Execute/AddUnique/Remove -> topology::topology::TopologyChangeCallback, supporting real healer notifications; 27 native callback scripts pass in topology.brep_p5, including active reset/foreign replacement/preexisting observers; topology.topology rerun PASS 657/657, max_rel_err=0 (findings.md); 30 fns; largest: SmTopology::Notify, SmTrackTopologyChanges::StartTracking, SmTrackTopologyChanges::StopTracking, SmTrackTopologyChanges::SmTrackTopologyChanges; cycle back-edges (call into later units; stub or co-port): topology.proto_topology_p1(1); unit-SCC #22 (220 units); 319 upstream test entry points reach this unit; CO-PORTED in topology.shell (PR #80): SmTopology face-use sibling links -> topology::Faceuse::sibling_links and topology::shell::faceuse_sibling_links, retaining literal next/last links after self-transfer clears the shell head; WIRED in topology.shell (PR #80): notify_with_regions forwards an explicit RegionLookup after the unchanged topology mark propagation; 657/657 native cases exact and sensitive; CO-PORTED in topology.brep_p3 (PR #204): SmTopologyChangeCallback::Execute, AddUnique, Remove -> topology::topology::TopologyChangeCallback (NotifyCallback::execute; the tracker and its installed callback now share the lists through Arc<Mutex<..>>, so GetRmList/GetAddList return copies, and an owner table, TrackTopologyChanges::set_owner, stands in for GetOwner/GetEdge of notified geometry); also geom::context::Context::take_notify_callbacks. CORRECTION to \"SmTopologyChangeCallback::Execute is unused upstream and not ported\" above: Execute is reached through the virtual dispatch of SmObject::Notify to the context's system callback, which the call graph does not follow; SmHealData installs SmTrackTopologyChanges(m_pBrep, TRUE) around its edits (SmHealData.cpp:3341 and later), so every heal edit reaches it. The difftest's bare SmTopology objects are no faces, edges or vertices, so Execute records nothing there on either side: case-by-case unchanged. UPDATE (PR #204, review of c7f6299b): Execute's owner walk follows the whole chain (it stopped after 16 steps, losing a deeper face's Chg entry), with a cyclic table refused as InvalidInput (unit test tracker_follows_long_owner_chains, 17 surfaces); its IsKindOf tests include SmFilletEdge / SmFilletVertex / SmFilletEdgeuse (16033/16034/16031). Native coverage of the callback with real faces, edges and vertices is in topology.brep_p3's difftest (the edits run under SmTrackTopologyChanges on both sides; lists and events compared). Report unchanged (657/657). UPDATE (PR #204, Codex re-check of d61f8d48): Context::take_notify_callbacks is replaced by Context::take_notify_lease / restore_notify_lease (the callbacks with their identity domain). Report unchanged. UPDATE (PR #204, #149 da779c51 merge): #204's co-port of SmTopologyChangeCallback::Execute / AddUnique / Remove (above) is superseded by topology.brep_p5's (PR #194) at the merge: TrackTopologyChanges::set_owner is gone (owner metadata via set_owner_metadata); topology.brep_p3's runner and heal_data_p3's tracked_edit use #194's API. Report unchanged (657/657)."
