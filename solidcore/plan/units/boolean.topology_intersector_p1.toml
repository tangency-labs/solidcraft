es: 830 cases, 693 pass, 0 failed, 137 deferred; --perturb SENSITIVE 693/693; the empty-knot-vector panics stay covered by the deterministic --fuzz seed (a runner refusal is a harness error in a normal run). UPDATE after topology.brep_p2 (PR #149): SmProtoTopologyManager's constructor fallback for an approximation tolerance below SM_EFF_ZERO (SmProtoTopology.cpp:3548-3556: GetTolerance and GetMinEdgeBBoxSize of both B-reps) is wired; the MgrNew op now passes both runner B-reps to ProtoTopologyManager::new and outputs the manager's GetTolerance (shim and runner, one value), so files_manager_zero_tol and the 9 generated approx-0 scripts that deferred at MgrNew compare the fallback value (with tol = 3*min(..) mutated in ProtoTopologyManager::new these 10 fail, and after the #145 merge so do 10 more that now reach MgrNew's output: 20 in all, gen0016/0064/0301/0412/0462/0652/0689/0702/0706/0774 besides the 10; review of d12f88e9): 827 cases, 663 pass, 0 fail, 164 deferred (topology.face_p2 82, topology.brep_p1 64, topology.face_p4 11, query.face_p1 7), with_values 660 no_values 3 (the 3 both-errored), --perturb SENSITIVE 663/663. difftest --fuzz 500 found 2 runner panics that predate this change: the B-spline surface serializer computes u.len() - 1 / v.len() - 1 on an empty knot vector (lines 402/403). Re-run after merging #145 5b1b28ae (main through e1ae2640) into #149: 827 cases, 710 pass, 0 fail, 117 deferred (topology.face_p2 82, query.brep 17, topology.face_p4 11, query.face_p1 7), with_values 707 no_values 3, --perturb SENSITIVE 710/710.; CO-PORTED in boolean.merge_p2 (PR #229): SmTopologyIntersector::Relate (edge and face branches on arena ids) -> Relations::relate_edges / relate_faces (crates/solidcore/src/boolean/topology_intersector/p1.rs) UPDATE (PR #204, topology.brep_p3): SmBrep::DeleteFace wired through the new hook IntersectorBrep::brep_delete_face (k: &mut Kernel; face_face_coincidence and imprint_body now take k: &mut Kernel; the difftest adapter Two cal