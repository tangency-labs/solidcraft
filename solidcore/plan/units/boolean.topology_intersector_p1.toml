sify deferrals pass). main CI e33985411 (2026-10-23): PARTIAL boolean.topology_intersector_p1 cases=830 passed=810 failed=0 deferred=20 blocked_by=query.face_p2(3),topology.brep_p5(1),topology.face_p2(16). CO-PORTED in boolean.merge_p4 (PR #243): SmTopologyIntersector::m_pBToO/m_pOToB face projection -> boolean::topology_intersector::p1::Relations::faces; read-only MateMap projections plus GetMappedBrepObjects/GetCommonEdges/GetCommonVertices access are shared, as are the common-list and SetSubset implementations; no relationship algorithm duplicated. partial (PR #146, builds on #121 and #150): after the maintainer review and the swarm pre-review, difftest 827 cases (8 upstream-derived fixtures + 19 edge cases built in code + 800 generated two-B-rep scripts, each run up to its first unrunnable op), 653 pass bit-identical (max_rel_err 0), 0 fail, 174 deferred (topology.face_p2 82: SmFace::GetTolerance via SmSurface::DropPoint of a face-owned surface; topology.brep_p1 74: GetVertices/GetEdges/GetTolerance; topology.face_p4 11: SmFace::GetVertices/GetEdges; query.face_p1 7: SmFace::CalculateBoundingBox), 3 cases_both_errored (scripts cut at op 0), 32 passes compare one refused op's status only; --perturb SENSITIVE 653/653. Ops with zero passing cases: sm_IntersectShellVertices and sm_IntersectWireLaminaEdges (all reach topology.brep_p1). UNPORTED stubs: topology.brep_p1/p3/p5/p7, topology.face_p3/p4, query.face_p1; surface.surface_p8, intersect.curve_class_p4 (PR #137: the SmCurveClassification constructor, which defers on ReSet = intersect.curve_class_p2, reached by no compared case: counts unchanged), intersect.curve_class_p5 and _p6 are wired. Registered SSI curves of the script are plain B-splines (a line/conic registered there is never compared). CO-PORTED here: the two SmTopologyIntersector constructors (boolean.topology_intersector_p2) -> boolean::topology_intersector::p1::TopologyIntersector::{new, with_context}; SmTol::UpdateObjectTolerance (geom.tol) -> geom: