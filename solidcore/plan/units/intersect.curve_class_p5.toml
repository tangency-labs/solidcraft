notes = "GREEN (PR #610): 1411 native cases (311 fixed: 281 flat + 30 B-rep; 800 flat + 300 B-rep generated) pass bit-identically, 0 fail, 0 defer; --perturb SENSITIVE 1411/1411, no absolute floors. B-rep cases (runner module topo, shim intersect_curve_class_p5_topo.cpp) run sm_InsertSolutions against real edges and IntersectVertices against real vertices of unit topology.edgeuse_p1's B-reps, with the classification curve and both B-reps owned by a ClassGeometryMut adapter: edge-end vertex snaps (with SmVertex::SetTolerance raising the vertex to the edge's when GetOKToSetTolerance), edge point/range classes, tangency filtering, the sm_RefineCCIToSurfaces no-work gate with classification surfaces, and the whole GWC:CHANGED_SSS block (SnapToKnots cull, surface projections with and without UV guesses, sm_SetXSectCurveThroughPoint editing a piecewise C0 cubic, SetIsCurveCurrent(FALSE), UV trim curves deleted on the vertex's edges and on their SmTopologyIntersector mates). insert_solutions_mut / intersect_vertices_mut make these edits; the read-only insert_solutions / intersect_vertices (callers p8, p9, query.face_p2) defer where an edit is due with UNPORTED(topology.brep_p1) (SmBrep mutable owning context, as point_class's merge). IntersectVertices projects onto an owner-free copy of the face surface (upstream clears its owner). Not reached by any case: the cull's removal of a duplicate drop point (two drop points snapping to the same knot) and the large-gap vertex insertion (the curve point solve returns no drop point beyond XSectTol3d in any case; the large-gap tolerance with real vertex/face gaps is compared). See plan/findings.md (PR #610) for the C++ vertex tolerance side effect the B-rep generator avoids. Small shared interfaces are CO-PORTED in point_class, curve_class_p1 and query.face_p2 notes. Deviations: object_index >1 rejected; unresolved p5_closed curve errors instead of FALSE; runner face zone tolerance zero is not compared; missing vertex/gap callback data returns InvalidInput; an ownerless no-face large-gap cutoff keeps the system default (UB-126). UB-134 was assigned to PR #150 by the maintainer. Rust adapter extended in heal.heal_data_p3 (PR #164): merge_intervals_with_partial retains completed intervals' output on failure for native ignored-status callers. 7 owned functions; largest: sm_InsertSolutions, SmCurveClassification::IntersectVertices, SmCurveClassification::MergeClassifications, SmCurveClassification::ExtractGeometry; cycle back-edges: topology.edge(6), topology.vertex(5), boolean.topology_intersector_p1(2), heal.gap(1), topology.edgeuse_p1(1), topology.vertexuse(1); unit-SCC #22 (220 units); 317 upstream test entry points reach this unit."
