notes = "EXACT UV GAP EVALUATION (PR #1309, 2026-10-27): isolated ARM64 native gate 745 cases, 745 value-bearing passes, 0 failed/deferred/rejected/vacuous, max_rel_err=0; all 721 baseline cases retained. Twenty-four independent native/Rust cases cover both UV-trim gap kinds, direct/mate lookup, two close-knot spacings and ordinary controls. GetGapEndPoints completes mutable trim creation before borrowing the original UV curve and surface; no copy-constructor knot tuning, extra allocation, public API or tolerance change. Missing-trim creation semantics are unchanged and not newly claimed as covered. Prior history: GREEN, PR #563 on main b65597902: 445 native cases, 445 bit-identical passes, 0 failed, 0 deferred; all 429 main passes retained and 16 deferrals now pass. Verified by x86_64 CI 39928207576 and full ARM64 audit. Coverage: 45 upstream/review fixtures plus 400 generated cases, gap functions on analytic/B-spline/Hermite/CrvOnSurf curves and plane/B-spline/curve-bounded surfaces, scales 1e-3..1e3, sub/degenerate/outer intervals, tolerance defaults, stop-at-big-gap and all six gap records. Historical perturbation was sensitive. Topology cases reuse topology.vertexuse build/export/import; the shim keeps the circle/ellipse edge curves the shared exact export carries (probe through sc_exact_curve_export::put_export_curve) and normalises every other analytic kind as before (findings.md). PR #836 (#294): the shared kind-9 circle/ellipse face is a heal.gap input with 41 inline cases over the six gap records, and the topo record compares the selected edge curve kind; 486 cases, 486 passes, 0 deferred. Back-edges wired: vertex/face and vertex/edge gap Set, edge/edge SetEdgeEdgeGap and SmCrvSrfGapFunction. Upstream WR-88/89/90 and UB-104 retained. CO-PORTED in topology.edgeuse_p1 (PR #55): SmEdgeFaceGap, SmEdgeEdgeGap, SmVertexFaceGap members, ReSet, IsInit and SetEdgeuse -> heal::gap types. CO-PORTED in topology.vertexuse (PR #88): SmVertexEdgeGap members, ReSet, IsInit. CO-PORTED in topology.edge (PR #103): SmGap length comparisons -> EdgeGap::length and max-gap functions. 119 fns; largest BuildSampleSet and crv/srf, crv/crv, srf/crv Evaluate; unit-SCC #22 (220 units); 317 upstream test entry points."
