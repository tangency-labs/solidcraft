notes = "GREEN (PR #439, 2026-10-21: 451 cases, 451 pass, 0 deferred, --perturb 451/451, on #303). GREEN (PR #265, 2026-10-20): difftest 448 cases (48 fixture, 400 generated), 448 pass (all compare 3+ values), 0 failed, 0 deferred, max_rel_err 0, --perturb SENSITIVE 448/448. GuessPointOnPlaneSolve runs (blend.fillet_standard_solver_p2); the inherited SmConstantRadiusFS / SmConstantRadiusAssistedFS overrides of both solvers (GetJacobianSize, SetupOffsetValues, OffsetRadiiCanChange, GetType, IsKindOf) call blend.fillet_standard_solver_p1 / _p2; the runner's error record reports rpSurface2 as upstream sets it before failing; a base extension the other rail's local point solve makes is handed back to the solver's offset (surface.offset_surface keeps &self extensions, as upstream's const cast). Before: PARTIAL 401 pass, 0 failed, 47 deferred (blend.fillet_standard_solver_p2 47: GuessPointOnPlaneSolve); earlier: --perturb SENSITIVE (360/360); 4000-seed run 4048 cases, 3242 pass, 0 failed, 806 deferred. CreateSurface (SmEiffelTowerCrossSectionFSG) is compared on 'Eiffel tower' sections over straight (ruled branch), concentric arc (surface of revolution branch) and free-form rails (skin with extrusion cross-boundary derivative surfaces), equal radii, vanishing/zero second arc, touching rails (point sections), mismatched point counts and knot vectors, different intervals on parallel 2-point line rails (the only different-interval inputs the FFI guard admits), tolerances 0 to above the rail gap, scales 1e-6 to 1e6; the shim's solver is an SmConstantRadiusFS (CreateSurface reads only its context and tolerance). LoadJacobian / LoadInitialValues of SmEiffelTowerFS and SmSecantConstantRadiusFS run in C++ on solvers built on an SmApiCreateBox edge use with their offset surfaces, orientations and radii replaced and edge uses cleared; the offset surfaces are the ported SmOffsetSurface (surface.offset_surface, wired in PR #62) built with the case's lSingularities: SM_SS_UNKNOWN (upst