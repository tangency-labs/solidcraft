[features]
capture = ["dep:egui"]
default = [
    "fragile-send-sync-non-atomic-wasm",
    "macos-window-resize-jitter-fix",
    "wgpu/default",
    "wgpu/webgl",
]
fragile-send-sync-non-atomic-wasm = ["wgpu/fragile-send-sync-non-atomic-wasm"]
macos-window-resize-jitter-fix = ["wgpu/metal"]
wayland = ["winit?/wayland"]
winit = [
    "dep:winit",
    "winit/rwh_06",
    "dep:egui",
    "capture",
]
x11 = ["winit?/x11"]

[lib]
name = "egui_wgpu"
path = "src/lib.rs"

[dependencies.ahash]
version = "0.8.12"
features = [
    "no-rng",
    "std",
]
default-features = false

[dependencies.bytemuck]
version = "1.25"

[dependencies.document-features]
version = "0.2.12"

[dependencies.egui]
version = "0.37.0"
optional = true
default-features = false

[dependencies.epaint]
version = "0.37.0"
features = ["bytemuck"]
default-features = false

[dependencies.log]
version = "0.4.34"
features = ["std"]

[dependencies.profiling]
version = "1.0"
default-features = false

[dependencies.thiserror]
version = "2.0"

[dependencies.type-map]
version = "0.5.1"

[dependencies.web-time]
version = "1.1"

[dependencies.wgpu]
version = "30.0"
features = [
    "std",
    "wgsl",
]
default-features = false

[dependencies.winit]
version = "0.30.13"
optional = true
default-features = false

