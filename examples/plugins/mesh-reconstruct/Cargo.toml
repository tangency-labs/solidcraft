[package]
name = "solidcraft-mesh-reconstruct-plugin"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
solidcraft-geom = { git = "https://github.com/crono2250/solidcraft.git", rev = "aab1df183a7b4ca7c3d9e4dd5b52a6b8a2c64e4f" }
solidcraft-kernel = { git = "https://github.com/crono2250/solidcraft.git", rev = "aab1df183a7b4ca7c3d9e4dd5b52a6b8a2c64e4f", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.54"

[dev-dependencies]
solidcraft-doc = { git = "https://github.com/crono2250/solidcraft.git", rev = "aab1df183a7b4ca7c3d9e4dd5b52a6b8a2c64e4f" }
solidcraft-engine = { git = "https://github.com/crono2250/solidcraft.git", rev = "aab1df183a7b4ca7c3d9e4dd5b52a6b8a2c64e4f", default-features = false }

[patch.crates-io]
truck-geotrait = { path = "vendor/truck-geotrait" }
truck-geometry = { git = "https://github.com/crono2250/solidcraft.git", rev = "aab1df183a7b4ca7c3d9e4dd5b52a6b8a2c64e4f" }
truck-shapeops = { git = "https://github.com/crono2250/solidcraft.git", rev = "aab1df183a7b4ca7c3d9e4dd5b52a6b8a2c64e4f" }
truck-stepio = { git = "https://github.com/crono2250/solidcraft.git", rev = "aab1df183a7b4ca7c3d9e4dd5b52a6b8a2c64e4f" }
truck-meshalgo = { git = "https://github.com/crono2250/solidcraft.git", rev = "aab1df183a7b4ca7c3d9e4dd5b52a6b8a2c64e4f" }
matext4cgmath = { git = "https://github.com/crono2250/solidcraft.git", rev = "aab1df183a7b4ca7c3d9e4dd5b52a6b8a2c64e4f" }

[profile.ci]
inherits = "dev"
opt-level = 1
debug = 1
debug-assertions = false

[profile.ci.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"
