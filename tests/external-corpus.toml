# External STEP corpus: nightly import checks on real-world files (#1397).
#
# Real-world STEP files from many exporters find bugs our own designs never hit.
# `cargo xtask external-corpus` downloads each source (cached under corpus/external/,
# gitignored), verifies its hash, imports every file headless with solidcraft-cli, and
# checks the expected results below within tolerances: import succeeds with no panic,
# the body count, total volume and area, and time and memory budgets.
#
# Import results should improve over time (healing, edge merging, meshing), so
# expectations are tolerance-based and re-recorded with a reason:
#
#     cargo xtask external-corpus --bless "why the numbers moved"
#
# A file whose hash no longer matches upstream is reported as "source changed" and is
# never counted as our failure. Everything here is redistributable: never vendor
# catalogue models or scraped datasets whose licence forbids redistribution or
# automated download.
#
# Expected values are recorded by --bless; until a file has them the run only records.

[[source]]
name = "nist-pmi"
url = "https://www.nist.gov/document/nist-pmi-step-files"
archive = "zip"
archive_sha256 = "8fa78429e6d8d9b0d7681d223b6aa9ec98c3772185c55b1a0e3679b21c181911"
licence = "US Government work (NIST), public domain; acknowledgement appreciated, the NIST logo may not be used in promotion"
note = """STEP AP242 and AP203 files of the FTC / CTC / STC test cases of the NIST MBE PMI
Validation and Conformance Testing Project, generated by the CAx implementor forums' CAD
systems (CATIA, NX, Inventor, Creo, SolidWorks): the same real parts exported by several
exporters, some with graphical and semantic PMI.
https://www.nist.gov/ctl/smart-connected-systems-division/smart-connected-manufacturing-systems-group/mbe-pmi-0"""

