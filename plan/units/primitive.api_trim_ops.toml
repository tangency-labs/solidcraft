notes = "NOT IN callgraph/units.json: wrapper-only SM_API functions (1.0.1 parity batch 3, trimming): SmApiTrimSurfaceWith3dCurves, SmApiTrimProjectParallel, SmApiCreatePlanarFaces (SmApiTrimmedSurfaces.cpp), SmApiProjectAndTrim (SmApiBrep.cpp); every callee is ported (SmTrimmingTools::TrimSurfaceWithModelSpaceCurves, SmBrep::CreateFaceFromSurface, CreatePlanarFacesWith3DCurves, ProjectAndTrim). The projected curve is any SmBSplineCurve class: the ProjectAndTrim chain (topology::brep::p10::project_and_trim, p1::create_parallel_projection_curves, Surface::create_parallel_projection_curves) takes &Curve and dispatches the box and continuities on the class (an SmLine as in the upstream tests), the sweep on its NURB. Inputs are made by the SM_API constructors on both sides (boxes by SmApiCreateBox, filleted by SmApiCircularFillet as in TestSmProjectAndTrim). Status set by the gate."
