notes = "2026-10-31 (nightly fuzz run 41040730716, fuzz00254: SmApiTrimSurfaceWith3dCurves on a lifted net with a 1e300 control point never returns in the C++, HANG-29): the FFI refuses a trim3d surface coordinate above MAX_TRIM_SURFACE_COORD = 1e150 and the runner's Rust side refuses the same input (ffi::validate), so the case is rejected on both sides; plan/findings/primitive.api_trim_ops--nightly-fuzz00254-trim3d-huge-net-hangs-the-cpp.md. Gate unchanged (210 passed, 1 rejected). NOT IN callgraph/units.json: wrapper-only SM_API functions (1.0.1 parity batch 3, trimming): SmApiTrimSurfaceWith3dCurves, SmApiTrimProjectParallel, SmApiCreatePlanarFaces (SmApiTrimmedSurfaces.cpp), SmApiProjectAndTrim (SmApiBrep.cpp); every callee is ported (SmTrimmingTools::TrimSurfaceWithModelSpaceCurves, SmBrep::CreateFaceFromSurface, CreatePlanarFacesWith3DCurves, ProjectAndTrim). The projected curve is any SmBSplineCurve class: the ProjectAndTrim chain (topology::brep::p10::project_and_trim, p1::create_parallel_projection_curves, Surface::create_parallel_projection_curves) takes &Curve and dispatches the box and continuities on the class (an SmLine as in the upstream tests), the sweep on its NURB. Inputs are made by the SM_API constructors on both sides (boxes by SmApiCreateBox, filleted by SmApiCircularFillet as in TestSmProjectAndTrim). Status set by the gate."
