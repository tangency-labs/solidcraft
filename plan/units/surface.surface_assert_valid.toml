notes = "PR #1460, issue #1419 (WP3a): SmSurface::AssertValid (virtual) and the SmBSplineSurface, SmPlane, SmCone, SmCylinder, SmSphere, SmTorus, SmSurfOfRevolution and SmAxis2Placement checks, with HasKnotMultiplicityGreaterThanDegree, HasInternalPole, HasDegenerateControlPointRow, HasSameParameterization (curve) and SmPointGrid::SetUpMonotonic (none of them in harness/callgraph). Pinned upstream behaviour (no fork torus flags). SmCurveBoundedSurface, SmSrfInVolume and SmOffsetSurface checks return Unported (WP3b). SmSurfOfExtrusion::AssertValid ported (WP3b, its own PR): 170 named fixture cases (fixtures/surface.surface_assert_valid/extrusion.json, from fixer-5's independent port: line, perpendicular, independent, coplanar and non-planar generators with and without a tangent along the extrusion, at three scales, levels, make and swap, and test 7/8 corruptions) and 400 generated extrusion cases ext0000.. on their own seed stream (main's gen cases unchanged). GATE COUNTS: TODO from the leader's run. GREEN (2026-10-30, after the merge with the extrusion cases): PASS surface.surface_assert_valid cases=2370 passed=2214 failed=0 deferred=0 max_rel_err=0e0 rejected=156 (rejected by the FFI guards: iso boundaries that cannot be built, HasInternalPole indexing outside the net). Interior knots above the degree (B-spline test 1) and sphere V intervals past a pole (sphere tests 3/4/5) are compared against C++; they are drawn by 300 generated cases ovf0000.. on their own seed stream, so every gen case keeps main's inputs. BSplineSurface::create_iso_parametric_curve now returns the calloc'd all-zero curve at such knots, as upstream. Regression tests: the tests module of crates/solidcore/src/surface/surface/assert_valid.rs and iso_curve_at_knot_above_degree_is_the_zero_curve in nurbs/b_spline_surface/p2.rs."
