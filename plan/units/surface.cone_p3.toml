notes = "PARTIAL (PR #226 / issue #207; trim-domain status follow-up): Linux difftest 1416 cases, 1381 pass (1373 with values, 8 native-guard rejection assertions, Rust executed but not compared), 0 failed, 35 deferred (surface.surface_p2 typed Cone adapter 35; surface.cone_p2 wired by PR #153), max_rel_err 0, no absolute floors. Eight preserved status-1006 fuzz cases and four reduced plane intersections now pass after the GetHeight fix; two plane cases return circles. Three global fuzz cases and two valid-axis global neighbors explicitly defer on the existing general Cone adapter. The FFI accepts cone angles only within the documented [-360, 360]: far angles make native evaluation wrap one turn per iteration (HANG-1) and polar set-up never ends near 9.2e18 (HANG-23; Rust stops with NotConverged after 2^20 turns). 72 angle_bounds cases compare cones at both limits with every flag. A 10,000-case fuzz passes with no timeouts. The native guard intercepts only an attempted STEP-to-NURBS conversion with a null polar circle (UB-179), preserving defined early exits and non-null converters. Earlier evidence: PARTIAL (PR #131): 1308 difftest cases (108 fixtures + 1200 generated), 1187 pass bit-identical, 0 failed, 121 deferred (surface.cone_p2 91: sm_GetEllipseTrimIntervals; surface.surface_p2 30: Cone/Cylinder SurfaceKind adapter for the merged IntersectSurfaceBoundaries), max_rel_err 0, no absolute floors; 10108-case stress run clean (9048 pass, 1060 deferred), all 1187 default perturbations detected. Review follow-up adds optional/zero/negative/system-default tolerance fixtures, 320 native dispatch combinations and 14 constructor probes; native FFI tests are validated locally, separately from the unchanged CI workflow. Maintainer review: UB-123 documented; boundary bundles checked before duplicate removal; general fallback resets outputs. Global dispatch retains original arguments through a typed general-intersector callback until SurfaceKind can hold cones; sphere/shared Surface dispatch remains a documented gap (issue #76). 4 fns; largest: SmCone::IntersectWithPlane, SmCone::IntersectWithCone, sm_AddEllipseIntervalsTrimmedToTwoCones, SmCone::GlobalSurfaceIntersect; cycle back-edges (call into later units; stub or co-port): surface.surf_of_extrusion_p2(1), surface.surface_p11(1); unit-SCC #22 (220 units); 144 upstream test entry points reach this unit. Fuzz follow-up: reversed angle ranges snap/compare against the raw start/end angles as SmCone.cpp:3385-3390 (fixture fuzz_reversed_angle_range); IntersectWithCone ignores the ConvertUVFromSTEPToNURBS status (SmCone.cpp:2966-2967), now mirrored for a Y axis that unitizes to zero (upstream-issues WR-159; fixtures fuzz_axis_overflow_zero_y, _trimmed, _swapped). 1312 difftest cases (112 fixtures + 1200 generated), 1191 pass, 0 failed, 121 deferred [surface.cone_p2 wired (PR #153): 1312 cases, 1282 pass, 0 failed, 30 deferred (surface.surface_p2 30); --perturb SENSITIVE 1282/1282]"
