notes = "PARTIAL, MakeFaceTopology remainder (PR #363): SmBrep::MakeFaceTopology is ported in full, and the mislabelled UNPORTED(topology.face_p3) SetTolerance stop is gone. difftest 587 cases, 521 pass, 0 fail, 66 deferred (intersect.surface_drop_lib_p3 37: DropCurve in CreateUVTrimCurve(s) for trims and radial-sector recovery; topology.brep_p3 18; query.brep 9: CalculateBoundingBox; curve.crv_on_surf 2), max_rel_err 0, no absolute floors. Op 3 (fixtures make_face.json: 89 cases, 50 pass and 39 defer; plus generated cases) runs MakeFaceTopology sequences on kind-5 wire networks. It compares statuses, outputs, mark counters and the whole post-op graph (edge marks excluded, see findings). Downstream: brep_p7 238/78 (was 237/79), boolean.merge_p2 32/13 (was 30/15; MergeContext::SplitMut). With PR #72 merged locally, brep_p8: see the PR description. EARLIER: PARTIAL (PR #169, merged after dependency PR #154): 498 difftest cases, 450 passed, 0 failed, 48 deferred (topology.brep_p2 6: SmBrep::Notify; topology.brep_p1 23: SmBrep::GetInfiniteRegion inside CreateWireEdgeFromCurve, wired to topology.brep_p5 in PR #194, whose copy notifications follow behind a topology.brep_p2 key-routing barrier; topology.face_p3 19: SmFace::SetTolerance), max_rel_err 0, no absolute floors. Of the explicit op-0 cases, 369 return before acquiring a mark (separated mates or lamina); six tiny planes are edgeless and defer after closed traversal at Notify. 56 new open_box sheet cases reach ClosureTraversal and the open return: seeds 0/5 have no lamina edges and mates in the same shell. They compare actual nonzero context increments (MARK +4 per call without a caller lock), lock release, all faceuse marks and shell links over held locks and repeats. Other passing inputs are empty CopyEdges and null-surface MakeFaceTopology. MakeFaceTopology shim always has empty loops/edgeuses/loop-vertices and no explicit region: loop validation and existing-shell branches are not compared; every non-null surface defers at SetTolerance. No nonempty copy, successful face construction or completed split is certified; dependent mutation/classification/cleanup remains deferred. New shell/region identities and shell links use native -3, distinct from null -1. Wired heal.heal_data_p1 using RegionSplitAttempt: only ordinary native status may be ignored, preserving partial outputs; Unported and Rust representation errors propagate. Reused traverser HasLaminaEdge and the latest shell mark-lock API. Sensitivity detects 450/450 perturbations, with zero empty outputs. Four kernel and four native FFI regressions cover status/outputs and prove the open-sheet traversal advances marks. 3 fns; largest: SmBrep::TestClosureSplitRegion, SmBrep::MakeFaceTopology, SmBrep::CopyEdges; cycle back-edges (call into later units; stub or co-port): topology.brep_p1(3), topology.brep_p2(2), topology.brep_p5(2), query.brep(1); unit-SCC #22 (220 units); 196 upstream test entry points reach this unit UPDATE after topology.brep_p2 (PR #149): TestClosureSplitRegion's UNPORTED(topology.brep_p2) SmBrep::Notify is wired: the split API (test_closure_split_region / _attempt) takes the caller's NotifyEnv (signature only) and calls brep::p2::notify with PRE_EDIT and SPLIT_IN_BREP(old, old, new), statuses ignored (SmBrep.cpp:27954-5); the new region gets its default SmTopology record when it is made; the split then stops at UNPORTED(query.brep) SmBrep::CalculateBoundingBox. The runner passes a harness RegionNotifyState. Re-run: 498 cases, 450 pass, 0 fail, 48 deferred (topology.brep_p5 23, topology.face_p3 19, query.brep 6: the 6 former SmBrep::Notify deferrals, relabelled only), --perturb SENSITIVE 450/450. Re-run in PR #149 (review 5578349117 round, merged with main through fb58ea76; topology.brep_p2's UNPORTED stubs wired): 498 cases, 450 pass, 0 fail, 48 deferred; the CopyEdges Notify / SetTolerance sites are wired (the 6 SmBrep::Notify deferrals relabel to query.brep CalculateBoundingBox). UPDATE (PR #535): TestClosureSplitRegion remainder (SmBrep.cpp:27966-28583) ported; the OMITTED stop is gone. difftest 587 cases, 545 pass, 0 fail, 42 deferred (intersect.surface_drop_lib_p3 37, curve.crv_on_surf 2, topology.brep_p1 2, geom.tol 1), max_rel_err 0, no absolute floors. Ray fires read the geometry under the caller's key_of (brep::p2::caller_cache_key). Downstream: brep_p10 1075 pass, 312 deferred (+4 pass); the former split stops in fillet_geom_p4, merge_p2, brep_p7, brep_p8 and heal_data_p3 now defer at geom.tol GetZoneTol3d(const SmObject*), topology.face_p2 or DropCurve. See plan/findings.md."
