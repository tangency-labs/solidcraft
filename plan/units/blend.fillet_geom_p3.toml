lend.fillet_corner_p2 2; was surface_intersector_p4 31), 0 failed, 7 rejected. 6 fns; largest: SmFilletGeom::ReCalcFilletGeom, SmFilletGeom::TopologySplit, SmFilletEdge::CalcFilletIntFillet, SmFilletVertex::CalcMateGeom; cycle back-edges (call into later units; stub or co-port): blend.fillet_geom_p5(9), blend.fillet_geom_p2(7), blend.fillet_geom_p6(4), blend.fillet_geom_p4(2), blend.fillet_solver_p2(2), blend.fillet_corner_p2(1); unit-SCC #22 (220 units); 31 upstream test entry points reach this unit; PR #242 partial: 325 cases (25 fixture in fixtures/blend.fillet_geom_p3/cases.json, 7 of them expected_rejection regressions; 300 generated: mates, on-vertex, fillet x fillet edges (with and without a 3D curve, crossing planes and patches), corner-edge dispatch (incl. CalcRailRailInterpolation), the part-2/4 vertex calculators through CalcCornerVertGeom and as a mate's main vertex, ReCalcFilletGeom with unset (-SM_BIG_DOUBLE) rail-end uvs), 283 passed, 35 deferred (intersect.surface_intersector_p4 31: DoPointIntersection on the SmFilletIntersector in ReCalcFilletGeom, a DISPATCH GAP: the base driver does not reach the fillet intersector's overrides and FilletSolver does not implement fillet_intersector::FilletSolverOps, the intersector's constructor is wired (#179); and the point-based intersection inside sm_SrfSrfIntersection of two B-spline fillet surfaces; blend.fillet_corner_p1 2: GetFilletEdges in CalcRailRailInterpolation with a corner; blend.fillet_corner_p2 2: RecordFilletError after a failed intersection), 7 rejected, 0 failed, max_rel_err=4.6e-15, no absolute floors; 2000-seed sweep 1795 pass / 223 deferred / 0 failed; --perturb SENSITIVE 283/283; --fuzz 2000 FUZZ-PASS. The stubs into blend.fillet_geom_p2 and p4 (#263) are wired: CalcRailIntRail, CalcRailIntEdgeuse, CalcVertOnCrossSection, CalcSetBackVert, CalcRailIntExtendedEdgeuse, CalcFilletInt2Fillets, CalcRailRailInterpolation and sm_SrfSrfIntersection (then SetCurve/SetUVCurve); the shim runs the vertex