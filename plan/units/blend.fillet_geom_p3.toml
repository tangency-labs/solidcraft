e's CalcFilletIntFillet is FilletBrep::calc_edge_fillet_int_fillet (the vertex one is blend.fillet_geom_p5's, #264). TopologySplit is kernel-tested only (upstream needs a real SmFilletExecutive). ReCalcFilletGeom never reaches success until the intersector dispatch gap is closed. The back-edge TopologySplit in blend/fillet_solver/p1.rs (split_fillet_geom_at_side_edge) is wired (PR #247, on #303's FilletGeomIds). Upstream issues UB-211 (CalcVertOnVert NULL/wrong-kind object), UB-185 (unbounded mate recursion; MAX_MATE_DEPTH = 64), UB-208 (ReCalcFilletGeom reads the first of no sorted points without a march direction), UB-210 (CalcFilletIntFillet reads the context of a missing corner); the shim refuses exactly those models. UPDATE (PR #247): the part 5 calculators are wired in CalcCornerVertGeom / CalcCornerEdgeGeom (CalcFilletIntFillet, CalcCrossSection, CalcFilletIntSideFace, CalcEdgeOnExtendedEdge) and in the edge's CalcFilletIntFillet (now taking the target B-rep); ReCalcFilletGeom's CalcCrossSection stays UNPORTED(blend.fillet_geom_p5) (it needs a solver table ReCalcFilletGeom does not get; unreachable today). Shim after #247 (PR #242): the vertex CalcFilletIntFillet (part 5) and a fillet x fillet edge's unprocessed end vertex run on vertices without a corner, as p5's own shim does, instead of being refused as unported."
