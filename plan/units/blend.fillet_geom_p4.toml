xtendedEdgeuse; cycle back-edges (call into later units; stub or co-port): blend.fillet_geom_p2(4), blend.fillet_geom_p6(4); unit-SCC #22 (220 units); 31 upstream test entry points reach this unit UPDATE (PR #204, topology.brep_p3): FilletBrep::make_face_brep takes k: &mut Kernel (topology::brep::p7::make_face_with_curves / trim_surface_with_model_space_curves make topology.brep_p3 wire edges); runner and unit test pass &mut k; the runner file is rustfmt'd. Report unchanged (370 cases, 340 pass, 0 fail, 30 deferred).; UPDATE (PR #247, blend.fillet_geom_p6): GetRailIndexOfVertexuse, JoinTwoFilletVertsByCurves, CalcBlendingRail and RecordFilletError wired to part 6 (MakeFaceBrep's 3D curve list is Option<Curve>, as the join appends). The runner's MakeFace B-rep now has the void infinite region SmBrep() makes (Brep::new_with_infinite_region; before, TrimSurfaceWithModelSpaceCurves stopped at NER(pRegion) where C++ goes on). Fix: CalcBlendingGeom reads m_vRails[i] as its loop reaches it (a NULL second rail after a failing first rail is SM_ERR, not SM_ERR_NULL_POINTER; 2 fixtures in review.json). Re-run: 400 cases, 382 pass, 0 failed, 18 deferred (topology.brep_p3 18); --seeds 2000: 2038 pass, 0 failed, 60 deferred; --perturb SENSITIVE 382/382 TOUCHED (blend.fillet_solver_p4, PR #212): FilletBrep::calc_blending_geom_of_solver (CalcBlendingGeom with the geometry's solver given), used by CalcFilletGeom."

