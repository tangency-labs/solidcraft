tion::IntersectVertices, SmCurveClassification::MergeClassifications, SmCurveClassification::ExtractGeometry; cycle back-edges (call into later units; stub or co-port): topology.edge(6), topology.vertex(5), boolean.topology_intersector_p1(2), heal.gap(1), topology.edgeuse_p1(1), topology.vertexuse(1); unit-SCC #22 (220 units); 317 upstream test entry points reach this unit; full CI evidence is tracked in the PR description. Merge of PR #65: GetPointClassByIndex wired to p7; difftest now 1081 cases, 416 passed, 0 failed, 665 deferred. Rust adapter extended in heal.heal_data_p3 (PR #164): merge_intervals_with_partial retains completed intervals' output on failure for native ignored-status callers; unit accumulator regression covers failure in both passes. Public merge_intervals result contract is unchanged. SELF-DEFERRAL (noted by PR #146): the GWC:CHANGED_SSS block of SmCurveClassification::IntersectVertices (SmCurveClass.cpp:14826-15095) is UNPORTED(intersect.curve_class_p5) in p5.rs; porting it needs mutable curve/B-rep access in IntersectVertices plus a mate-lookup closure (boolean.topology_intersector_p1's other_mate / brep_mate)."
