notes = "UPDATE (Boolean2D cover face context): both CoverCoincidentSurface passes run on the faces' own surfaces under a BrepFaceServices solve context (SmFace::PointClassify in GlobalPointSolve, RemoveUVTrimCurves per face in call order); the 10 coplanar Boolean2D cases now compare: GREEN cases=773 passed=764 failed=0 deferred=0 rejected=9. PR #738: Boolean2D's IntersectInsertRelate, GetCommonEdges/Vertices, Relate, GetOtherMate/GetBrepMate and DeleteFaces run on merge p4's KernelManifoldIntersector; the op-6 runner builds real CreateFaceFromSurface faces in SmBrep(SM_USE_DEFAULT) operands and compares a successful result's counts and geometry. The 10 coplanar cases now defer earlier, in CoverCoincidentSurface: STEPInversion of a face-owned surface reaches GlobalPointSolve's trimmed-cache point test (SmFace::PointClassify, no face context there, surface/surface/p4.rs). PARTIAL cases=773 passed=754 failed=0 deferred=10 rejected=9. main CI e33985411 (2026-10-23): PARTIAL primitive.primitive_creation_p1 cases=773 passed=740 failed=0 deferred=24 rejected=9 blocked_by=boolean.topology_intersector_p2(10),surface.trim_srf_cache(8),topology.edgeuse_p3(2),topology.face_p2(4). PARTIAL (PR #213 review, 2026-10-20, canonical main e5f3e441): 773 cases, 689 passed, 0 failed, 75 deferred (boolean.topology_intersector_p2 10, topology.brep_p3 6, topology.brep_p8 59), 9 rejected, max_rel_err=0, no absolute floors. Both MakeFaceWithCurves adapters now call topology::brep::p7 with caller region/domain, loops, 3D/UV curves and orientations. Constructors now forward caller NotifyEnv records/attributes/keys required by current p7; the primitive fixture creates a real infinite region for current p9 validation. StitchAndOrient, Transform (scale=None, scale_tolerances=true), and RemoveTopologicalEdgesAndVertices (no keep lists, caller NotifyEnv forwarded) call topology::brep::p5. IntersectInsertRelate and DeleteFaces still require a retained session adapting Boolean2D to merge_p4 ArenaPair