notes = "PR #201 integration extends the production adapter with borrowed caller topology/curve identities and reserved region source-list handles while preserving the existing namespace-backed API. Actual notification records are restored with partial edits on Result exits and unwind; attributes and live contexts remain caller-owned. The automatic-tolerance constructor still belongs to boolean.merge_p2 (#229); borrowed cache access stops at the genuine query.brep bounding-box call and awaits live-kernel cache plumbing. Late consumption before cache/transform errors follows native ordering; operand slots, not Result alone, determine retained Rust ownership. Existing 311-case report is byte-identical, and 30/30 perturbations are detected; latent caller-key tests do not certify successful constructive Booleans. Historical port evidence follows: 1 fn, SmMerge::ManifoldBoolean; PR #243 partial. Full control-flow tail and scoped inverse transform; explicit two-context marks/editing and shared caller AttributeStore. No success path compared yet: all valid pairs stop at merge_p1 CalculateBoundingBox / query.brep. Null errors compare status plus post-state, including surviving graphs. KernelManifoldIntersector implements all 16 methods: shared MergeState<Relations>, canonical mates, caller notification records/attributes, all four merge_p1 stages and the merge_p5 paired-kernel wire API. Common lists share the generic intersector helper; source-region keys resolve real arenas. Focused adapter tests are separate from Boolean success coverage. CloseIntersectionLoop is a live units.json/unused callgraph gap (SmMerge.cpp:2958), co-ported into boolean.topology_intersector_p2 by PR #281, which also wires it here: KernelManifoldIntersector::close_intersection_loop calls TopologyIntersector::close_intersection_loop over the ArenaPair (the trait method now takes the caller AttributeStore and has no default). The callback retains PR #201 caller notification keys and namespace-aware cache configuration. PointClassify caller logic stays outside its stub. CopyFaces is wired to brep_p7; no incoming UNPORTED(boolean.merge_p4), shared Relations face storage/map-access extensions only, no dependency algorithm co-ports, no absolute floors. Difftest: 311 cases, 30 null-error state matches, 278 query.brep deferrals, 3 native constructor rejections, 0 failed; with_values=30 no_values=0; real Boolean successes=0 (status-as-data makes cases_both_errored=0). Fuzz 2000: rejected=203 malformed=866 ran=931 differs=0 crashes=0 panics=0 timeouts=0. Perturb 30/30; fmt/include rustfmt, checks x2, clippy x2, 1414 tests (eight adapter regressions), wasm pass after main 154853c7 (progress-only). Three requested adapter mutants each fail their intended assertion and were restored byte-identically; production unchanged from CLEAN 0ceda887. Its coordinate/error-state regressions and 405-case full-leak Valgrind baseline comparison pass (0 errors/lost bytes). Its full green gate passed: 214 units, failed=0; every reported partial matches the plan and no plan-green unit deferred. Re-run in PR #149 (merge with main through 39ceb995, #283): 311 cases, 30 pass, 0 fail, 278 deferred (query.brep 278; unchanged): IsSheet / IsOrientedSheet (in the other B-rep's kernel) and DeleteStaleCaches call topology.brep_p2; ArenaPair implements brep_arena and BrepGlue (GlueVertices through p5::glue_with_notifications). UPDATE (PR #204, topology.brep_p3): new_component_brep's UNPORTED(topology.brep_p3) SmBrep::SmBrep is Brep::new_with_infinite_region (the kernel is held shared there: no context tolerance, sizes or SM_NO_CONSTRUCTION notification, the deviation of blend.fillet_geom_p1 / primitive.api_primitives). UPDATE (PR #204, topology.brep_p3, Opus review of 255d52b7): KernelManifoldIntersector::new caps namespaces at 26 bits (0x03ff_ffff, was 27): a 27-bit namespace set bit 63, inside topology.brep_p3's reserved key range (KERNEL_KEY_BASE), so ArenaPair's p3 edits would refuse keys its p5 glue accepts; notification_key_blocks_never_alias_across_operands_or_classes tests the new bound and that the largest namespace's keys are not reserved. #282's DELETE_FACES_NAMESPACE 0x00f5e700 is within it (COORD #282 x #204)."
