notes = "NOT IN callgraph/units.json: SmApiReadBrepFromFile (SmApiImportExport.cpp:12), SmApiReadPartFromFile (SmApiImportExport.cpp:61), SmApiTurnToNurbs (SmApiBrep.cpp:2630) and the file-static SmApiAddCurveOutputSlots (SmApiBrep.cpp:46) are listed in harness/callgraph/unused_functions.txt (SM_API gap table batch 4). Rust: topology::api_files::{read_brep_from_file, read_part_from_file, turn_to_nurbs, add_curve_output_slots}; topology::brep::p5::turn_to_nurbs_plain (the plain SmBrep::TurnToNURBS entry point Transform already used). Difftest topology.api_files: 77 fixture cases (SM_API_test TestSmImportExport ASCII and binary round trips, TestSmErrorCodes null arguments, TestSmRemoveFilletNurbsPlanes' filleted box, the 15 topology.brep_p7 read files with and without UV trim rebuild, 8 part files with and without prefilled outputs) plus generated cases. SmApiAddCurveOutputSlots is file static (no C++ entry point a shim can call without compiling SmApiBrep.cpp into it); its callers SmApiProjectCurve / SmApiCreateSilhouetteCurves are unported, so it is covered by unit tests only until they land. TurnToNURBS reaches its analytic branches through SM_API_test TestSmBrepCopyRepresentation's bodies (SmApiCreateCylinder(o,3,8), Cone(o,3,1,8), Sphere(o,3), Torus(o,5,1), and the box with face 0 replaced by its CopyAnalyticAsNurb); the 15 read files are pure B-spline (the already-NURBS no-op). Unreached: its SmOffsetSurface branch (ApproximateOffsetSurface and CreateExtendedSurface) and its SmCrvOnSurf edge-curve lift (no constructed body has either). Records compare the UV trim curves (per edge use: type, interval, three samples) and support/primitive_record.h's append (edge use and trim counts), so read_brep with and without rebuild and TurnToNURBS's trim handling are compared beyond topology. A binary read of an ASCII test file (read_disk_ascii_file_as_binary) is a memory-safety crash in SmBrepData::ReadFromDB (held record); the FFI guard rejects binary reads of the text test files, so the case is recorded as rejected. The test crates/difftest/tests/api_files_binary_text.rs reads every upstream .smb and .smp as binary through the wrappers and requires an error without a panic or an abort; the binary success path is compared through the round trips. Status set when the difftest gate has run."
