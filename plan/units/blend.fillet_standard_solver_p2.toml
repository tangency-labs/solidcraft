notes = "PR #439 (continues #265; developed on #303, now on main). difftest: 405 cases (400 generated + 5 fixtures), 373 pass, 0 fail, 27 deferred (surface.surface_p2(13), blend.fillet_executive_p1(8): SmFilletLaw::Evaluate via DoLawIntersection in ReCalcFilletGeom, surface.surf_of_extrusion_p2(5), intersect.surface_drop_lib_p3(1)), 5 rejected; --perturb SENSITIVE 373/373; --fuzz 2000 differs=0. FinishConstruction wired (follow-up to #439: the constructors take the pseudo B-rep and solver id, add the default fillet geometry and call finish_construction where upstream does; the CD edge-use and Ss ops compare that geometry; case counts unchanged). Kept stubs: SetEdgeArcLength (blend.fillet_executive_p1), CalcFilletGeom tail (StepSolve: blend.fillet_solver_p3, justified in findings; GetPseudoBrep: blend.fillet_executive_p1). PARTIAL (PR #265, 2026-10-20): difftest 405 cases (5 fixtures, 400 generated): 388 pass (all compare 3+ values), 0 failed, 17 deferred (surface.surface_p2 9, topology.brep_p10 5, intersect.surface_drop_lib_p3 2, surface.surf_of_extrusion_p2 1: B-rep surface kinds of the edge-use cases), max_rel_err 0, --perturb SENSITIVE 388/388; 3000 seeds: 2893 pass, 0 failed, 112 deferred, max_rel_err 3.8e-16. The earlier disagreement (fx_a / gen0180 / fx_d_guess, LoadInitialValues with extension factor 0.1) was surface.offset_surface's &self evaluators dropping the base extension they make, which upstream's const evaluators store (SmOffsetSurface.cpp:710-713, :1064-1068): a point solve that leaves the base domain sees the extended natural domain from then on; fixed there (plan/findings.md). Wired after #168 / #192 merged: SmFilletSolver::SetupOffsetExtension (base solvers), SmFilletSphereSolveENFO::Evaluate in PointOnPlaneSolve (dispatching on SmConstantRadiusAssistedFS), the fillet surface generators' CreateSurface (blend.fillet_solver_p1's dispatcher now takes the solver type, centre line and rail surfaces), blend.fillet_custom_solver's inherited overrides; FilletSolverType / FilletSurfaceGeneratorType of blend.fillet_standard_solver_p1 re-export blend.fillet_solver_p1's. Compared with real values: LoadInitialValues on SmSurfaceSurfaceFS and SmConstantRadiusAssistedFS (planes, open, closed and pole B-spline patches, rolling-ball corners), GuessPointOnPlaneSolve with SmGuessSphereSolveENFO::Evaluate and PointOnPlaneSolve with SmFilletSphereSolveENFO::Evaluate on SmConstantRadiusAssistedFS (box edge-use shim with replaced offsets), the SmSurfaceSurfaceFS constructor and CalcFilletGeom's parallel-normal exit, SmConstantDistanceFS's edge-use constructor on topology.edgeuse_p1 B-reps, IsKindOf of the assisted, surface/surface and variable-radius solvers. Partial functions: SmVariableRadiusFS::ReCalcFilletGeom stops at SmFilletGeom::GetRail (UNPORTED(blend.fillet_geom_p1)) and SmSurfaceSurfaceFS::CalcFilletGeom at StepSolve (UNPORTED(blend.fillet_solver_p3)) / GetPseudoBrep (UNPORTED(blend.fillet_executive_p1)), their pseudo-B-rep tails unported; the variable-radius constructors, LoadJacobian and LoadInitialValues are ported in full but reach the unported SmFilletLaw (SetEdgeArcLength / Evaluate, UNPORTED(blend.fillet_executive_p1)) and are not compared. Wires UNPORTED(blend.fillet_standard_solver_p2) GuessPointOnPlaneSolve of blend.fillet_custom_solver. Plan notes: 17 fns; largest: SmConstantRadiusFS::LoadInitialValues, SmVariableRadiusFS::LoadJacobian, SmVariableRadiusFS::ReCalcFilletGeom, SmSurfaceSurfaceFS::CalcFilletGeom; cycle back-edges (call into later units; stub or co-port): blend.fillet_geom_p5(1); unit-SCC #22 (220 units); 319 upstream test entry points reach this unit"
