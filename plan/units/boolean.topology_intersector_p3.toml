notes = "PARTIAL (PR #211): MergeCurveClasses, MergeCurveOnSurfaces and MergeCoincidentSurfaces ported in full. query.face_p1 and topology.face_p4 (partial) are wired: SmFace::Point3DClassify, CalculateBoundingBox (bTight FALSE), GetEdges and GetUpwardLoopuses are IntersectorBrepP3 hooks the adapter implements with query::face::p1 / topology::face::p4; dCurveTolerance reaches the point classifications as SmZoneTol3d (zone_tol3d). One stub, for a call into a unit still todo: topology.brep_p4 DeleteEdge (#441). On main (#146, #203, #85, #137, and the curve_class topology wiring #347 / #365 merged); CheckForSqueezeVertices combines coincident vertices (#274), so IntersectorBrepP3 extends IntersectorBrepP2 and the merges take &mut Kernel. ClassGeometry::topology_handle_in lets the two-B-rep adapter name handles in main's curve_class helpers. difftest (linux/arm64 container): 271 cases (256 generated + 15 inline), 166 passed with values, 0 failed, 105 deferred (intersect.curve_class_p6 57, topology.vertex 27, intersect.surface_drop_curve 15, topology.brep_p3 6); --perturb SENSITIVE 166/166; --fuzz 2000 FUZZ-PASS (0 differs). Review r1 (tangency-monitor): the shim and runner refuse an SM_PC_UNKNOWN start or end of a face- or region-mid interval (MergeInterval leaves it without object; SmCurveClass.cpp:17659/:17672 dereference it); MergeCurveOnSurfaces takes UV trim curves (K_TRIM_CURVE, 3 inline cases, deferring at intersect.point_class's SmVertex::GetTolerance stub in MergeIntoObject); MergeCoincidentSurfaces' 3D edge-curve copy gets the edge curve's owner as upstream. The runner reuses the p1 runner's two-B-rep adapter and reorders imported vertex-use lists to upstream's list order (see plan/findings.md). Back-edges: blend.fillet_geom_p4's MergeCurveOnSurfaces stub retagged blend.fillet_executive_p1 (it runs on the executive's intersector); boolean.merge_p1's MergeCoincidentSurfaces stays UNPORTED(boolean.topology_intersector_p3) pending an IntersectorBrepP3 implementation for merge p4's ArenaPair (follow-up). 3 fns; largest: SmTopologyIntersector::MergeCurveClasses, SmTopologyIntersector::MergeCoincidentSurfaces, SmTopologyIntersector::MergeCurveOnSurfaces; unit-SCC #22 (220 units); 110 upstream test entry points reach this unit UPDATE (PR #679, UpdateVertexEdgeIntervals wired in CombineCoincidentVertices): the runner numbers every post-merge handle and the state by a re-walk of both B-reps (boolean.merge_p1 Canon::reachable, the shim's walk_all), so records a squeeze deleted (unlinked, kept in the Rust arena) are unknown on both sides, as upstream. 271 cases, 172 pass, 0 failed, 99 deferred; the 6 UpdateVertexEdgeIntervals deferrals pass."
