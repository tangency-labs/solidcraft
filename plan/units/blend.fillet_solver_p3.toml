notes = "7 fns; largest: SmFilletSolver::StepSolve, SmFilletSolver::ProcessFullRollOver, SmFilletSolver::SplitAndTrimFilletSurface, sm_RefineRailCurveClassification; cycle back-edges (call into later units; stub or co-port): blend.fillet_solver_p2(6), blend.fillet_geom_p5(2), blend.fillet_geom_p2(1); unit-SCC #22 (220 units); 150 upstream test entry points reach this unit; PR #236 partial: 400 cases (generated StepSolve), 378 passed, 22 deferred (blend.fillet_solver_p2: PointOnPlaneSolve in the constant-radius-assisted clipped branch), 0 failed, max_rel_err=1.8e-15, no absolute floors. Built on #147 (head b396cdd3) and #192 (head a88c62af), merged. Other routines kernel-tested only (they reach p2 / fillet_geom_p5 stubs on every native path); see plan/findings.md. Adds FilletSolverOps::solver_type and constant_distance. Wires main's UNPORTED(blend.fillet_solver_p3) StepSolve back-edge in blend.fillet_intersector (ConstantRadiusAssistedFs::step_solve); StepSolve's flags are an out-param kept on failure (the shim and runner compare them after a failed solve too). Round 4: PointOnPlaneSolve is a FilletSolverOps hook (virtual upstream; default = the base stub, blend.fillet_solver_p2); the variable-radius GetOriginalCurve and the constant-distance GetDistance stubs are justified (findings.md: those solvers do not implement FilletSolverOps yet). UPDATE (PR #208 integration): ProcessFullRollOver accepts caller RailOwnership and shares the single typed p1 rail split/support helpers, preserving actual geometry ids, owner identities and notifications. Its final TrimCliffRails call dispatches through the existing live-solver p5 trim resolver using the geometry actual solver id; the old justified p5 stub is removed. P5 delegates classification refinement, rail/edge intersection and full rollover here. No numerical formula/order or status handling changes. Qualification after #236 in PR #208: PARTIAL blend.fillet_solver_p3 cases=400 passed=378 failed=0 deferred=22 max_rel_err=1.8011683050692552e-15 with_values=378 no_values=0 blocked_by=blend.fillet_solver_p2(22)."
