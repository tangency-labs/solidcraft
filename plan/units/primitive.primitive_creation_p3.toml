notes = "CO-PORTED in sweep.api_brep (PR #110): SmSweepOptions -> solidcore::primitive::primitive_creation::SweepOptions (crates/solidcore/src/primitive/primitive_creation.rs, parent module of p1..p3); 8 fns; largest: SmPrimitiveCreation::CreateCurveSweep, sm_CreateRuledSurfaceFromOffsetCurve, SmPrimitiveCreation::CreateLinearSweep, SmPrimitiveCreation::CreateRotationalSweep; 60 upstream test entry points reach this unit; PR #233: all eight owned functions ported through PrimitiveAccess/SweepAccess, retaining full tails after unavailable calls. Review #233 after main 95b823ed and dependency heads #213 92005b59 / #222 86c7eb33: difftest 296 cases, 285 bit-identical passes (including finite zero/negative-tolerance helper comparisons and the empty swung return with a negative unused tolerance), 10 topology.brep_p8 deferrals (including zero/negative curve-sweep, skin and swung tolerances), 1 UB-78 rejection, 0 failures; no absolute floors. Native ruled-surface values and three mutated curve states are compared; curve-sweep preparation/scaling, face skinning, cap/axis/stitch/topology tails are not certified. Swung scaling and the curve-sweep scale reference keep original Curve dispatch; three exact Rust regressions distinguish analytic lines from their cached NURBs. Path/profile/scale-curve copies remain where upstream explicitly constructs them. Native derived construction remains deferred; real SmLine/SmCircle fixtures follow when it becomes comparable. The swung builder mirrors virtual GetOrCreateGwNurbPointer in section/trajectory order, materializing only missing analytic caches with caller owner/context; two additional Rust regressions cover lazy profile/path/both and preservation of an existing two-ULP cache. Review 2026-10-20 integrates canonical main 95b823ed, retaining both findings sections. Both DoStitching adapters now invoke landed Stitch::do_stitching with a shared B-rep-qualified sweep callback and their upstream option sets; its Notify dependency remains topology.brep_p2. Added negative skin/swung tolerance fixtures (including unused tolerance with no profiles) and Rust callback/state-restoration regressions. Available p5 and face-p3 defaults call their ports; intersector deletion is a required scoped caller adapter. Caller must supply a concrete PrimitiveAccess resolver with notification state. Scaling sampling bounded to 1000000 points; reused sweep engine bounds repetitions to 4096. Legacy sweep APIs now identify their earlier B-rep-constructor blocker. See fixtures/primitive.primitive_creation_p3/README.md and plan/findings.md. PR #233 face-box refresh (canonical main e5f3e441): PrimitiveAccess resolves caller BrepId/FaceId and invokes query.face_p1::calculate_bounding_box with tight=false; nonzero-face/foreign-owner Rust regression covers this adapter, not completed native rotational construction. Current #213/#222 contracts, caller notifications and retained HCR services are integrated; edge blend uses the current same-Brep form and HCR visibility receives mutable Kernel. After the landed pre-edit notification, the general sweep default reaches query.brep::CalculateBoundingBox and the empty linear-cap stitch succeeds; both regressions check flag restoration, while successful nonempty native stitching stays uncertified. Integration in PR #233 (2026-10-21, main 100535f4): forward the caller Kernel through primitive p1/p3, sweep, extrusion linearity and their runner evaluations after #133; is_linear_after_ends and ruled_surface_from_offset take that same Kernel; after the landed brep_p6 MakeFaceTopology, curve-owner and primitive detailed/trimmed-face constructors forward the same mutable Kernel, including cylindrical boxes. Existing formulas, ordering, tolerances, partial coverage and ready state are retained. Wire (2026-10-23): the PrimitiveAccess face services (topology.brep_p8 CreatePlanarFace(s)With3DCurves / CreateFace(s)FromSurface, topology.brep_p3 DeleteFace(face, FALSE, TRUE)) are real trait defaults over SweepAccess::with_brep_mut (PrimitiveModel's identical overrides removed), and axis_inside_face is a default over the SweepStore classifier (query.face_p2 SmFace::CurveOnClassify; PrimitiveModel no longer returns Unported for it); the runner adapter keeps a tag store, untagged curves and deletes faces through KernelManifoldIntersector::delete_faces_with_keys; entry records add the B-rep's face/edge/vertex counts. Difftest 296 cases: 295 bit-identical passes, 0 deferred, 1 UB-78 rejection, 0 failures -> green."
