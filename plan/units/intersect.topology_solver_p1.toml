notes = "UPDATE after curve.curve_p9 (PR #13): the GlobalCurveSolve back-edge is wired (curve_global_curve_solve); difftest 3532 cases, 3389 pass bit-identical, 0 failed, 143 deferred (topology.brep_p1 48, topology.edge 95; the 151 curve.curve_p9 deferrals are gone), --perturb SENSITIVE 3389/3389. Counts below are from before. PARTIAL: difftest 3532 cases (532 fixture: SM_API_test TestSmCreateRectangle / TestSmCreateRegularPolygon edges, my_test_drop_point, my_test_reversed_line_join lines, every operation on degenerate boxes / coincident and unit-distance vertices, tiny and huge circles, ray and at-distance tolerance limits, sub-domain edges, review adversarial cases (ray behind start, signed directed, at-distance 1e7, projected/directed MayContainAnswer, curve and edge solves), zero and tiny option vectors; 3000 generated), 3161 pass bit-identical, 0 failed, 371 deferred (curve.curve_p9 151: GlobalCurveSolve of non-intersecting curve/edge solves; intersect.topology_solver_p2 87: SmTopologySolver::LocalSolve reached from SolveTrees; topology.edge 85: edge parameter intervals in solution comparisons; topology.brep_p1 48: object zone tolerances of ray-fire solutions and ellipse solves); --perturb SENSITIVE. Solvers read vertices, edges, faces and shape membership through the TopologyObjects trait (the difftest backs it with free-standing SmVertex/SmEdge objects); a B-rep implementation belongs with the BrepCache trees (intersect.topology_solver_p2, topology.vertex, topology.edge, topology.face_p2). SmTLSPointFace and sm_GetFaceSilhouettes remain partial; p2 fixtures exercise face exclusion and explicit surface/query deferrals, and the cache factory is wired. Upstream issues UB-85, UB-86, WR-62 (WR-62 unconfirmed: single-call fixtures defer at SmTol::GetZoneTol3d). The curve_global_curve_solve stub gets both intervals, operation, tolerance, best answer, option vectors and SM_SR_ALL as upstream passes them; face_silhouettes calls surface_cache (surface.surface_p2) through TopologyObjects::surface; face_point_classify must return the class even when PointClassify fails (callers ignore its status). FFI refuses short option vectors only for the MayContainAnswer ray and the curve solvers (findings.md). 55 fns; largest: SmTopologySolver::MayContainAnswer, SmTLSPointFace::SolveIt, SmTLSPointVertex::SolveIt, SmTLSCurveCurve::SolveIt; cycle back-edges (call into later units; stub or co-port): topology.face_p2(6), topology.edge(5), topology.vertex(4), query.face_p1(1), query.face_p2(1); unit-SCC #22 (220 units); 317 upstream test entry points reach this unit; CO-PORTED in intersect.topology_solver_p2 (PR #60): TopologyObjects::brep_trees / shape_member_object / shape_geometry_object -> borrowed tree and topology-to-geometry adapters; LocalSolver::new supplies the shared SmTLSVertexEdge / SmTLSEdgeEdge constructors; LocalSolve and six local class stubs are wired to p2; current validation: 3532 cases, 3248 bit-identical, 0 failed, 284 deferred (curve.curve_p9 151, topology.brep_p1 48, topology.edge 85); max_rel_err=0; no absolute floors UPDATE after topology.brep_p1 (PR #145): the SmTol::GetZoneTol3d(SmObject*) stubs (object_zone_tol_3d here, SmSolutionArray::GetZoneTol3d in geom.solution_array) have no unported callee left (the tolerance arms are ported but take &Brep, which these sites do not hold) and are self-tagged; re-run 3532 cases, 3389 pass, 0 fail, 143 deferred (topology.edge 95, geom.solution_array 48)."
