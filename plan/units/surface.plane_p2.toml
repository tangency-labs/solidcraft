eIntersector is built since intersect.adv_surface_intersector merged); 60k-seed run clean; perturbation 2209/2209. The runner converts the tolerance with approx_tol3d as the shim does (SmApproxTol3d: |tol|, SM_USE_DEFAULT -> zone tol / 2; see findings.md). Builds on PR #24 (surface.surface_p7: SmSurface::EvaluateNormal for IsNurbSurfacePlane). Wired UNPORTED(surface.plane_p2) in surface.surface_p2 (Transform/TrimWithDomain/ReadFromDB/IntersectWithPlane/GlobalSurfaceIntersect plane dispatch), nurbs.b_spline_surface_p2 (CopyAndAddAnalytics returns the recognised plane; the cone recogniser is UNPORTED(surface.cone_p2)) and surface.surf_of_revolution_p1 (ported the IntersectWithPlane body below the plane box: 31 deferred -> 0, GREEN). A bare Plane has no owner: its CalculateBoundingBox zone tolerance is SM_ZONE_TOL_3D (a plane with a face through Surface::global_surface_intersect returns Unported on SmFace::GetTolerance, topology.face_p2: GetFace is Surface::face since surface.surface_p1). The SurfOfRevolution special case of SmPlane::GlobalSurfaceIntersect was added when merging main. 10 fns; largest: SmPlane::MakeNewPlaneEllipse, SmPlane::IntersectWithPlane, SmPlane::TrimCurveToPlaneDomain, SmPlane::IsNurbSurfacePlane; cycle back-edges (call into later units; stub or co-port): surface.cone_p3(1), surface.sphere(1), surface.surf_of_extrusion_p2(1), surface.surface_p1(1); unit-SCC #22 (220 units); 317 upstream test entry points reach this unit intersect.surface_intersector_p5 wired (PR #82): base_global_surface_intersect runs DoIntersection, whose surface caches defer at SmSurface::CalculateContinuities (surface.surface_p6); now 2218 cases, 2209 pass, 9 deferred (surface.surface_p6 9). [surface.surface_p6 wired (PR #92): 2218 cases, 2210 pass, 8 deferred (surface.surface_cache_p1 8)]"
