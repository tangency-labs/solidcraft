sjoint: Intersect Init()s the face domain) the natural domain. Wired: topology.brep_p1 (GetFaces/GetEdges/GetVertices/GetRegions/GetSurfaces/GetCurves, SmLockBrepBox RAII guard), topology.shell (GetRegion, IsWireShell, m_pList/m_tShellType writes, region PostInsert/Remove, face-use Remove/PostInsert), topology.edgeuse_p3 (NormalizedEvaluate), heal.stitch_p1 (SmStitch constructor and options), topology.face_p1 (SetSurface take-and-swap, RemoveUVTrimCurves, FlipFaceOrientation, RemoveLoop, InsertLoop, CalculateUVDomainFromUVTrimCurves), topology.face_p3 (SmFace::Notify with (pFace, this, NULL) through the caller's DeleteEnv, ComputeLoopOrientation), the co-ported face queries (query::face::p2::face_vertices, topology_traverser::face_edges for SmFace::GetVertices/GetEdges), heal.stitch_p2 (SmStitch::DoStitching). Remaining stubs: SmBrep::Notify (topology.brep_p2; carries upstream's data arguments), SmBrep::UnLockBoundingBox (query.brep). Back-edges: 18 of the 21 UNPORTED(topology.brep_p4) sites on main wired (boolean.merge_p3 ShrinkGeometry and its runner's ~SmBrep, topology.brep_p7 GlueEdgesGeneral, topology.brep_p5 combine/glue/remove-topological/remove-faces/make-manifold/StitchAndOrient and its record erasure, boolean.merge_p1, boolean.merge_p5, heal.heal_data_p3, topology.brep_p10 RemoveAllTopology, offset.offset_executive_p1 ShrinkGeometry x2); 3 justified per site in findings.md (opaque O handles: boolean.topology_intersector_p2 x2, topology.proto_topology_p3). The topology.brep_p5 integration gap (stable shell/vertex/vertex-use record erasure) is closed with Brep::remove_*_record. UB-210 (unreachable on well-formed topology; defensive InvalidInput). cycle back-edges (call into later units; stub or co-port): topology.brep_p2(3), heal.stitch_p1(2), heal.stitch_p2(1), query.brep(1); unit-SCC #22 (220 units); hazards: tbb PROMOTES boolean.merge_p5 to green (140/140, 0 deferred). Edge destruction (#556, 2026-10-23): DeleteEdge (manifold, lamina, wire) deletes its edge through topology::edge::destroy (~SmEdge's SM_NO_DESTRUCTION under the DoingBoolean toggle, then ~SmAObject's ClearAttributes) instead of the bare arena removal; GlueEdgesGeneral (topology.brep_p7) uses the same. Face, edge use and shell destructors stay unmodelled. Edge use, face and shell destruction (#556, PR #631): DeleteEdge's edge uses and merged-away face and DeleteVertex's vertex shell go through edgeuse::p2::destroy, face::p3::destroy and shell::destroy (their destructors' SM_NO_DESTRUCTION, then ~SmAObject's ClearAttributes). Records without a notifying destructor (face uses, loops, loop uses, vertices, vertex uses, regions) and the whole-B-rep destroy stay without attribute cleanup."
