notes = "#76 kernel-aware Surface dispatch (PR #313, 2026-10-21): 600 cases, 600 pass, 0 failed, 0 deferred, max_rel_err 0; before 559 pass / 41 deferred. PARTIAL: difftest 600 generated cases (LocalSurfaceIntersect over Bezier patches and planes: crossing, standing, nearly parallel, tiny and huge scales, sub-domains, guesses on boundaries, plane normals (also zero), previous points, boundary testing; IntersectSurfaceBoundaries of coincident and crossing patches and planes), 498 pass bit-identical, 0 failed, 102 deferred (surface.surface_p8 102: sm_IntersectSrfBndryCrv); --perturb SENSITIVE 498/498; SmCSGlobalSolver/SmSSGlobalSolver::LocalSolve are compared through surface.surface_p7's GlobalCurveSolve/GlobalSurfaceSolve cases (first 16 solutions; minimize, maximize, normalize, signed directed minimize, intersect for nodes) and the intersectors; LiftCurve defers at sm_ExtractIsoCurve (surface.surface_p8) and past it has a dispatch gap for non-B-spline surfaces (CrvOnSurf holds a B-spline, findings.md; marked UNPORTED(curve.crv_on_surf)). Coverage acknowledged, not closed: the shim builds only Bezier patches and planes (the leaf solves are not compared on revolution, curve-bounded, Step or SrfInVolume surfaces); SM_SO_3D_SIGNED_DIRECTED_MAXIMIZE is not generated because sm_SCLocalSolve asserts on it (the Rust side returns InvalidInput, the release C++ continues); LiftCurve has no shim or runner after its first line; some passes compare no values; MAX_SUBDIVISION_NODES (2^20) stays (a surface.surface_p1 case at 1e-4 scale needs more than 2^18). Wired UNPORTED(surface.surface_p11): SmSurface::LocalSurfaceIntersect (intersect.surface_intersector_p1, used by adv_surface_intersector/p3/p4/p5), SmCSGlobalSolver/SmSSGlobalSolver::LocalSolve (surface.surface_p7: global_curve_solve/global_surface_solve now take the kernel and handles; intersect.topology_solver_p2 updated), GlobalSurfaceSolve SM_SR_NODES (intersect.surface_intersector_p4 FindInteriorCurves, via global_surface_solve_with). Wired UNPORTED(surface.surface_p3) after merging main: SmSurface::LocalSurfaceSolve. Bounded surface cache subdivision (surface.surface_cache_p3 MAX_SUBDIVISION_NODES, the 3.5 GB abort). Upstream issues UB-121, WR-99; plane boundary curve type mismatch with surface.surface_p9 recorded in findings.md. 5 fns; largest: SmSurface::LocalSurfaceIntersect, SmSSGlobalSolver::LocalSolve, SmSurface::LiftCurve, SmCSGlobalSolver::LocalSolve; cycle back-edges (call into later units; stub or co-port): surface.surface_p8(2); unit-SCC #22 (220 units); 317 upstream test entry points reach this unit Re-run (PR #118, sm_IntersectSrfBndryCrv and sm_ExtractIsoCurve wired to surface.surface_p8): 600 cases, 559 pass, 41 deferred (curve.iso_curve 41), 0 failed; --perturb SENSITIVE 559/559; the surface.surface_p8 deferrals are gone.; LiftCurve is now compared through blend.fillet_geom_p6 (PR #247: CalcFilletEnd and CalcBlendingRail lifts of up to ~5000 control points, bit-identical with sm_IntersectAndSplit's curve handle, fixed on main by #444)"
