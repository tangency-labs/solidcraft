dge uses), sm_SwapFaceUV (marked face), sm_RedistributeSeamUVTrimCurves (no trim curve / non-seam), IsDegenerate (vertex check) and most sm_MakeVertexSplitUVTrimCurve passes are early returns; GetFaces/GetEdges/GetVertices compare the imported native list order (no case lists after a mutation or on a Rust-built B-rep); the shim decides the deferral itself (-3, C++ not run) for BrepIntersect with faces (CreateCornerBlend with 2+ edge uses and CreateEdgeEdgeBlend blends run the C++ since Round 6). Adds to topology::Brep the SmBrep-owned members (infinite region, region list head, editing flag, size estimates, deleted surfaces, explicit face/edge/vertex list order; a future record deletion must unlink from the lists). Upstream defects: UB-98 (SmCopyBrepMap::SetAt/GetAt null deref) met again and reproduced with gdb; UB-162 (sm_RedistributeSeamUVTrimCurves reads sNewEdgeuses[3] unchecked) found by source review, the shim refuses it. Back-edges: UNPORTED(topology.brep_p1) wired in topology.edge, topology.brep_cache, heal.heal_data_p2 (GetTolerance, Get/SetThisModelSizeEstimate), geom.tools, mass.integrator, query.api_queries, heal.heal_data_p1 (#109: GetVertices/GetEdges/GetFaces, the region walk from the infinite region, HealBrep) and boolean.merge_p1 (#163: GetEdges, GetShells); the SmTol::GetZoneTol3d(SmObject*) stubs of curve_cache, ellipse_p1, topology_solver_p1, trim_srf_cache, surface_cache_p1/p2, solution_array and the geom::tol header are self-tagged (the tolerance arms are ported but those sites hold an opaque object handle; maintainer's call); geom.object -> query.brep, proto_topology_p1 -> topology.brep_p2 (GetMinEdgeBBoxSize), trim_srf_cache editing flag -> topology.face_p4. 50 fns; largest: SmBrep::HealBrep, SmBrep::CreateCornerBlend, SmBrep::CreateEdgeEdgeBlend, sm_MakeVertexSplitUVTrimCurve; cycle back-edges (call into later units; stub or co-port): query.brep(3), heal.heal_data_p1(2); unit-SCC #22 (220 units); hazards: ptr-hash; 319 upstream test entry po