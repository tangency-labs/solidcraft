notes = "KM-BINORMAL FIXED (PR #581, 2026-10-23): the edgeuse_p1 shim exports each face surface's cache slot (CacheStates op) and the runner restores it on the imported B-rep, so the 23 EvaluateBinormal Endcap.smb known mismatches pass: difftest 4789 cases, 4709 pass, 0 failed, 80 deferred (intersect.curve_class_p2 80), 0 known mismatches, max_rel_err 0. KM-BINORMAL (PR fix/km-binormal, 2026-10-22): MAX_SUBDIVISION_NODES raised to 2^22 on 64-bit targets (the C++ builds 2 014 255 nodes for the 1e-4-scale adversarial faces), so the 9 surface.surface_cache_p3 deferrals compare and pass; difftest 4789 cases, 4686 pass, 0 failed, 80 deferred (intersect.curve_class_p2 80), 23 known mismatches, max_rel_err 0. The 23 EvaluateBinormal(bUse3DOnly) Endcap.smb mismatches are root-caused (known_mismatches.toml): C++ reuses the tree-less SmTrimSrfCache that ReadFromFile healing leaves on each face surface, so no UV trim curves are made; the Rust B-rep keeps no per-surface cache and the graph export does not carry it. SURFACE CACHE WIRED (PR fix/surface-cache-face-trim, 2026-10-22): EvaluateBinormal builds the face's trimmed surface cache over the B-rep (query::face::p2::face_surface_cache), so SmFace::CreateUVTrimCurves runs as upstream; difftest 4789 cases, 3177 pass, 0 failed, 1612 deferred (intersect.surface_drop_lib_p3 1603, surface.surface_cache_p3 9: tiny adversarial surfaces past the port's MAX_SUBDIVISION_NODES), max_rel_err 0; topology.face_p3 deferrals 274 -> 0. EXACT SmSurfOfRevolution EXPORT (PR #304, shared graph exports carry revolution faces exactly; refreshed on main 16f04231, 2026-10-21): difftest 4789 cases, 2721 pass, 0 failed, 2068 deferred (intersect.surface_drop_lib_p3 1276, surface.surface_p2 329, topology.face_p3 274, surface.surf_of_extrusion_p2 189), max_rel_err 0; 2389 -> 2721 pass (topology.brep_p10 381 -> 0; intersect.surface_drop_lib_p3 +49). Earlier: 5 fns; largest: SmEdgeuse::CreateUVTrimCurve, SmEdgeuse::EvaluateBinormal, SmEdgeuse::GetOrCreateUVTrimCurve, SmEdgeuse::NormalizedEvaluate; cycle back-edges (call into later units; stub or co-port): heal.gap(2); unit-SCC #22 (220 units); 317 upstream test entry points reach this unit PARTIAL (PR #117): difftest 4789 cases (fixtures/topology.edgeuse_p3: upstream .smb files, wire edges, faces from B-spline surfaces and SmPlanes, faces whose edges are SmCrvOnSurf on open, U-closed and V-closed B-spline bases (crv_on_surf.json), the my_test_topology network, review.json (EvaluateBinormal UV direction); + generated), 2389 pass bit-identical, 0 failed, 2400 deferred (intersect.surface_drop_lib_p3 1227, surface.cone_p1 140, surface.sphere 189, surface.surf_of_extrusion_p2 189, topology.brep_p10 381, topology.face_p3 274); --perturb SENSITIVE. Ports CreateUVTrimCurve, GetOrCreateUVTrimCurve, EvaluateBinormal (+UV vector), NormalizedEvaluate and the SmFaceuse::CollectAdjacentFaceuses angle branch (topology.edgeuse_p1). Upstream defect WR-158 (two-singular-end-points recovery joins into a discarded array) reproduced. Wired: SmSurface::GetSingularities (surface.surface_p3), UNPORTED(topology.edgeuse_p3) in heal.gap (GetGapEndPoints; gap constructors take k and &mut Brep), topology.edge/vertexuse/loopuse/face_p2 callers, EvaluateBinormalStepOff into topology.edge (GetBlendEdgeuse; evaluate_binormal_step_off_into keeps what a failing call writes). Wired: query.edge radial classifications (EvaluateBinormalStepOff; the gen0091/gen0261 disagreement was the query.edge shim exporting SmPlane faces as B-splines, findings.md). Wired: query.loop (contains_uv_point takes &mut Brep and the loop id and calls GetOrCreateUVTrimCurve in walk order; the FaceLoop view is gone; query::face::p2::point_classify, classify_param_on_faces and api_queries::face_classify_uv take &mut Brep). Stub kept, justified (findings.md): UNPORTED(topology.edgeuse_p3) EvaluateBinormal in topology::proto_topology::p2 (opaque ProtoBrep handles, no Brep). API changes: is_tangent_sector, is_convex_radial_sector, evaluate_binormal_step_off take k and &mut Brep; faceuse_collect_adjacent takes k; topology::edge is_seam, is_seam_of_surface, is_topological, is_tangent_edge, uv_trim_curve_of_surface take k and/or &mut Brep; face::p2::create_curves_from_face takes &mut Brep; vertex_edge_gap, calc_vertex_edge_gap, edge_ccw_edge_gap, calc_edge_ccw_edge_gap, max_down_dim_gap_3d and the heal::gap constructors/setters take k (and &mut Brep). The graph export carries no gap lengths: GetOrCreateUVTrimCurve's distance for an existing curve with a set gap is not compared (findings.md).  [PR #155: the inexact-import deferrals are labelled topology.brep_p10 SmBrep::MakeTopologyFromData, not topology.brep_p7 SmBrep::ReadFromFile] UPDATE (PR #149): the 3 UNPORTED(topology.edgeuse_p3) sites of topology/brep/p2.rs (MateLaminaEdgeToSurface: GetOrCreateUVTrimCurve x2 with header defaults, NormalizedEvaluate 3D) are wired; report unchanged."
