notes = "Runner faces built as the shim builds them (fix/classify-face-point-268, 2026-10-22): CreateFaceFromSurface on a new_brep (was a bare loopless face of tolerance 0 on the Rust side only, which made sm_ClassifyFacePoint disagree on PR #268); 6 corner-model classify_face_point fixtures added. PARTIAL, 490 cases, 457 pass, 20 deferred (intersect.surface_drop_lib_p3 20: SmSurface::DropCurve making the faces' UV trim curves in CalculateUVDomainFromUVTrimCurves; 14 that compared a bare face before and the 6 new fixtures), 0 failed, 13 rejected, max_rel_err 0. PointBasedSurfaceIntersect wired to DoPointIntersection (area 6b, 2026-10-22): GREEN, 484 cases, 471 pass, 0 deferred (was intersect.surface_intersector_p4 7), 0 failed, 13 rejected, max_rel_err 0. PARTIAL (PR #147; edited by PR #264 blend.fillet_geom_p5: sm_TwoPntsIntersection's drops and the runner's SurfaceDropPoint name their surface (SurfaceHandle), CurveObjectHandle added, the model's pc_kind 4 (an SmEdge), four 1e-3 / 1e-6 seam fixtures; 480 -> 484 cases, 2000-seed sweep and fuzz counts below are from before that edit): difftest 484 cases (184 fixture in fixtures/blend.fillet_geom_p1/cases.json: noise cleanup, seam checks on a closed quadratic cylinder, closures, order checks, seam adjustment, the line/arc/parabola/Hermite interpolation branches, surface point drops, two-point intersections, mate evaluation inside and outside the domain, capping, a pseudo-B-rep model with every query, the HANG-29 / UB-166 / HANG-20 regression inputs and two near-zero curve-knot probes; 300 generated: random open/closed surfaces and curves at 1e-6..1e6 scales, tolerance-limit seam points, degenerate tangents, every SmSurfParamType closure, orientation and point class, random pseudo-B-rep models with random queries), 462 pass bit-identical (max_rel_err 0, both-errored 0, with_values 462, no_values 0), 0 failed, 13 rejected (fixtures flagged expected_rejection, the only ones a refusal may be recorded for: the FbExamine adjusting path, which the shim refuses, three HANG-29 inputs above the 1e150 bound, five UB-166 surfaces whose v knots the constructor's fixup moves onto the start knot (the shim reads the constructed vector back and refuses them for the six surface-cache ops only; the u over-multiplicity, non-monotone vectors and the other ops are compared) and four HANG-20 inputs above the 1e307 solver bound the FFI refuses), 9 deferred (intersect.surface_intersector_p4 7: sm_TwoPntsIntersection past its point drops (surface.surface_p2 stops at SmSurfaceIntersector::DoPointIntersection pending the intersector parts' virtual dispatch); intersect.surface_drop_lib_p1 2 (printed as intersect.surface_drop_curve, the label of that unit's stale stub): SmFilletVertex::CalcCliffRailIntEdge via SmSurface::GlobalCurveIntersect -> SmSurfaceDropCurve::DoTrace, ported but unwired in surface_drop_lib_p1 until its open PR #140); 2000-seed sweep 2051 pass / 116 deferred / 0 failed / 13 rejected (with_values 2051); --perturb SENSITIVE 462/462; --fuzz 2000 FUZZ-PASS (479 ran, 0 differs, crashes, panics, timeouts); fuzz_guards (per-call 30 s timeout, 180 s for the two ops reaching sm_ClassifyFacePoint; boundary specials incl. the HANG-29 slow range, the UB-166 knot gaps and the HANG-20 bound; a near-coincident-value mutation) found no crash or hang for the default seed at 60k calls and seeds 777 and 4242 at 40k (the earlier sweeps missed UB-166 and the slow HANG-29 inputs, and the widened specials then found HANG-20, so a clean sweep is evidence, not proof). Object model: FilletBrep = a topology::Brep plus side tables of fillet members keyed by VertexId/EdgeId/EdgeuseId/VertexuseId and the referenced FilletGeoms (FilletGeomId); SmFilletSolver*/SmFilletCorner* are opaque ids. Stubs replace only their call; the code after each is ported: SmFilletEdgeuse ctor -> SmBrep::GetInfiniteRegion (wired, topology.brep_p1 PR #145; the region itself comes from SmBrep(), so FilletBrep::new has none until UNPORTED(topology.brep_p3) SmBrep::SmBrep), SmRegion::GetShells (wired, topology.shell PR #154, no attribute filter as upstream's default), UNPORTED(topology.brep_p2) MakeShellVertexTopology, then the shell-owned edge use record; sm_CreateCubicRailRailInterpolant -> UNPORTED(blend.fillet_solver_p1) FindIndexOfRailOnFace, (blend.fillet_solver_p2) RailRailIntersect, then the degree-2 interpolant; sm_ExamineNFixFilletGeoms adjust path -> SmOffsetSurface::GetNaturalUVDomain (wired, surface.offset_surface PR #62), UNPORTED(intersect.surface_drop_lib_p3) SmSurface::DropCurve, then the mate edge use's UV curve (the solvers are passed in as co-ported ConstantRadiusAssistedFs; the shim refuses that path, SC_ERR_ARG, because its geometries have no SmFilletSolver and upstream dereferences it); SmFilletGeom ctor with a solver offset surface -> SmOffsetSurface::Copy (wired, surface.offset_surface PR #62; the kernel stands for the solver's creation context; no case reaches it, the shim's geometries have no solver). CO-PORTED in blend.fillet_geom_p1 (PR #147): SmFilletVertex(SmFilletCorner*), SmFilletEdge(SmFilletBrep*, SmFilletCorner*) (blend.fillet_geom_p2) -> blend::fillet_geom::p1::{FilletVertex::new, FilletBrep::new_fillet_edge}; SmFilletGeom(SmFilletSolver*, SmFilletGeomType) (blend.fillet_geom_p5) -> FilletGeom::new; SmFilletBrep() (blend.fillet_geom_p6) -> FilletBrep::new; smos_CleanUpNoise (SmMath.cpp, no owning unit) -> clean_up_noise; the one-line SmVertexuse/SmVertex/SmEdge::IsKindOf type tests (topology.vertexuse/vertex/edge) inlined privately. SmBoundaryTrimmingType is also co-ported, identically, by blend.fillet_standard_solver_p1 (PR #168): the second to land re-exports the other's. Upstream issues UB-159 (SmFilletGeom ctor leaves m_dOrientations/m_bCapped uninitialised), HANG-29 (SmCurve::GlobalCoincidenceChecker never returns for a surface control point >= 1e154 and is slow, shape-dependently, from about 1e15; for the two ops reaching sm_ClassifyFacePoint the FFI rejects Euclidean magnitudes above 1e150, the overflow regime, and accepts the slow inputs) and UB-166 (the SmBSplineSurface constructor's sm_FixupKnotVector snaps a first interior knot within the scaled zero of the start knot onto it, and sm_DecomposeSrf then writes one v-patch past the surface cache's patch array: SIGSEGV from sm_SurfaceDropPoint and sm_ClassifyFacePoint; the FFI refuses every surface whose snapped knot vector has start multiplicity above degree + 1; curves are safe, sm_CreateBezSegments skips such a start) and HANG-20 (SmGlobalSolver::SolveBranch with the point/surface, curve/surface and surface/surface local solvers never returns once a surface coordinate is in the top decade of the double range: cliff -7e307 returns / -8e307 never, point drop -3e307 / -7e307, two-point homogeneous -2e307 / -3e307, all return at -1e300; the FFI bounds SurfaceDropPoint, TwoPnts, FbVertOnVert and FbCliff at 1e307). The examine adjusting path (net-row copy, rail SetCurve resets, offset-distance save/restore, Unported at SmSurface::DropCurve) is covered by a Rust unit test with a solver only. Shim compiles SmFilletGeom.cpp into its translation unit for the file-static helpers. No UNPORTED(blend.fillet_geom_p1) stubs existed to wire. Plan notes: 111 fns; largest: sm_ExamineNFixFilletGeoms, sm_TwoPntsIntersection, SmFilletEdge::FindFilletBrepEdge, sm_InterpolateEndptsAndTangents; cycle back-edges (call into later units; stub or co-port): blend.fillet_solver_p1(6), blend.fillet_solver_p2(1); unit-SCC #22 (220 units); 319 upstream test entry points reach this unit; CO-PORTED in blend.fillet_intersector (PR #179): SmFilStatus -> solidcore::blend::fillet_intersector::FilStatus; the SmFilletGeom stores FlushCurve makes (SetFilletSurface, m_pCenterLineCurve, GetRail(i)->SetCurve, mate SetUVCurve) are FilletSolverOps methods (UNPORTED stubs) over the handle FilletSolverOps::FilletGeom Re-run in PR #238 (query.face_p1): sm_ClassifyFacePoint's SmFace::Point3DClassify is wired to query::face::p1::point_3d_classify (status compared to SM_SUCCESS, not propagated, as upstream); no case reaches it yet (they defer earlier), so the report is unchanged: 480 cases, 446 pass, 0 failed, 21 deferred, 13 rejected. UPDATE (PR #204, topology.brep_p3): FilletBrep::new makes SmBrep()'s infinite void region (topology::Brep::new_with_infinite_region, topology.brep_p10's co-port of the SmBrep() topology part), so the UNPORTED(topology.brep_p3) SmBrep::SmBrep stop in new_fillet_edgeuse is gone (a missing region is now SM_ERR_NULL_POINTER, upstream's unchecked dereference). FilletBrep::new keeps its kernel-free signature (about ten open fillet PRs call it), so the rest of SmBrep() is not applied to the pseudo B-rep: no context zone tolerance or size settings, no SM_NO_CONSTRUCTION notification (Constructors deviation). Report unchanged (480 cases, 446 pass, 0 fail, 21 deferred, 13 rejected)."
