notes = "PARTIAL: difftest 115 cases (19 fixtures: 8 box, 8 nurb_fillet, 3 cone; 96 generated), 95 pass, 3 deferred, 0 failed, 7 rejected, 10 known mismatches, max_rel_err of the passes 4.7e-11 (--seeds 1000: 1019 cases, 818 pass, 110 deferred, 0 failed; --perturb: all detected; 3 repeat runs identical, ASLR on). NOT IN callgraph/units.json: SmBrep::LocalOperation is unreached from any upstream test or SM_API entry point. Owns SmBrep::LocalOperation (SmBrep.cpp:11945) and the part of SmLocalOperationGeometryCreation the offset executive reads (OffsetExecutive::set_local_surfaces, LocalOperationGeometryCreation::faceuse_offset_with_backend). Rust: topology::brep::local_operation::local_operation; removes every face (p5::remove_faces) and copies the offset result in with a merge (p7::copy_faces) as upstream does. The runner replaces the surfaces of one to three faces of upstream .smb solids by planes derived from the faces' own surfaces (offset along the normal, tilted normal) by the real SmBrep::LocalOperation and by the port, and compares the status, the whole graph (topology, points, tolerances, intervals, UV domains) and samples of every edge curve and face surface; every C++ case it compares returns status 0. Known mismatches: Solids/nurb_fillet.smb x8 (only vertex, edge and face tolerances differ: plan/findings/topology.brep_local_operation--nurb-fillet-vertex-tolerances.md) and cone.smb x2 (zero coordinates differ by solver noise: plan/findings/topology.brep_local_operation--cone-zero-coordinate-noise.md); both are kept as named fixtures and left out of the generated cases. Deferred: SmFace::GetTolerance for a bare face handle (UNPORTED(topology.face_p2), reached by the plane intersect of the extended offset). Not compared: the edge uses' UV trim curves and the faces' Rust-only loops list (the Rust merge copy leaves UV trim curves on one face's edge uses where the native copy leaves none), a face of a replaced list twice (the first surface wins, as upstream), surfaces other than planes as replacements. Uncertified: the debug drawing code; the arena-only notification store of the merge copy. The runner shares topology.brep_mirror's helpers (geometry, native lists, face-shell normalisation)."
