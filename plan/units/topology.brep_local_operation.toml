notes = "GREEN: difftest 115 cases, 108 pass, 0 failed, 0 deferred, 7 rejected, 0 known mismatches (local integration run on bb06099f1: A1 region-list count, cone side flag, bind_owners tolerance sync). 7e-11 (--seeds 1000: 1019 cases, 818 pass, 110 deferred, 0 failed; --perturb: all detected; 3 repeat runs identical, ASLR on). NOT IN callgraph/units.json: SmBrep::LocalOperation is unreached from any upstream test or SM_API entry point. Owns SmBrep::LocalOperation (SmBrep.cpp:11945) and the part of SmLocalOperationGeometryCreation the offset executive reads (OffsetExecutive::set_local_surfaces, LocalOperationGeometryCreation::faceuse_offset_with_backend). Rust: topology::brep::local_operation::local_operation; removes every face (p5::remove_faces) and copies the offset result in with a merge (p7::copy_faces) as upstream does. The runner replaces the surfaces of one to three faces of upstream .smb solids by planes derived from the faces' own surfaces (offset along the normal, tilted normal) by the real SmBrep::LocalOperation and by the port, and compares the status, the whole graph (topology, points, tolerances, intervals, UV domains) and samples of every edge curve and face surface; every C++ case it compares returns status 0. The former known mismatches (Solids/nurb_fillet.smb x8: plan/findings/topology.brep_local_operation--nurb-fillet-vertex-tolerances.md and its region-list addendum; cone.smb x2: plan/findings/topology.brep_local_operation--cone-zero-coordinate-noise.md and its resolved addendum) are fixed; both solids stay as named fixtures, and generated cases on them run on their own seed stream (fcNNNN, 32 by default, <unit>:fillet_cone) so the gen stream is unchanged. Deferred: SmFace::GetTolerance for a bare face handle (UNPORTED(topology.face_p2), reached by the plane intersect of the extended offset). Compared since the A1 region-list fix: the edge uses' stored UV trim curves (sampled on both sides). Not compared: the faces' Rust-only loops list, a face of a replaced list twice (the first surface wins, as upstream), surfaces other than planes as replacements. Uncertified: the debug drawing code; the arena-only notification store of the merge copy. The runner shares topology.brep_mirror's helpers (geometry, native lists, face-shell normalisation)."
