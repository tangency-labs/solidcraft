fyProblem (same discriminants as the copies in PR #132 query::face::p3 and PR #239 topology::face::p4; whichever lands later keeps one and re-exports it). 6 fns; largest: SmFace::Point3DClassify, SmFace::EdgeCurveOnClassify, SmFace::CalculateBoundingBox, SmShell::CalculateBoundingBox; entry points: SmApiEvaluateCurve; unit-SCC #22 (220 units); 317 upstream test entry points reach this unit; CO-PORTED in topology.shell (PR #80, finished in PR #154): default-tight SmShell::CalculateBoundingBox vertex, wire (edge boxes of GetWireEdges, through query::edge::calculate_bounding_box), face-use (SmFace::CalculateBoundingBox: wired to query::face::p1 in PR #238) and unknown branches and SmRegion::CalculateBoundingBox aggregation -> topology::shell::{shell_bounds_for_degeneracy,region_bounds_for_degeneracy}; native status retained beside partial bounds; only the face call remains an explicit stub Re-run after query.face_p3 (PR #132) wired SectorClassifyCurveOn and CalculateTightBoundingBox (2026-10-20): 2224 cases, 1570 pass, 0 failed, 654 deferred, max_rel_err 0. Owner zone-tol cache (surface/owner-zone-tol): 2224 cases, 1580 pass, 0 fail, 644 deferred. Point3DClassify now builds the trimmed surface cache first (smsurf_GetSurfaceCache, SmFace.cpp:12792) and hands it to PointClassify (gen0160: C++ FACE from an inside leaf, confirmed by a C++ probe); its face walk is unported, so all 289 Point3DClassify cases on face-owned surfaces defer (topology.face_p2 'SmFace handle of a surface's face'); plan/findings.md."
