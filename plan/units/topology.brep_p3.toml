notes = "CO-PORTED in topology.brep_p10 (PR #130): SmBrep::SmBrep, the topology part (infinite void region heading the region list, m_pInfiniteRegion; m_bEditingEnabled is topology.brep_p1's field) -> topology::Brep::new_with_infinite_region. PARTIAL (PR #204): all 11 fns ported (stub at each unported call, tails ported). difftest 897 cases (497 fixtures from TestSmBrepCopy/TestSmErrorCodes/TestSmBrep/smOffsetTest/my_test_topology and SmBrep.cpp members on the 15 pt_TestFiles B-reps + network, incl. 30 TurnToNURBS cases on offset-wrapped faces; 400 generated; no face op on a B-rep without faces), 536 pass bit-identical, 0 failed, 361 deferred (topology.face_p3 161: SmFace::Notify; topology.face_p4 69: 39 SmFace::GetBrep via SwapUV, 30 SmFace::GetEdges in the offset cases after the approximation and extension; query.brep 49: CalculateBoundingBox; surface.sphere 33: SmSphere::IsNurbSurfaceSphere and surface.surface_p2 8: SmCone as SmSurface in the analytics copy (after main's surface.cone_p2 #153; they deferred at SmCone::IsNurbSurfaceCone before); topology.brep_p9 41: MakeShellVertex); --perturb SENSITIVE 536/536; with_values 536, 0 both-errored. Every op output (Construct, Copy, Merge, CopyVertices, DeleteFace, Wire, Orient, Squeeze, both TurnNurbs ops) ends with the B-rep counts, a shell digest (per region void/infinite/nshells, per shell type/GetSize/has_head) and the full topology graph (the fixture walk after the op: every owner / adjacency link as a walk index: region shells, shell type/size/region/head, face-use face/mate/shell/next/last/orientation/loop uses, face use, loop-use loop/mate/face use/start/orientation, loop use, edge-use edge/owner/cw/ccw/vertex use/next/last/orientation, edge-use and vertex-use lists); DeleteFace, Wire, Orient, Squeeze and both TurnNurbs ops run under SmTrackTopologyChanges on both sides, comparing its Rm/Add/Chg lists and every event, each object by its saved identity (never read): topology by walk index (C++: SmObject base addresses registered from the walks before and after the op), the B-rep, an edge's pre-op curve as that edge, else an edge's curve after the op as that edge (post-op walk index), other geometry numbered by first appearance in the output (C++: seen live as geometry by a user notify callback; a swap of two such transient objects within one event would not show, the documented boundary; unit test swapped_geometry_changes_the_output). Identities (module Deviations; overseer ruling on the 9129d9f2 reviews): topology keeps the NotifyEnv contract: the caller's env.key_of names b's objects, the caller's source_key those of a B-rep an edit reads (MergeBrep, CopyVertices, the copy constructors; restored after 2dc57273), and Brep::key each B-rep (keeping them distinct per object is the caller's part, as upstream's objects are the caller's); the records and attributes a caller keeps under them are used as they are, an object without a record gets the default one (edits seed with or_default, brep::p3::seed_records). Kernel-issued identities only for objects with no caller key: a curve = (domain, counter), issued once per context domain and kept on the Curve (GEOMETRY_KEY_BASE = 0b11 << 62; IdentitySlot, CO-PORTED into geom.context / curve.curve_p2); callers without notification state (brep::p3::with_kernel_callbacks, the healer's tracked_edit) name topology by (B-rep serial, kind, arena index) (brep::p3::topology_ref, TOPOLOGY_KEY_BASE = 0b10 << 62; the serial kept on the Brep, Brep::notify_serial, CO-PORTED into topology.brep_p1); both issued by the one context the notifications go through (env.context, else k.context), no public setter, a clone starts empty. Every edit refuses (InvalidInput) a caller key in the kernel range (>= KERNEL_KEY_BASE) before it changes anything, unless it is the object's own kernel identity (brep::p3::check_keys). The lending adapters (with_kernel_callbacks, tracked_edit; shared brep::p3::with_lent_context / kernel_named_edit) are not nestable: a nested one is refused before anything changes (Context::lend_notify; a lent context issues nothing). Boundary (Deviation): a kernel identity is unique and stable only within one domain, so every store keyed by identities (records, attributes, a tracker, a callback's state) belongs to one domain; shared across two contexts, or across a take_notify_lease that is not given back (a new domain), two curves or two kernel-named B-reps' objects may share a key; an object re-entering a domain is renamed, never aliased. Closing it needs a process-wide address space, which the no-global-state rule excludes. MakeWireEdge(Vertex) take the caller's unowned curve by value (upstream binds that object). Regressions: one_context_issues_the_identities_of_edits_in_two_kernels (R1, curves), caller_keys_cannot_take_a_kernel_identity (setter), copies_and_merges_carry_the_callers_records_and_attributes (C-M1 / C-M2), nested_lent_edits_are_refused and heal_data_p3's nested_tracked_edits_are_refused (C-M3 / P4), identities_are_unique_only_within_one_domain (P2b, the boundary), kernel_callbacks_keep_their_identity_domain, bound_curves_never_share_a_key, curve_keys_belong_to_their_context, curve_identities_survive_a_fresh_healer / _a_cloned_healer. Mutations: detaching every copied face use in MergeBrep fails 101 cases; corrupting the recorded ChangeGeometry curve fails 55. Boundary: no compared op sends a geometry-caller PostEdit / Split / Merge, so Execute's owner walk (the runner's tracker knows each pre-op curve's owner edge) is covered by its Rust regression only. Success paths (384): 35 constructors, 79 copies (copy constructor / SmApiBrepCopy), 43 MergeBrep, 49 MakeWireEdge(Vertex), 10 completed SqueezeEdge (network wires), 94 OrientTrimmedSurfaces that swap nothing, 47 TurnToNURBS (nothing converts), 27 CopyVertices([]); error statuses (152): 82 DeleteFace (editing disabled), 69 SqueezeEdge guards, 1 SmApiBrepCopy(NULL) (committed #[ignore] test classify_passes). No passing case for a completed DeleteFace, a swapping or vote-deciding Orient, or a converting TurnToNURBS (face_p3/face_p4/query.brep). --fuzz 2000 FUZZ-PASS; valgrind clean (status/topology.brep_p3-evidence). Wired: topology.shell (region void flag, GetShells, region/shell/face-use lists, TransferChildrenTo, GetSize; CO-PORTED region PostInsert, single face-use Remove/PostInsert, pub GetSize into topology::shell), topology.edgeuse_p3 (NormalizedEvaluate), surface.offset_surface (TurnToNURBS offset arm). Back-edges wired: sweep.api_brep/api_surfaces (SmBrep()), heal.heal_data_p3 (SqueezeEdge, DeleteFace under a real SmTrackTopologyChanges; SmTopologyChangeCallback::Execute CO-PORTED into topology.topology), IntersectorBrep::brep_delete_face, ProtoBrep::brep_squeeze_edge; every edit seeds the SmTopology records of its objects and of a source B-rep it copies or merges from that the caller keeps none for (the copy cases' Construction / Copy notifications name the source's). Upstream: WR-168. Was: 11 fns; largest: SmBrep::MergeBrep, SmBrep::OrientTrimmedSurfaces, SmBrep::DeleteFace, SmBrep::SqueezeEdge; entry points: SmApiBrepCopy; cycle back-edges (call into later units; stub or co-port): blend.fillet_geom_p1(2), query.brep(1); unit-SCC #22 (220 units); hazards: ptr-hash; 200 upstream test entry points reach this unit UPDATE (PR #204, scope-back + #149 da779c51 merge, main through 95b823ed): identities scoped back per the overseer ruling on the 9129d9f2 reviews (caller key_of / source_key / Brep::key for topology; kernel-issued IdentitySlot identities only for curves and stateless callers; nested lent edits refused with InvalidInput before anything changes; the identity-domain boundary in Deviations). Stubs wired: SmFace::Notify -> topology::face::p3::notify (no trim cache), SmBrep::MakeShellVertex -> topology::brep::p9::make_shell_vertex (CopyVertices). 897 cases, 664 pass, 0 fail, 233 deferred (topology.face_p4 126, query.brep 49, surface.sphere 33, topology.face_p3 17 via face p1's SmFace::Notify stub, surface.surface_p2 8), max_rel_err 0; case by case vs the committed report: 128 deferred -> pass (87 SmFace::Notify, 41 MakeShellVertex), 57 relabel SmFace::Notify -> face_p4 GetVertices, no other outcome change; --perturb 664/664; --fuzz 2000 FUZZ-PASS. UPDATE (PR #204, Codex review of 255d52b7): (1) the reserved-key check also covers the objects an edit may allocate (brep::p3::prospective_entities: the next ids of every kind, arenas only append, within allocation_window = the B-rep's object count + 3 x a read source's + 16), so a new object cannot take a curve's or a kernel-named object's key (regression new_objects_cannot_take_a_reserved_key); (2) a copy is named by the caller's destination mapper (Brep::key = env.key_of(Brep) before anything is notified; regression copies_take_their_own_caller_identity), and new_brep reports its construction under the new B-rep's own kernel identity (enrolled, as with_kernel_callbacks later names it; Brep::key stays the caller's; regression new_breps_construct_under_their_own_identities); (3) topology.brep_p5's plain entry points run their whole edit under the kernel's identities (p5::plain_edit; regression plain_p5_edits_of_two_breps_never_share_a_key, also covering a nested plain p5 edit refused before anything changes); (4) merge_p3 / merge_p4's SmBrep, copy constructor and MergeBrep wired (cfb7bed2). UPDATE (PR #204, Opus review of 255d52b7): #283's five UNPORTED(topology.brep_p3) back-edges are all wired: boolean/merge/p3.rs empty_brep (brep::p3::new_brep), copy_brep (brep::p3::copy_brep) and combine_brep (brep::p3::merge_brep), boolean/merge/p4.rs new_component_brep (Brep::new_with_infinite_region; kernel held shared), and the boolean.merge_p3 difftest runner's empty_brep (brep::p3::new_brep). Context::take_notify_lease / restore_notify_lease are refused (Result) while a crate edit has lent the context (the nested-lend refusal cannot be bypassed through them; regression in nested_lent_edits_are_refused); the lending helpers use the crate-internal take_lease / install_lease. kernel_named_edit's doc says flags are not kept between such edits. UPDATE (PR #204, Codex re-check of 6b04141d): M1: CopyVertices' key check covers three new objects per input-list entry, repeated entries included (allocation_window takes the input count; with_caller_identities_for), so Codex's repro (one shell vertex copied 30 times, the 30th new vertex keyed like a curve) is refused before anything changes (regression copy_vertices_checks_a_key_for_every_entry). M3: kernel_named_edit seeds a default SmTopology record for every existing object of the B-rep when its environment is made, so a plain part-5 edit's first notifications (DeleteTopologicalVertex's edge MergeInBrep on the A--B--C wire, sent before any p3 edit) reach the callback (regression plain_p5_edits_deliver_their_first_notifications; fails without the seeding). Gate on e326597e (main through 7b57d8de, #351): 897 cases, 684 pass, 0 fail, 213 deferred; case by case 20 surface.sphere deferrals pass (main's CopyAndAddAnalytics sphere wiring) and 13 relabel to surface.surface_p2; --perturb 684/684; FUZZ-PASS 2000; valgrind clean on 33 filters; 35 touched units 0 failed; difftest cpp self-tests 180 pass; green 237 units, 0 failed. UPDATE (PR #204, merge of main 7eb93aa4, #364): SmFace::SwapUV in OrientTrimmedSurfaces notifies PRE/POST_EDIT through the edit's environment (topology::face::p1::swap_uv_with_notifications), with (this, NULL, NULL) as upstream (SM_NO_GET_BREP is a null pointer); the 31 orient *_swap0 cases, in which SwapUV runs, defer under harness:surface-notify-identity (upstream's surface SwapUV notifies the surface's own edit through SetCanonical, SmBSplineSurface.cpp:4585/4592, and a Rust Surface has no notify IdentitySlot; follow-up: co-port it, then un-defer; plan/findings.md). Report: 897 cases, 684 pass, 0 fail, 213 deferred (harness:surface-notify-identity 31, query.brep 57, surface.surface_p2 21, topology.face_p3 47, topology.face_p4 57); case by case no outcome change, 30 face_p4 -> face_p3 and 8 face_p4 -> query.brep relabels. boolean.merge_p2's MergeBrep::orient_trimmed_surfaces is wired (a required method); its MakeWireEdge stays an integration gap (see boolean.merge_p2). Re-run: topology.brep_p7 316/240/76 (3 deferred -> pass, 30 relabels; its 3 MakeWireEdge deferrals are the merge_p2 gap), boolean.merge_p3 387/222/165 (37 relabels to topology.brep_p4 StitchFaces); brep_p5, merge_p1, merge_p2, face_p1 unchanged. UPDATE (PR #204, re-check of 766472a1): harness:surface-notify-identity is removed. Orient outputs split into out (always compared), swapped (each face's SwapUV POST_EDIT count from that side's own events, always compared) and tracker (left out only by a side whose events show a swap; the surface's SetCanonical edit is not notifiable in Rust yet), from a trailer the shim and runner both emit. The 31 *_swap0 cases now pass on out + swapped (97 to 1162 values each). Report: 897 cases, 715 pass, 0 fail, 182 deferred (query.brep 57, surface.surface_p2 21, topology.face_p3 47, topology.face_p4 57); case by case only those 31 deferred -> pass. boolean.merge_p2 unchanged (45/30/0/15). MakeWireEdge: MergeContext::Shared carries &mut Kernel and is wireable; left for the follow-up with Split. UPDATE (PR #204, main merge 2026-10-21 + SmFace::GetVertices wired to topology::face::p4::vertices with upstream defaults): 897 cases, 761 pass (max_rel_err 0), 0 fail, 136 deferred (was 715 / 182). SweepStore constructors/copies bind geometry to NotifyEnv topology owners. turn_to_nurbs_with_geometry_owners supports caller-key transforms; the original wrapper and WR-168 deviation are retained. Runner/shim (#556, 2026-10-23): DeleteFace records also compare the number of SM_NO_DESTRUCTION notifications of edges (~SmEdge) the op sends, after the tracker (13 of the 90 delface cases destroy an edge through DeleteEdge; without the edge destruction path they fail). 897 cases, 812 passes, 0 failed