ve database records, explicit out-of-bounds restoration through the inherited Ellipse setter, native non-mutation/read-write checks and independent raw-base bit checks. Adds 128 wire cases covering tangent, trim, reverse and ODE values across senses, orientations, scales, trimmed and non-unit intervals. CI at 8fc5cb710 (run 40062996668): 1915/1915 with values, zero failures/deferrals/empty/vacuous passes, max relative error 0. The 72 revolution regressions remain. Analytic UV curves and unrelated curve kinds stay unsupported. CO-PORTED in topology.brep_validation (PR #961): SmEdge::ValidateGeometry(FALSE) -> topology::brep::validation::pointers::check_edge_geometry (private), preserving endpoint/owner statuses and native reversal repairs; warning-only diagnostics retain their evaluations. [#1419 WP4a: SmEdge::IsOnFaceEdgeForm and sm_AssertTestEdge13 -> topology::edge::edge_form (Edge AssertValid test 13); IsOnFaceEdgeForm reads only the cached GetMaxEdgeFaceGap, it does not call CalcEdgeFormFromFaces. New EdgeForm op (translate the edge curve, then IsOnFaceEdgeForm) with 1034 cases in fixtures/topology.edge/edge_form.json (15 upstream .smb files with and without rebuilt UV trims and cached gaps, curves moved 1e-7..5e-2, the wire network, a line wire, planar faces): PASS topology.edge cases=2949 passed=2949 failed=0 deferred=0 max_rel_err=0e0 with_values=2949 no_values=0 vacuous=0] CO-PORTED in topology.brep_planar_section (PR #1534): SmEdge::IsEmbedded -> topology::edge::is_embedded. CO-PORTED in blend.feature_executive (PR #1851): SmEdge::GetEdgeNumberInBrep -> crate::blend::feature_executive::edge_number_in_brep."
