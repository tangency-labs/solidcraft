ged handwritten boolean_merge_p3 entry point. Empty results reuse the real infinite-region constructor. No fabricated topology, default context, tolerance loosening, or successful empty construction bypass is introduced. See plan/findings.md and reports/difftest/offset.offset_executive_p2.json. PR #452 on main 1b7f638e6 supersedes the FaceuseOffset self-boundary above: the shared creator now feeds owned surface/SSI output to the existing p1 builder through a private adapter, with real inset mate assignment and separate source/result notification keys. Canonical x86-64 CI run 39738195736 retains 322/141 passed/164 deferred/17 rejected/0 failed; all 100 self-deferrals reach actual callees, 50 SmSurface::DropCurve and 50 the non-B-spline CrvOnSurf constructor. Current deferred totals: intersect.surface_drop_lib_p3 65, curve.crv_on_surf 50, topology.brep_p3 32 (copy constructor), topology.brep_p4 11, harness:offset-result-adapter 6. The full canonical differential gate has 252 units, 134 passed, 118 partial, zero failed. The two stale MakeWireEdgeVertex runner-test assertions are updated to the observed DropCurve boundary; no obsolete stub is restored. The unit stays partial; no complete offset shape or new whole-operation comparison pass is claimed. UPDATE (PR #796): the merging PiecewiseMerge runs SmMerge::PiecewiseMerge (UNPORTED(boolean.merge_p3) wired) in a SweepStore over the caller stores: the offset temporary keeps the result identities (adopt_brep), the merge B-rep and the face B-reps take OffsetNotifications::merge_identities; the no-SSI relation names surfaces by merge surface identity. Fixes found on the way: MakeEdgeTopology and GlueEdgesGeneral delete the merged shell (orphan vertex shells changed the result shell count), side walls are built under the result identities, the store registers RegisterExistingSSI pairs for the next Merge. difftest (main a98c7cc81, after #783) 322 cases: 205 passed (was 188), 0 failed, 97 deferred (was 114: topology.brep_p3 42