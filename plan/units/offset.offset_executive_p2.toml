notes = "6 fns; largest: SmOffsetExecutive::DoExtendedOffset, SmOffsetExecutive::DoSolidOffset, SmOffsetExecutive::ShellBrep, SmApiShellBrepFull; entry points SmApiOffsetBrepFull/SmApiShellBrepFull; 11 upstream test entry points. PR #201 with prerequisite #175 and main ca3bbd2b integrated: six dispatchers and executable prefixes, not completed constructive offset/shell assembly. Default native run: 322 cases (82 fixtures + 240 generated), 141 passed with values, 164 deferred, 17 native constructor rejections (8 box, 9 sheet), 0 failed; max_rel_err=0, rel_tol=1e-9, no absolute floors; sensitivity 141/141. The p2 report is byte-identical to c430024c. Certified parity remains null/selection/radius errors, executive flags/state, ordered provenance, ownership/presence and documented input geometry/purity projections; full box adjacency and returned-shape equivalence are not certified. Deferred: executive FaceuseOffset geometry/SSI bridge 100, query.brep 7, topology.brep_p3 47 (copy constructor 32, MakeWireEdgeVertex 15), topology.brep_p4 10. Copy-face mapping now calls the shared p1 live-kernel wrapper with real original/result identities; external p1 APIs retain None/Some semantics. Boolean tolerance configuration delegates to the landed merge_p2 MergeState::with_breps, preserving adapter options/flags/relations, signed operand order and explicit angular arithmetic; no constructor is duplicated or falsely deferred. New wire/face-copy callbacks use caller-supplied NotificationKeys, including namespace-backed callers. The three-way extended-face trim continuation is ported: native owning-list order and active marks, temporary ReplaceSurface(Keep, false), unrestricted trim-domain calculation, original-before-extension containment with EFF_ZERO, and real restoration before SM_ERR; restoration errors win. Its initial SmFace::Notify dependency still prevents live swap/restoration parity, so pure decision/mark/callback tests are not constructive-shape certification. The 100 FaceuseOffset self-deferrals remain an explicit separate kernel OffsetBrep/SSI-store bridge; #288 owns only its narrow vertex backend, coordinated in that PR. Caller records/attributes/contexts are real, result/source keys remain disjoint, and Boolean records are restored on errors and unwind; late deferred ownership reflects actual Rust slots, not native flag parity. Native box/sheet/wire counts are verified before selectors without size cutoffs or unprojected shell restrictions; the box finding is WR-209. Shared native-call serialization protects the observer, including the newly merged handwritten boolean_merge_p3 entry point. Empty results reuse the real infinite-region constructor. No fabricated topology, default context, tolerance loosening, or successful empty construction bypass is introduced. See plan/findings.md and reports/difftest/offset.offset_executive_p2.json."
