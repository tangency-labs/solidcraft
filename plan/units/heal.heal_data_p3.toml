notes = "9 fns; largest: SmHealData::HealTgts, SmHealData::Fix_SplitEdgesAtSeam, SmHealData::Fix_DegenFaces, SmHealData::UpdateTargetLists; unit-SCC #22 (220 units); 59 upstream test entry points reach this unit; PR #164: 474 difftest cases, 267 passed, 0 failed, 207 deferred (topology.brep_p1 50, topology.edgeuse_p3 74, topology.face_p2 61, topology.face_p3 20, topology.face_p4 2), max_rel_err=0, no absolute floors. Ports all 9 owned functions and wires HealBrep to HealTgts; target catch-up recursion bounded at 32. Topology mutations defer at their owning units; generic nonempty classification outputs require a typed resolver when those callees land. Maintainer review: restored seam-success flags, cross-face merge statuses/edge list, last-occurrence wire dedupe, null-face skips and ignored statuses; native incremental-voxel catch-up guard (UB-36), 20 review fixtures and 3 independent safe-FFI regression tests. FindEdgeObjects now calls p7 after merging PR #65; IsLiveTopologyMember co-port recorded under topology.brep_p1. Round 2: reject post-removal target/props drift for every kind before any nonempty add (UB-163), bound target-to-props lookups, and derive voxel checks from target counts/live adds. FindEdgeObjects resolver errors propagate. The p5 adapter retains completed merge outputs on failure; actual mutation remains deferred. Added 24 differential regressions and a 240-combination native safety matrix (5 FFI tests total). [topology.edgeuse_p3 merged (PR #117): the 74 topology.edgeuse_p3 deferrals now run, 12 pass and 62 defer further on topology.face_p2: 474 cases, 279 pass, 0 failed, 195 deferred (topology.face_p2 123, topology.brep_p1 50, topology.face_p3 20, topology.face_p4 2)] UPDATE (PR #145, topology.brep_p1): the 50 topology.brep_p1 deferrals (SmBrep::GetThisModelSizeEstimate) continue to SmBrep::SetTolerance in Fix_TolSizes: 474 cases, 267 pass, 0 failed, 207 deferred (topology.edgeuse_p3 74, topology.face_p2 61, topology.brep_p2 50, topology.face_p3 20, topology.face_p4 2); report re-run. heal_data_p3's private co-port `live` (SmBrep::IsLiveTopologyMember) now calls the owner's port topology::brep::p1::is_live_topology_member (identity on the face/edge/vertex lists; same answers on every case: Rust has no entity removal yet and other kinds fall through the target match), report unchanged. [topology.face_p3 wired (PR #139): the 20 topology.face_p3 deferrals now defer inside IsDegenerate at the SmCurveClassification constructor (intersect.curve_class_p4); counts: see reports/difftest/heal.heal_data_p3.json] UPDATE after topology.brep_p2 (PR #149) wired SmBrep::SetTolerance: the 50 topology.brep_p2 deferrals now run Fix_TolSizes on: 474 cases, 314 pass, 0 failed, 160 deferred (topology.edgeuse_p3 74, topology.face_p2 61, topology.face_p3 20, topology.shell 3, topology.face_p4 2), max_rel_err 0. Re-run after merging #145 5b1b28ae (main through e1ae2640) into #149: 474 cases, 329 pass, 0 fail, 145 deferred (topology.face_p2 123, topology.face_p3 20, topology.face_p4 2), --perturb SENSITIVE 329/329. The Fix_BadSheets step builds an empty notify state (brep::p2::RegionNotifyState: empty AttributeStore, default region records) for the region split's SmBrep::Notify: the heal path carries no attribute state at any level, so SmSAGObject attribute propagation during healing is not modelled (plan/findings.md); thread an env from heal_targets once heal gains an AttributeStore. Re-run in PR #149 (review 5578349117 round, merged with main through fb58ea76; topology.brep_p2's UNPORTED stubs wired): 474 cases, 329 pass, 0 fail, 145 deferred (topology.face_p2 123, intersect.curve_class_p2 20, topology.face_p4 2); 50 SmBrep::SetTolerance deferrals pass. Owner zone-tol cache (surface/owner-zone-tol): 478 cases, 401 pass, 0 fail, 77 deferred."
