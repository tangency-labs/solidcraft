# #434 carries tangency-labs/smlib 1b6f5fa: CoverCoincidentSurface no longer merges a face
# onto a B-spline continuation that folds. These seven generated cases ask for exactly such
# a cover (a random rational surface whose Du x Dv normal turns back at the corner of the
# domain the merge would use), which C++ still merges, so they move from pass to
# known_mismatch by design: plan/findings/surface.surface_p3--cover-refuses-a-folded-continuation.md,
# plan/upstream-issues/WR-407. They become `deviation(#434)` (and these waivers go) once
# difftest has that outcome (#989).
