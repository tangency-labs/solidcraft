notes = "PARTIAL (PR #169, merged after dependency PR #154): 498 difftest cases, 450 passed, 0 failed, 48 deferred (topology.brep_p2 6: SmBrep::Notify; topology.brep_p1 23: SmBrep::GetInfiniteRegion inside CreateWireEdgeFromCurve, wired to topology.brep_p5 in PR #194, whose copy notifications follow behind a topology.brep_p2 key-routing barrier; topology.face_p3 19: SmFace::SetTolerance), max_rel_err 0, no absolute floors. Of the explicit op-0 cases, 369 return before acquiring a mark (separated mates or lamina); six tiny planes are edgeless and defer after closed traversal at Notify. 56 new open_box sheet cases reach ClosureTraversal and the open return: seeds 0/5 have no lamina edges and mates in the same shell. They compare actual nonzero context increments (MARK +4 per call without a caller lock), lock release, all faceuse marks and shell links over held locks and repeats. Other passing inputs are empty CopyEdges and null-surface MakeFaceTopology. MakeFaceTopology shim always has empty loops/edgeuses/loop-vertices and no explicit region: loop validation and existing-shell branches are not compared; every non-null surface defers at SetTolerance. No nonempty copy, successful face construction or completed split is certified; dependent mutation/classification/cleanup remains deferred. New shell/region identities and shell links use native -3, distinct from null -1. Wired heal.heal_data_p1 using RegionSplitAttempt: only ordinary native status may be ignored, preserving partial outputs; Unported and Rust representation errors propagate. Reused traverser HasLaminaEdge and the latest shell mark-lock API. Sensitivity detects 450/450 perturbations, with zero empty outputs. Four kernel and four native FFI regressions cover status/outputs and prove the open-sheet traversal advances marks. 3 fns; largest: SmBrep::TestClosureSplitRegion, SmBrep::MakeFaceTopology, SmBrep::CopyEdges; cycle back-edges (call into later units; stub or co-port): topology.brep_p1(3), topology.brep_