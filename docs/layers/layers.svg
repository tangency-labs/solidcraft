<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1120" height="780" viewBox="0 0 1120 780">
  <title>layers</title>
  <g id="Layer_1" data-name="Layer 1">
    <path d="M0 0 L1120 0 L1120 780 L0 780 Z" fill="#ffffff"/>
    <text transform="matrix(1 0 0 1 40 44)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="20" font-weight="bold" fill="#000000"><tspan x="0" y="0">One operation through the layers</tspan></text>
    <path d="M108 80 L952 80 C956.418 80 960 83.582 960 88 L960 164 C960 168.418 956.418 172 952 172 L108 172 C103.582 172 100 168.418 100 164 L100 88 C100 83.582 103.582 80 108 80 Z" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10"/>
    <text transform="matrix(1 0 0 1 116 108)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="15" font-weight="bold" fill="#000000"><tspan x="0" y="0">App (SolidCraft, or any app)</tspan></text>
    <text transform="matrix(1 0 0 1 116 130)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">The user picks two edges and r = 2. The app turns that into the command solid.fillet(edges, r),</tspan></text>
    <text transform="matrix(1 0 0 1 116 148)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">and draws what comes back. It holds the document and computes no geometry.</tspan></text>
    <path d="M30 222 L1090 222" fill="none" stroke="#999999" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="8 6"/>
    <text transform="matrix(1 0 0 1 40 214)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" font-weight="bold" fill="#555555"><tspan x="0" y="0">App</tspan></text>
    <text transform="matrix(1 0 0 1 40 242)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" font-weight="bold" fill="#555555"><tspan x="0" y="0">solidcore</tspan></text>
    <text transform="matrix(1 0 0 1 505 214)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#555555"><tspan x="0" y="0">crossed only through ops and tess</tspan></text>
    <path d="M108 280 L472 280 C476.418 280 480 283.582 480 288 L480 364 C480 368.418 476.418 372 472 372 L108 372 C103.582 372 100 368.418 100 364 L100 288 C100 283.582 103.582 280 108 280 Z" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10"/>
    <text transform="matrix(1 0 0 1 116 308)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="15" font-weight="bold" fill="#000000"><tspan x="0" y="0">solidcore-ops</tspan></text>
    <text transform="matrix(1 0 0 1 116 330)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">The fillet recipe: resolves the picked edges, chooses</tspan></text>
    <text transform="matrix(1 0 0 1 116 348)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">the defaults, calls the kernel in order, returns the result.</tspan></text>
    <path d="M648 280 L1012 280 C1016.418 280 1020 283.582 1020 288 L1020 364 C1020 368.418 1016.418 372 1012 372 L648 372 C643.582 372 640 368.418 640 364 L640 288 C640 283.582 643.582 280 648 280 Z" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10"/>
    <text transform="matrix(1 0 0 1 656 308)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="15" font-weight="bold" fill="#000000"><tspan x="0" y="0">solidcore-tess</tspan></text>
    <text transform="matrix(1 0 0 1 656 330)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">Meshes the new faces for display. The mesh only</tspan></text>
    <text transform="matrix(1 0 0 1 656 348)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">shows the body; it decides nothing.</tspan></text>
    <path d="M108 430 L472 430 C476.418 430 480 433.582 480 438 L480 514 C480 518.418 476.418 522 472 522 L108 522 C103.582 522 100 518.418 100 514 L100 438 C100 433.582 103.582 430 108 430 Z" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10"/>
    <text transform="matrix(1 0 0 1 116 458)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="15" font-weight="bold" fill="#000000"><tspan x="0" y="0">solidcore-convert</tspan></text>
    <text transform="matrix(1 0 0 1 116 480)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">The body&apos;s record becomes the kernel&apos;s B-rep, field</tspan></text>
    <text transform="matrix(1 0 0 1 116 498)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">by field, and the result goes back the same way.</tspan></text>
    <path d="M648 430 L1012 430 C1016.418 430 1020 433.582 1020 438 L1020 514 C1020 518.418 1016.418 522 1012 522 L648 522 C643.582 522 640 518.418 640 514 L640 438 C640 433.582 643.582 430 648 430 Z" fill="#f0f0f0" stroke="#000000" stroke-width="1.5" stroke-miterlimit="10"/>
    <text transform="matrix(1 0 0 1 656 458)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="15" font-weight="bold" fill="#000000"><tspan x="0" y="0">solidcore-record</tspan></text>
    <text transform="matrix(1 0 0 1 656 480)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">The new body as data: faces, edges, surfaces and</tspan></text>
    <text transform="matrix(1 0 0 1 656 498)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">curves, each face&apos;s definition with its net.</tspan></text>
    <path d="M108 580 L472 580 C476.418 580 480 583.582 480 588 L480 664 C480 668.418 476.418 672 472 672 L108 672 C103.582 672 100 668.418 100 664 L100 588 C100 583.582 103.582 580 108 580 Z" fill="#dce9f5" stroke="#1f6fb2" stroke-width="3" stroke-miterlimit="10"/>
    <text transform="matrix(1 0 0 1 116 608)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="15" font-weight="bold" fill="#000000"><tspan x="0" y="0">solidcore (the kernel)</tspan></text>
    <text transform="matrix(1 0 0 1 116 630)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">Builds the round (spine, rails, section), certifies its</tspan></text>
    <text transform="matrix(1 0 0 1 116 648)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">net against its definition, or refuses, naming the</tspan></text>
    <text transform="matrix(1 0 0 1 116 666)" x="0" y="0" xml:space="preserve" font-family="Helvetica" font-size="12" fill="#000000"><tspan x="0" y="0">size that fits.</tspan></text>
